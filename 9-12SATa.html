<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT Reading Practice - Set 9-10d</title>
<style>
    /* General Styles */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        position: relative;
    }
    h1 {
        text-align: center;
        color: #1a5276;
    }
    
    .print-blank-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        background-color: #7f8c8d;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 4px;
        color: white;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
    }
    .print-blank-btn:hover {
        background-color: #616a6b;
    }

    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #f9f9f9;
        padding: 15px;
        border-left: 4px solid #1a5276;
        margin-bottom: 20px;
        font-size: 1.05em;
    }
    .prompt {
        font-weight: bold;
        margin-bottom: 15px;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 10px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #f0f3f4;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #d5dbdb;
    }
    .options label:hover {
        background: #e5e8e8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }
    .options input {
        margin-right: 15px;
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 4px;
        display: none;
        border-left: 4px solid;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #1e8449;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #c0392b;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #eee;
        padding-top: 20px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #1a5276;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #154360; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    .check-btn { background-color: #d35400; }
    .check-btn:hover { background-color: #a04000; }
    .check-btn:disabled { background-color: #e59866; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #1e8449; }
    
    #results {
        display: none;
        text-align: center;
        padding: 20px;
        background: #eafaf1;
        border: 2px solid #2ecc71;
        border-radius: 8px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        color: #7f8c8d;
    }

    #harvard-reward {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #fff;
        border: 3px double #a51c30;
        border-radius: 8px;
        animation: pullUp 0.5s ease-out;
    }
    #harvard-reward img {
        width: 160px;
        height: auto;
        margin: 15px auto;
        display: block;
    }
    .harvard-text {
        color: #a51c30;
        font-family: Georgia, serif;
        font-size: 1.4em;
        font-weight: bold;
        letter-spacing: 1px;
    }

    #print-blank-container {
        display: none;
    }

    @keyframes pullUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* Printer Friendly Styles */
    @media print {
        body { background-color: white; padding: 0; }
        
        #quiz-container { box-shadow: none; max-width: 100%; border: none; padding: 0; }
        .question-block { 
            display: block !important; 
            page-break-inside: avoid; 
            border-bottom: 1px solid #ccc; 
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .nav-buttons, .check-btn, .progress-tracker, button, .print-blank-btn { display: none !important; }
        .options label { border: none; padding: 5px 0; background: transparent; }
        .options input { appearance: auto; } 

        #harvard-reward {
            display: block !important;
            border: 2px solid #a51c30 !important;
        }

        /* Override for Blank Print Mode */
        body.print-blank-mode #quiz-container { display: none !important; }
        body.print-blank-mode #print-blank-container { display: block !important; }
    }

    @media screen and (max-width: 600px) {
        .print-blank-btn {
            position: relative;
            top: 0;
            right: 0;
            display: block;
            margin: 0 auto 20px auto;
        }
    }
</style>
</head>
<body>

<div id="quiz-container">
    <button class="print-blank-btn" onclick="printBlankQuiz()">🖨️ Print Blank Quiz</button>
    <h1>SAT Reading Practice - Set 9-10d</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>Quiz Complete</h2>
        <p id="score-display" style="font-size: 1.5em; font-weight: bold;"></p>
        <p>Review your answers and explanations below.</p>
        
        <div id="harvard-reward">
            <div class="harvard-text">★ FLAWLESS ACADEMIC EXCELLENCE ★</div>
            <img src="https://raw.githubusercontent.com/mr-chen-k12/math/main/IMG_0232.png" alt="Harvard University Crest">
            <p style="color: #555; font-style: italic; font-weight: bold; margin-top: 5px;">You have successfully earned the Harvard University verification crest for achieving a perfect 10/10 score.</p>
        </div>

        <button onclick="window.print()" style="margin-top: 15px;">🖨️ Print Results</button>
    </div>

    <div id="questions-wrapper">
        <!-- Questions injected here -->
    </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit for Review</button>
    </div>
</div>

<div id="print-blank-container"></div>

<script>
    const quizData = [
        {
            passage: "While the chief editor's initial review of the draft manuscript was described as _______, focusing only on glaring typos and broad structural notes, her second pass was scrupulously thorough.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["cursory", "exhaustive", "fastidious", "incisive"],
            correctAnswer: 0, // A
            explanation: "'Cursory' means hasty and therefore not thorough or detailed. The text contrasts this initial pass with her second pass, which was 'scrupulously thorough'."
        },
        {
            passage: "Urban heat islands occur when cities replace natural land cover with dense concentrations of pavement and buildings that absorb heat. Environmental scientists studying metropolitan microclimates found that replacing traditional dark roofing materials with reflective cool roofs or vegetation can reduce surface temperatures by up to 30°F. Furthermore, expanding urban tree canopies provides shading and evapotranspirational cooling, lowering ambient air temperatures during heatwaves. Consequently, integrating reflective surfaces and urban forestry into municipal zoning offers a targeted strategy to mitigate urban heat risks.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Dark roofing materials are required by municipal zoning codes in most major cities.",
                "Implementing reflective roofing and urban forestry provides an effective strategy to combat urban heat islands.",
                "Evapotranspirational cooling from trees eliminates the need for air conditioning in metropolitan centers.",
                "Surface temperatures in cities are entirely unaffected by natural land cover."
            ],
            correctAnswer: 1, // B
            explanation: "The passage outlines the causes of urban heat islands, highlights solution strategies like reflective roofs and urban trees, and concludes that combining them offers a targeted mitigation strategy."
        },
        {
            passage: "Marine geologists studying seabed sediment cores near hydrothermal vents discovered high concentrations of iron and manganese isotopes deposited during periods of heightened volcanic activity. These trace metals act as essential nutrients for phytoplankton growth in surface waters when transported upward by ocean upwelling currents. During these volcanic intervals, satellite proxy data reveal a corresponding surge in surface biological productivity. This correlation suggests that deep-sea volcanic eruptions _______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "can indirectly stimulate surface marine ecosystems by supplying vital nutrients.",
                "permanently sterilize the surrounding ocean waters through toxic chemical releases.",
                "have no measurable impact on global ocean nutrient cycles.",
                "prevent upwelling currents from reaching upper ocean layers."
            ],
            correctAnswer: 0, // A
            explanation: "Because volcanic activity deposits nutrients that upwelling currents transport to the surface—causing surges in biological productivity—it follows that deep-sea eruptions can indirectly stimulate surface marine ecosystems."
        },
        {
            passage: "In his 2021 monograph, historian Dr. Marcus Vance reexamined the economic factors behind medieval trade guilds. <b>Specifically, Vance synthesized guild charter records across Western Europe to demonstrate that guilds functioned primarily to set standardized quality controls and enforce apprentice training, rather than simply acting as price-fixing cartels.</b> This analysis challenged the prevailing consensus among twentieth-century economic historians.",
            prompt: "Which choice best describes the function of the highlighted sentence in the overall structure of the text?",
            options: [
                "It provides specific evidence from Vance's research explaining how his findings challenge the traditional view of medieval guilds.",
                "It summarizes twenty-first-century arguments supporting price-fixing cartels in modern industry.",
                "It outlines the administrative fees required to join medieval trade guilds.",
                "It contrasts the training programs of Western European guilds with those in Eastern Asia."
            ],
            correctAnswer: 0, // A
            explanation: "The highlighted sentence details the specific empirical work (synthesizing guild charters on quality controls and apprenticeship) Vance used to counter the old consensus that guilds were mere price-fixing cartels."
        },
        {
            passage: "Text 1\nThe adoption of electric vehicles (EVs) represents a crucial shift in transportation policy. By eliminating tailpipe emissions, widespread EV adoption directly reduces urban air pollution and accelerates the global transition away from fossil fuels.\n\nText 2\nWhile electric vehicles eliminate direct tailpipe emissions, their net environmental impact depends heavily on the energy grid powering them. If EV charging relies on coal-fired power plants, carbon emissions are simply shifted from the road to the power station. Additionally, the mining of lithium and cobalt for battery production raises significant environmental concerns.",
            prompt: "Based on the texts, how would the author of Text 2 most likely characterize the view of EVs presented in Text 1?",
            options: [
                "As overly optimistic, because it overlooks grid source emissions and the environmental footprint of battery supply chains.",
                "As entirely inaccurate, because electric vehicles produce significantly higher tailpipe emissions than gas vehicles.",
                "As fully comprehensive, because it addresses all human rights concerns tied to mineral extraction.",
                "As irremediably flawed, because urban air pollution has no connection to vehicle usage."
            ],
            correctAnswer: 0, // A
            explanation: "Text 2 points out critical limitations omitted in Text 1—namely, grid reliance on fossil fuels and negative impacts from battery mineral mining—making Text 1's perspective incomplete and overly optimistic."
        },
        {
            passage: "Economist Dr. Sarah Chen hypothesizes that expanding high-speed broadband access in rural counties leads to measurable increases in local entrepreneurship and small business formation.",
            prompt: "Which quotation from an economic policy report best supports Dr. Chen's hypothesis?",
            options: [
                "\"Rural counties that received federal grants for high-speed fiber installation experienced a 25% increase in new business registrations within three years compared to similar counties without broadband expansion.\"",
                "\"Federal subsidies for agricultural equipment have steadily risen across rural districts over the past decade.\"",
                "\"High-speed internet allows urban residents to stream entertainment content with minimal latency.\"",
                "\"Small business owners in metropolitan areas report that commercial rents represent their single largest overhead expense.\""
            ],
            correctAnswer: 0, // A
            explanation: "Option A provides direct empirical support showing a 25% increase in new business registrations specifically in rural counties following high-speed broadband expansion."
        },
        {
            passage: "Modern architectural restoration requires a _______ balance: conservators must repair structural damage using contemporary materials while scrupulously maintaining the building's original historic aesthetic.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["delicate", "superfluous", "monolithic", "dogmatic"],
            correctAnswer: 0, // A
            explanation: "'Delicate' means requiring sensitive handling, tact, or fine balance. Balancing modern repairs with historical preservation requires a delicate balance."
        },
        {
            passage: "Cognitive psychologists testing memory retention found that students who used spaced repetition—reviewing material at increasing time intervals—retained 40% more information after one month than students who used massed practice (cramming). Brain imaging data revealed that spaced repetition promotes neural consolidation during sleep cycles. Consequently, study strategies that rely on last-minute cramming prior to examinations are likely to _______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "result in rapid memory decay and lower long-term knowledge retention.",
                "permanently enhance neural pathways in the cerebral cortex.",
                "outperform spaced repetition methods over multi-year periods.",
                "prevent sleep cycles from occurring during exam periods."
            ],
            correctAnswer: 0, // A
            explanation: "Because spaced repetition builds neural consolidation and yields 40% better retention than cramming, relying on cramming logically leads to faster memory decay and lower long-term retention."
        },
        {
            passage: "Early twentieth-century oceanographers believed that deep ocean trenches were desolate deserts devoid of life due to extreme hydrostatic pressure and total darkness. However, recent submersibles exploring the Mariana Trench discovered thriving ecosystems populated by amphipods, snailfish, and specialized chemotrophic bacteria that derive energy from chemical compounds rather than sunlight. These discoveries forced marine biologists to fundamentally redefine the physical limits under which complex animal life can survive.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "The Mariana Trench is the largest source of solar energy in the Pacific Ocean.",
                "Explorations of deep ocean trenches revealed thriving ecosystems, overturning previous beliefs about the limits of life.",
                "Chemotrophic bacteria have replaced all photosynthetic life forms in shallow coastal waters.",
                "Extreme hydrostatic pressure prevents any biological organisms from inhabiting deep ocean floors."
            ],
            correctAnswer: 1, // B
            explanation: "The passage describes how early assumptions of lifeless deep trenches were overturned by discoveries of complex ecosystems in the Mariana Trench."
        },
        {
            passage: "Despite encountering numerous political roadblocks and supply chain delays, the project lead remained _______, steadily guiding the renewable energy initiative to completion on schedule.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["unwavering", "tentative", "apathetic", "capricious"],
            correctAnswer: 0, // A
            explanation: "'Unwavering' means steady, resolute, and firm. Continuing steadily toward project completion despite severe roadblocks and delays shows an unwavering attitude."
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        // Build Interactive Web Quiz
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        // Build Hidden "Blank Print" Version
        let printHTML = '<h1 style="text-align: center; color: #1a5276; margin-bottom: 5px;">SAT Reading Practice - Set 9-10d</h1><h3 style="text-align: center; margin-top: 0; margin-bottom: 30px; color: #555;">Blank Copy</h3><hr style="margin-bottom:30px; border: 0; border-top: 1px solid #ccc;">';
        
        quizData.forEach((q, index) => {
            let printOptionsHTML = '';
            q.options.forEach(opt => {
                printOptionsHTML += `
                    <li style="margin-bottom: 12px; display: flex; align-items: baseline;">
                        <div style="display:inline-block; width:14px; height:14px; border:2px solid #555; border-radius:50%; margin-right:12px; position:relative; top: 2px; flex-shrink: 0;"></div>
                        <span>${opt}</span>
                    </li>
                `;
            });
            
            printHTML += `
                <div style="margin-bottom: 45px; page-break-inside: avoid;">
                    <p style="font-weight: bold; font-size: 1.1em; color: #333;">Question ${index + 1}</p>
                    <div style="font-family: Georgia, serif; padding: 15px; background-color: #f9f9f9; border-left: 4px solid #ccc; margin-bottom: 15px;">${q.passage}</div>
                    <p style="font-weight: bold; margin-bottom: 15px;">${q.prompt}</p>
                    <ul style="list-style-type: none; padding: 0;">${printOptionsHTML}</ul>
                </div>
            `;
        });
        document.getElementById('print-blank-container').innerHTML = printHTML;

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please select an answer before checking.";
            feedbackDiv.className = "feedback warning";
            return;
        }

        isLocked[currentQuestion] = true;
        
        const radios = document.getElementsByName(`q${currentQuestion}`);
        radios.forEach(r => r.disabled = true);
        q.options.forEach((_, optIndex) => {
            document.getElementById(`label-${currentQuestion}-${optIndex}`).classList.add('disabled');
        });

        updateNav();

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct!</strong><br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Checked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                const radios = document.getElementsByName(`q${index}`);
                radios.forEach(r => r.disabled = true);
                feedbackDiv.innerHTML = `<strong>Unanswered / Not Checked.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        document.querySelector('.print-blank-btn').style.display = 'none'; 
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `You scored ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)`;
        
        // Displays Harvard reward logo when student achieves 100% (10/10)
        if (score === quizData.length) {
            document.getElementById('harvard-reward').style.display = 'block';
        }
        
        window.scrollTo(0, 0);
    }

    function printBlankQuiz() {
        document.body.classList.add('print-blank-mode');
        window.print();
        document.body.classList.remove('print-blank-mode');
    }

    window.onload = initQuiz;
</script>

</body>
</html>
