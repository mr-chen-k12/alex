<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Lesson 81 Solutions</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; max-width: 800px; margin: 0 auto; padding: 20px; background-color: #f4f7f6; }
        h1 { color: #2c3e50; text-align: center; border-bottom: 2px solid #2c3e50; padding-bottom: 10px; }
        .problem-card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .question-text { font-weight: bold; color: #1a5a96; margin-bottom: 15px; }
        .answer-box { display: none; margin-top: 15px; padding: 15px; background-color: #eef9f1; border-left: 5px solid #4caf50; border-radius: 4px; }
        button { background-color: #3498db; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; transition: background 0.3s; }
        button:hover { background-color: #2980b9; }
        .unit-label { color: #7f8c8d; font-size: 0.9em; }
    </style>
</head>
<body>

<h1>Written Practice: Lesson 81 Solutions</h1>

<div id="problems-container"></div>

<script>
const problems = [
    { id: 1, q: "The Jones family had 2 gallons of milk. They used 2 quarts. How many quarts are left?", a: "There are 4 quarts in 1 gallon. <br> Total: $2 \\times 4 = 8$ quarts. <br> Remaining: $8 - 2 = 8$ **6 quarts**." },
    { id: 2, q: "Compare 1 gallon to 4 liters (1 quart ≈ 945 mL).", a: "1 gallon = 4 quarts. 1 liter = 1000 mL. Since 1 quart (945 mL) is less than 1 liter (1000 mL), 4 quarts (1 gallon) is less than 4 liters. <br> **Answer: 1 gallon < 4 liters**" },
    { id: 3, q: "Carol cut $2\\frac{1}{2}$ inches off her hair 3 times. How much longer would it be if she hadn't?", a: "Multiply the cut amount by the frequency: <br> $2.5 \\times 3 = 7.5$ <br> **Answer: $7\\frac{1}{2}$ inches**" },
    { id: 4, q: "A plane flew 1200 miles in 3 hours. Find the average speed.", a: "Speed = Distance ÷ Time <br> $1200 / 3 = 400$ <br> **Answer: 400 mph**" },
    { id: 5, q: "Prime factorization of numerator and denominator: $54/135$. Then reduce.", a: "$54 = 2 \\cdot 3^3$ <br> $135 = 3^3 \\cdot 5$ <br> Common factor is $3^3$ (27). <br> **Reduced: 2/5**" },
    { id: 6, q: "Write 60% as a reduced fraction. Find 60% of 80 points.", a: "Fraction: $60/100 = 3/5$ <br> Points: $3/5 \\times 80 = 48$ <br> **Answer: 3/5 and 48 points**" },
    { id: 7, q: "What is the area of the parallelogram (Base 24m, Height 25m)?", a: "Area = Base $\\times$ Height <br> $24 \\times 25 = 600$ <br> **Answer: 600 m²**" },
    { id: 8, q: "What is the perimeter of the parallelogram (Sides 24m and 26m)?", a: "$P = 2(24 + 26) = 2(50)$ <br> **Answer: 100 m**" },
    { id: 9, q: "'Some rectangles are trapezoids.' True or False? Why?", a: "**False.** By definition, a trapezoid has exactly (or at least, depending on textbook) one pair of parallel sides, but a rectangle must have two pairs of parallel sides." },
    { id: 10, q: "Ratio of red to blue is 3 to 4. If 24 are blue, how many are red?", a: "Set up a proportion: $3/4 = x/24$. <br> $4x = 72 \\rightarrow x = 18$. <br> **Answer: 18 red marbles**" },
    { id: 11, q: "Order least to greatest: $1/2, 1/5, 0.4$", a: "Convert to decimals: $1/2 = 0.5$, $1/5 = 0.2$, $0.4 = 0.4$. <br> **Order: 1/5, 0.4, 1/2**" },
    { id: 12, q: "Equivalent of 4/25: a. Decimal, b. Percent", a: "a. $4/25 = 16/100 = 0.16$ <br> b. **16%**" },
    { id: 13, q: "Solve: $(10 - 0.1) \\times 0.1$", a: "$9.9 \\times 0.1 = 0.99$" },
    { id: 14, q: "Solve: $(0.4 + 3) \\div 2$", a: "$3.4 \\div 2 = 1.7$" },
    { id: 15, q: "Solve: $5/8 + 3/4$", a: "$5/8 + 6/8 = 11/8 = 1\\frac{3}{8}$" },
    { id: 16, q: "Solve: $3 - 1\\frac{1}{8}$", a: "$2\\frac{8}{8} - 1\\frac{1}{8} = 1\\frac{7}{8}$" },
    { id: 17, q: "Solve: $4\\frac{1}{2} - 1\\frac{3}{4}$", a: "$4\\frac{2}{4} - 1\\frac{3}{4} = 3\\frac{6}{4} - 1\\frac{3}{4} = 2\\frac{3}{4}$" },
    { id: 18, q: "Solve: $\\frac{5}{6} \\cdot \\frac{4}{5} \\cdot \\frac{3}{8}$", a: "Multiply numerators: $5 \\cdot 4 \\cdot 3 = 60$. <br> Denominators: $6 \\cdot 5 \\cdot 8 = 240$. <br> $60/240 = 1/4$. <br> **Answer: 1/4**" },
    { id: 19, q: "Solve: $4\\frac{1}{2} \\times 1\\frac{1}{3}$", a: "$9/2 \\times 4/3 = 36/6 = 6$. <br> **Answer: 6**" },
    { id: 20, q: "Solve: $3\\frac{1}{3} \\div 1\\frac{1}{3}$", a: "$10/3 \\div 4/3 = 10/3 \\times 3/4 = 10/4 = 2.5$. <br> **Answer: $2\\frac{1}{2}$**" },
    { id: 21, q: "Square perimeter is 2m. How many cm is each side?", a: "Perimeter = 200 cm. Side = $200 / 4 = 50$. <br> **Answer: 50 cm**" },
    { id: 22, q: "Circle in square (side 50cm): a. Diameter b. Circumference", a: "a. Diameter = side of square = **50 cm** <br> b. $C = \\pi d = 3.14 \\times 50 = 157$ <br> **Answer: 157 cm**" },
    { id: 23, q: "Tax on $12.80 at 6%.", a: "$12.80 \\times 0.06 = 0.768$. Rounding to nearest cent: **$0.77**" },
    { id: 24, q: "What time is 2.5 hours after 10:40 a.m.?", a: "10:40 + 2 hours = 12:40 p.m. <br> 12:40 + 30 mins = 1:10 p.m. <br> **Answer: 1:10 p.m.**" },
    { id: 26, q: "Area of quadrilateral vertices: (0,0), (4,0), (6,3), (2,3)?", a: "This is a parallelogram with base 4 and height 3. <br> $4 \\times 3 = 12$. <br> **Answer: 12 square units**" },
    { id: 27, q: "Name of the geometric solid (cone)?", a: "**Answer: Cone**" },
    { id: 28, q: "If area of a square is 1 sq ft, what is the perimeter?", a: "Side = $\\sqrt{1} = 1$ ft. <br> Perimeter = $4 \\times 1 = 4$. <br> **Answer: 4 feet**" },
    { id: 30, q: "Name of a quadrilateral formed by two parallel segments of different lengths?", a: "**Answer: Trapezoid**" }
];

const container = document.getElementById('problems-container');

problems.forEach(prob => {
    const div = document.createElement('div');
    div.className = 'problem-card';
    div.innerHTML = `
        <div class="question-text">Problem ${prob.id}: ${prob.q}</div>
        <button onclick="toggleAns(${prob.id})">Show Answer & Explanation</button>
        <div id="ans-${prob.id}" class="answer-box">${prob.a}</div>
    `;
    container.appendChild(div);
});

function toggleAns(id) {
    const el = document.getElementById(`ans-${id}`);
    el.style.display = (el.style.display === 'block') ? 'none' : 'block';
}
</script>

</body>
</html>
