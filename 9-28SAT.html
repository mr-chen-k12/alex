        let currentSetKey = "Set A";
        let userAnswers = {};
        let unlockedBadges = {};

        function loadSet(setName) {
            currentSetKey = setName;
            userAnswers = {};
            document.getElementById('score-summary').style.display = 'none';
            
            // Set header theme according to university reward color
            const reward = universityRewards[setName];
            document.documentElement.style.setProperty('--primary-color', reward.color);

            updateScoreDisplay();

            const container = document.getElementById('questions-wrapper');
            container.innerHTML = '';

            const questions = questionBank[setName];

            questions.forEach((q, index) => {
                const card = document.createElement('div');
                card.className = 'question-card';
                card.id = `q-card-${index}`;

                card.innerHTML = `
                    <div class="question-number">Question ${index + 1} of 10</div>
                    <div class="passage">${q.passage}</div>
                    <div class="question-text">${q.question}</div>
                    <div class="options-group" id="options-${index}">
                        ${q.options.map((opt, optIdx) => `
                            <button class="option-btn" onclick="selectAnswer(${index}, ${optIdx})">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                    <div class="feedback-box" id="feedback-${index}"></div>
                `;
                container.appendChild(card);
            });
        }

        function selectAnswer(questionIdx, selectedOptIdx) {
            if (userAnswers.hasOwnProperty(questionIdx)) return; // Prevent changing choice

            const qData = questionBank[currentSetKey][questionIdx];
            const isCorrect = selectedOptIdx === qData.answer;
            userAnswers[questionIdx] = isCorrect;

            const optionsGroup = document.getElementById(`options-${questionIdx}`);
            const buttons = optionsGroup.getElementsByClassName('option-btn');

            Array.from(buttons).forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === qData.answer) {
                    btn.classList.add('correct');
                } else if (idx === selectedOptIdx && !isCorrect) {
                    btn.classList.add('incorrect');
                }
            });

            const fbBox = document.getElementById(`feedback-${questionIdx}`);
            fbBox.classList.add('show');
            if (isCorrect) {
                fbBox.classList.add('correct-fb');
                fbBox.innerHTML = `<strong>✓ Correct!</strong> ${qData.explanation}`;
            } else {
                fbBox.classList.add('incorrect-fb');
                fbBox.innerHTML = `<strong>✗ Incorrect.</strong> ${qData.explanation}`;
            }

            updateScoreDisplay();
            checkSetCompletion();
        }

        function updateScoreDisplay() {
            const correctCount = Object.values(userAnswers).filter(Boolean).length;
            document.getElementById('score-tracker').innerText = `Score: ${correctCount} / 10`;
        }

        function checkSetCompletion() {
            const totalAnswered = Object.keys(userAnswers).length;
            if (totalAnswered === 10) {
                const score = Object.values(userAnswers).filter(Boolean).length;
                const summaryBox = document.getElementById('score-summary');
                const scoreText = document.getElementById('final-score-text');
                const msgText = document.getElementById('feedback-message');
                const rewardSection = document.getElementById('reward-section');

                const currentReward = universityRewards[currentSetKey];
                scoreText.innerText = `${score} / 10`;
                
                if (score === 10) {
                    unlockedBadges[currentSetKey] = true;
                    document.getElementById(currentReward.badgeId).classList.add('unlocked');
                    
                    msgText.innerHTML = `<span style="color: ${currentReward.color};">Congratulations! Perfect Score!</span> You unlocked the <strong>${currentReward.name}</strong> reward logo!`;
                    
                    rewardSection.innerHTML = `
                        <div class="reward-badge-container" style="border-color: ${currentReward.color};">
                            <img src="${currentReward.img}" alt="${currentReward.name}">
                            <h3 style="color: ${currentReward.color};">${currentReward.name}</h3>
                            <p style="margin: 0; font-weight: bold; color: green;">🏆 100% Mastery Unlocked!</p>
                        </div>
                    `;
                } else {
                    rewardSection.innerHTML = ``;
                    msgText.innerText = `You scored ${score}/10. Get 100% on this set to unlock the ${currentReward.name} badge!`;
                }

                summaryBox.style.display = 'block';
                summaryBox.scrollIntoView({ behavior: 'smooth' });
            }
        }

        function resetCurrentSet() {
            loadSet(currentSetKey);
        }

        // Initialize Set A on page load
        window.onload = () => {
            loadSet("Set A");
        };
    </script>
