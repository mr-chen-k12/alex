<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saxon Math Course 1 - Practice Problems</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <style>
        body { font-family: Arial, sans-serif; line-height: 1.6; max-width: 900px; margin: 0 auto; padding: 20px; color: #333; }
        h1 { text-align: center; color: #2c3e50; }
        .problem-container { border-bottom: 1px solid #ddd; padding: 20px 0; margin-bottom: 10px; }
        .problem-number { font-weight: bold; margin-right: 10px; font-size: 1.1em; color: #0056b3; }
        .question { font-size: 1.05em; margin-bottom: 15px; }
        .btn { background-color: #0056b3; color: white; border: none; padding: 8px 16px; cursor: pointer; border-radius: 4px; font-size: 0.9em; transition: background 0.2s; }
        .btn:hover { background-color: #004494; }
        .answer-box { display: none; margin-top: 15px; padding: 15px; border-left: 4px solid #28a745; background-color: #f8fff9; border-radius: 0 4px 4px 0; }
        .answer-title { font-weight: bold; color: #28a745; margin-bottom: 5px; }
        table.math-table { border-collapse: collapse; margin: 10px 0; }
        table.math-table th, table.math-table td { border: 1px solid #333; padding: 5px 15px; text-align: center; }
        svg { border: 1px solid #ccc; background-color: #fff; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Saxon Math Course 1 - Written Practice (Form B)</h1>

    <div id="problems-wrapper">
        </div>

    <script>
        const problems = [
            {
                num: "e.",
                text: "A farmer mixes a fertilizer that weighs 3 pounds per gallon. Create a table of ordered pairs for this function for 1, 2, 3, and 4 gallons. Then graph the points on a coordinate plane, using the horizontal axis for gallons and the vertical axis for pounds. Would it be appropriate to draw a ray through the points? Why or why not?",
                ans: `
                    <p><strong>Table:</strong></p>
                    <table class="math-table">
                        <tr><th>Gallons (x)</th><td>1</td><td>2</td><td>3</td><td>4</td></tr>
                        <tr><th>Pounds (y)</th><td>3</td><td>6</td><td>9</td><td>12</td></tr>
                    </table>
                    <p><strong>Graph:</strong></p>
                    <svg width="250" height="250" viewBox="0 -20 120 120">
                        <line x1="10" y1="100" x2="110" y2="100" stroke="black" stroke-width="1"/>
                        <line x1="10" y1="100" x2="10" y2="10" stroke="black" stroke-width="1"/>
                        <circle cx="30" cy="82" r="2" fill="red"/>
                        <circle cx="50" cy="64" r="2" fill="red"/>
                        <circle cx="70" cy="46" r="2" fill="red"/>
                        <circle cx="90" cy="28" r="2" fill="red"/>
                        <line x1="10" y1="100" x2="100" y2="19" stroke="blue" stroke-dasharray="4" stroke-width="1"/>
                        <text x="50" y="115" font-size="8">Gallons</text>
                        <text x="-5" y="50" font-size="8" transform="rotate(-90, -5, 50)">Pounds</text>
                    </svg>
                    <p><strong>Explanation:</strong> Yes, drawing a ray starting from the origin is appropriate because you can measure continuous fractional amounts of gallons (like 2.5 gallons), and the weight increases proportionally from zero.</p>
                `
            },
            {
                num: "1.",
                text: "When the sum of 3.0 and 3.0 is subtracted from the product of 3.0 and 3.0, what is the difference?",
                ans: "<strong>Answer:</strong> 3.0<br><br><strong>Explanation:</strong> Sum = \\(3.0 + 3.0 = 6.0\\). Product = \\(3.0 \\times 3.0 = 9.0\\). Difference = \\(9.0 - 6.0 = 3.0\\)."
            },
            {
                num: "2.",
                text: "A 5.4-kilogram package weighs the same as how many smaller packages that each weigh 0.54 kilogram?",
                ans: "<strong>Answer:</strong> 10<br><br><strong>Explanation:</strong> Divide the total weight by the weight per package: \\(5.4 \\div 0.54 = 10\\)."
            },
            {
                num: "3.",
                text: "If the average of 6 numbers is 15, what is the sum of the 6 numbers?",
                ans: "<strong>Answer:</strong> 90<br><br><strong>Explanation:</strong> Average = Sum / Count. Therefore, Sum = Average &times; Count. \\(15 \\times 6 = 90\\)."
            },
            {
                num: "4.",
                text: "What is the name of a quadrilateral that has two pairs of parallel sides and four right angles?",
                ans: "<strong>Answer:</strong> Rectangle (or Square)<br><br><strong>Explanation:</strong> By definition, a parallelogram with four right angles is a rectangle. A square is also a correct specific type of rectangle."
            },
            {
                num: "5.",
                text: "a. Write 0.25 as a percent.<br>b. Write 2.5 as a percent.",
                ans: "<strong>Answer:</strong> a. 25% <br> b. 250%<br><br><strong>Explanation:</strong> To convert a decimal to a percent, multiply by 100 (move the decimal point two places to the right) and add the percent sign."
            },
            {
                num: "6.",
                text: "Write \\(\\frac{2}{3}\\) as a percent.",
                ans: "<strong>Answer:</strong> \\(66\\frac{2}{3}\\%\\)<br><br><strong>Explanation:</strong> Divide 2 by 3 to get \\(0.6666...\\) Multiply by 100 to get \\(66.666...\\%\\), which is exactly \\(66\\frac{2}{3}\\%\\)."
            },
            {
                num: "7.",
                text: "Three of the numbers below are equivalent. Which one is not equivalent to the others?<br>A 2 &nbsp;&nbsp;&nbsp; B 200% &nbsp;&nbsp;&nbsp; C 0.2 &nbsp;&nbsp;&nbsp; D \\(\\frac{200}{100}\\)",
                ans: "<strong>Answer:</strong> C 0.2<br><br><strong>Explanation:</strong> 2 = 200% = 200/100. Option C (0.2) equals 20%, which is not equivalent to the others."
            },
            {
                num: "8.",
                text: "\\(12^3\\)",
                ans: "<strong>Answer:</strong> 1728<br><br><strong>Explanation:</strong> \\(12 \\times 12 \\times 12 = 144 \\times 12 = 1728\\)."
            },
            {
                num: "9.",
                text: "How much is \\(\\frac{3}{4}\\) of 400?",
                ans: "<strong>Answer:</strong> 300<br><br><strong>Explanation:</strong> First divide 400 by 4 to get 100. Then multiply by 3 to get \\(100 \\times 3 = 300\\)."
            },
            {
                num: "10.",
                text: "Between which two consecutive whole numbers is \\(\\sqrt{60}\\)?",
                ans: "<strong>Answer:</strong> Between 7 and 8<br><br><strong>Explanation:</strong> The perfect square just below 60 is 49 (\\(7^2\\)) and the perfect square just above 60 is 64 (\\(8^2\\)). Therefore, \\(\\sqrt{60}\\) lies between 7 and 8."
            },
            {
                num: "11.",
                text: "Maria walked completely around a square park, turning at each corner. What was the average number of degrees she turned at each of the corners?",
                ans: "<strong>Answer:</strong> \\(90^\\circ\\)<br><br><strong>Explanation:</strong> Walking completely around a convex polygon means completing a full \\(360^\\circ\\) turn. A square has 4 corners, so the average exterior turn is \\(360^\\circ \\div 4 = 90^\\circ\\)."
            },
            {
                num: "12.",
                text: "Find the missing number in this function table.<br> x: 2, 5, 10, 12 <br> 3x + 2: 8, 17, __, 38",
                ans: "<strong>Answer:</strong> 32<br><br><strong>Explanation:</strong> Substitute \\(x = 10\\) into the function \\(3x + 2\\). That gives \\(3(10) + 2 = 30 + 2 = 32\\)."
            },
            {
                num: "13.",
                text: "Factor and reduce: \\(\\frac{(36)(48)}{72}\\)",
                ans: "<strong>Answer:</strong> 24<br><br><strong>Explanation:</strong> Break the numbers into factors. 72 is \\(12 \\times 6\\). 36 is \\(6 \\times 6\\), and 48 is \\(12 \\times 4\\). So, \\(\\frac{(6 \\times 6)(12 \\times 4)}{12 \\times 6}\\). Cancel out the 12 and the 6, leaving \\(6 \\times 4 = 24\\)."
            },
            {
                num: "14.",
                text: "\\(\\frac{40}{0.05}\\)",
                ans: "<strong>Answer:</strong> 800<br><br><strong>Explanation:</strong> Multiply the numerator and denominator by 100 to remove the decimal: \\(4000 \\div 5 = 800\\)."
            },
            {
                num: "15.",
                text: "\\(12\\frac{1}{2} \\div 100\\)",
                ans: "<strong>Answer:</strong> \\(\\frac{1}{8}\\)<br><br><strong>Explanation:</strong> Convert to an improper fraction: \\(\\frac{25}{2}\\). Then divide by 100 (which is multiplying by \\(\\frac{1}{100}\\)): \\(\\frac{25}{2} \\times \\frac{1}{100} = \\frac{25}{200} = \\frac{1}{8}\\)."
            },
            {
                num: "16.",
                text: "\\(1\\frac{1}{4} + 2\\frac{1}{2} + 3\\frac{1}{8}\\)",
                ans: "<strong>Answer:</strong> \\(6\\frac{7}{8}\\)<br><br><strong>Explanation:</strong> Find a common denominator, which is 8. The fractions become \\(\\frac{2}{8} + \\frac{4}{8} + \\frac{1}{8} = \\frac{7}{8}\\). Sum the whole numbers: \\(1 + 2 + 3 = 6\\). Total = \\(6\\frac{7}{8}\\)."
            },
            {
                num: "17.",
                text: "\\(50 \\times 2\\frac{2}{5} \\times \\frac{5}{6}\\)",
                ans: "<strong>Answer:</strong> 100<br><br><strong>Explanation:</strong> Convert to improper fractions: \\(50 \\times \\frac{12}{5} \\times \\frac{5}{6}\\). The 5s cancel out. \\(12 \\div 6 = 2\\). The equation simplifies to \\(50 \\times 2 = 100\\)."
            },
            {
                num: "18.",
                text: "\\(\\frac{3}{5}\\) of $15.00",
                ans: "<strong>Answer:</strong> $9.00<br><br><strong>Explanation:</strong> First divide by 5: \\($15.00 \\div 5 = $3.00\\). Then multiply by 3: \\($3.00 \\times 3 = $9.00\\)."
            },
            {
                num: "19.",
                text: "\\(0.15 \\times \\$8.40\\)",
                ans: "<strong>Answer:</strong> $1.26<br><br><strong>Explanation:</strong> \\(15 \\times 84 = 1260\\). Place the decimal 4 spots to the left (two for 0.15, two for 8.40): \\(1.2600 = \\$1.26\\)."
            },
            {
                num: "20.",
                text: "\\(6.5 - 2\\frac{1}{4}\\) (decimal answer)",
                ans: "<strong>Answer:</strong> 4.25<br><br><strong>Explanation:</strong> Convert fraction to a decimal: \\(2\\frac{1}{4} = 2.25\\). Subtract: \\(6.50 - 2.25 = 4.25\\)."
            },
            {
                num: "21.",
                text: "What is the ratio of the number of cents in a nickel to the number of cents in a half-dollar?",
                ans: "<strong>Answer:</strong> 1:10 or \\(\\frac{1}{10}\\)<br><br><strong>Explanation:</strong> A nickel has 5 cents and a half-dollar has 50 cents. Ratio = 5:50. Divide both by 5 to reduce to 1:10."
            },
            {
                num: "22.",
                text: "\\(5n = 8 \\cdot 15\\)",
                ans: "<strong>Answer:</strong> 24<br><br><strong>Explanation:</strong> Multiply the right side: \\(8 \\times 15 = 120\\). Equation is \\(5n = 120\\). Divide by 5: \\(n = 24\\)."
            },
            {
                num: "23.",
                text: "\\(0.4n = 16\\)",
                ans: "<strong>Answer:</strong> 40<br><br><strong>Explanation:</strong> Divide 16 by 0.4. This is the same as \\(160 \\div 4\\), which equals 40."
            },
            {
                num: "24.",
                text: "Draw a segment \\(2\\frac{1}{2}\\) inches long. Label the endpoints A and B. Label the midpoint M. What are the lengths of AM and MB?",
                ans: `
                    <strong>Answer:</strong> Lengths are \\(1\\frac{1}{4}\\) inches each.
                    <br><br><strong>Explanation:</strong>
                    <svg width="300" height="60" viewBox="0 0 300 60">
                        <line x1="20" y1="30" x2="280" y2="30" stroke="black" stroke-width="2"/>
                        <circle cx="20" cy="30" r="3" fill="black"/>
                        <circle cx="150" cy="30" r="3" fill="black"/>
                        <circle cx="280" cy="30" r="3" fill="black"/>
                        <text x="15" y="20" font-weight="bold">A</text>
                        <text x="145" y="20" font-weight="bold">M</text>
                        <text x="275" y="20" font-weight="bold">B</text>
                        <text x="105" y="50" font-size="12">Total: 2 1/2 inches</text>
                    </svg><br>
                    The total length is \\(2\\frac{1}{2}\\) which equals \\(\\frac{5}{2}\\) inches. The midpoint divides it in half. \\(\\frac{5}{2} \\div 2 = \\frac{5}{2} \\times \\frac{1}{2} = \\frac{5}{4} = 1\\frac{1}{4}\\).
                `
            },
            {
                num: "25.",
                text: "Solve this proportion: \\(\\frac{4}{7} = \\frac{28}{w}\\)",
                ans: "<strong>Answer:</strong> 49<br><br><strong>Explanation:</strong> Using cross multiplication: \\(4w = 7 \\times 28\\). \\(4w = 196\\). \\(w = 196 \\div 4 = 49\\)."
            },
            {
                num: "26.",
                text: "Multiply 5 hours by 8 dollars per hour: \\(\\frac{5 \\text{ hours}}{1} \\times \\frac{8 \\text{ dollars}}{1 \\text{ hour}}\\)",
                ans: "<strong>Answer:</strong> 40 dollars<br><br><strong>Explanation:</strong> Multiply the numerators. The 'hours' units cancel out. \\(5 \\times 8 = 40\\)."
            },
            {
                num: "27.",
                text: "The coordinates of the vertices of a triangle are (0, 0), (8, 0), and (4, 6). What is the area of the triangle?",
                ans: "<strong>Answer:</strong> 24 square units<br><br><strong>Explanation:</strong> Area of a triangle is \\(\\frac{1}{2} \\times \\text{Base} \\times \\text{Height}\\). The base is the segment from (0,0) to (8,0), which has a length of 8. The perpendicular height from the y-coordinates 0 to 6 is 6. Area = \\(\\frac{1}{2} \\times 8 \\times 6 = 24\\)."
            },
            {
                num: "28.",
                text: "There are 16 ounces in one pound. How many ounces are in 3 pounds?",
                ans: "<strong>Answer:</strong> 48 ounces<br><br><strong>Explanation:</strong> Multiply the number of pounds by the number of ounces per pound: \\(3 \\times 16 = 48\\)."
            },
            {
                num: "29.",
                text: "\\(4^2 + 3^3 - \\sqrt{9} \\times 4 + 8^2 \\div \\sqrt{64}\\)",
                ans: "<strong>Answer:</strong> 39<br><br><strong>Explanation:</strong> Use Order of Operations (PEMDAS):<br> Exponents/Roots: \\(16 + 27 - 3 \\times 4 + 64 \\div 8\\)<br> Multiplication/Division: \\(16 + 27 - 12 + 8\\)<br> Addition/Subtraction: \\(43 - 12 + 8 = 31 + 8 = 39\\)."
            },
            {
                num: "30.",
                text: "What is the probability of rolling an even number with one roll of a standard number cube? Express the ratio as a fraction and as a decimal.",
                ans: "<strong>Answer:</strong> Fraction: \\(\\frac{1}{2}\\), Decimal: 0.5<br><br><strong>Explanation:</strong> A standard number cube has faces 1, 2, 3, 4, 5, 6. The even numbers are 2, 4, and 6. There are 3 even numbers out of 6 possible outcomes. Probability = \\(\\frac{3}{6} = \\frac{1}{2} = 0.5\\)."
            }
        ];

        const wrapper = document.getElementById('problems-wrapper');
        
        problems.forEach((prob, index) => {
            const problemHtml = `
                <div class="problem-container">
                    <div class="question">
                        <span class="problem-number">${prob.num}</span> 
                        ${prob.text}
                    </div>
                    <button class="btn" onclick="toggleAnswer('ans_${index}')">Review Answer</button>
                    <div id="ans_${index}" class="answer-box">
                        <div class="answer-title">Answer & Explanation:</div>
                        ${prob.ans}
                    </div>
                </div>
            `;
            wrapper.innerHTML += problemHtml;
        });

        function toggleAnswer(id) {
            const el = document.getElementById(id);
            if (el.style.display === "block") {
                el.style.display = "none";
            } else {
                el.style.display = "block";
            }
        }
    </script>
</body>
</html>
