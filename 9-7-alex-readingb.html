<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT Reading Practice - Set 25</title>
<style>
    /* General Styles */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        position: relative;
    }
    h1 {
        text-align: center;
        color: #1a5276;
    }
    
    .print-blank-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        background-color: #7f8c8d;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 4px;
        color: white;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
    }
    .print-blank-btn:hover {
        background-color: #616a6b;
    }

    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #f9f9f9;
        padding: 15px;
        border-left: 4px solid #1a5276;
        margin-bottom: 20px;
        font-size: 1.05em;
    }
    .prompt {
        font-weight: bold;
        margin-bottom: 15px;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 10px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #f0f3f4;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #d5dbdb;
    }
    .options label:hover {
        background: #e5e8e8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }
    .options input {
        margin-right: 15px;
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 4px;
        display: none;
        border-left: 4px solid;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #1e8449;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #c0392b;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #eee;
        padding-top: 20px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #1a5276;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #154360; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    .check-btn { background-color: #d35400; }
    .check-btn:hover { background-color: #a04000; }
    .check-btn:disabled { background-color: #e59866; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #1e8449; }
    
    #results {
        display: none;
        text-align: center;
        padding: 20px;
        background: #eafaf1;
        border: 2px solid #2ecc71;
        border-radius: 8px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        color: #7f8c8d;
    }

    #harvard-reward {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #fff;
        border: 3px double #a51c30;
        border-radius: 8px;
        animation: pullUp 0.5s ease-out;
    }
    #harvard-reward img {
        width: 160px;
        height: auto;
        margin: 15px auto;
        display: block;
    }
    .harvard-text {
        color: #a51c30;
        font-family: Georgia, serif;
        font-size: 1.4em;
        font-weight: bold;
        letter-spacing: 1px;
    }

    #print-blank-container {
        display: none;
    }

    @keyframes pullUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* Printer Friendly Styles */
    @media print {
        body { background-color: white; padding: 0; }
        
        #quiz-container { box-shadow: none; max-width: 100%; border: none; padding: 0; }
        .question-block { 
            display: block !important; 
            page-break-inside: avoid; 
            border-bottom: 1px solid #ccc; 
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .nav-buttons, .check-btn, .progress-tracker, button, .print-blank-btn { display: none !important; }
        .options label { border: none; padding: 5px 0; background: transparent; }
        .options input { appearance: auto; } 

        #harvard-reward {
            display: block !important;
            border: 2px solid #a51c30 !important;
        }

        /* Override for Blank Print Mode */
        body.print-blank-mode #quiz-container { display: none !important; }
        body.print-blank-mode #print-blank-container { display: block !important; }
    }

    @media screen and (max-width: 600px) {
        .print-blank-btn {
            position: relative;
            top: 0;
            right: 0;
            display: block;
            margin: 0 auto 20px auto;
        }
    }
</style>
</head>
<body>

<div id="quiz-container">
    <button class="print-blank-btn" onclick="printBlankQuiz()">🖨️ Print Blank Quiz</button>
    <h1>SAT Reading Practice - Set 25</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>Quiz Complete</h2>
        <p id="score-display" style="font-size: 1.5em; font-weight: bold;"></p>
        <p>Review your answers and explanations below.</p>
        
        <div id="harvard-reward">
            <div class="harvard-text">★ FLAWLESS ACADEMIC EXCELLENCE ★</div>
            <img src="https://mr-chen-k12.github.io/math/IMG_0232.png" alt="Harvard University Crest">
            <p style="color: #555; font-style: italic; font-weight: bold; margin-top: 5px;">You have successfully earned the Harvard University verification crest for achieving a perfect 10/10 score.</p>
        </div>

        <button onclick="window.print()" style="margin-top: 15px;">🖨️ Print Results</button>
    </div>

    <div id="questions-wrapper">
        <!-- Questions injected here -->
    </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit for Review</button>
    </div>
</div>

<div id="print-blank-container"></div>

<script>
    const quizData = [
        {
            passage: "Although street art is often viewed as an _______ medium designed to fade under weather exposure and municipal repainting, several major museums have begun applying advanced chemical fixatives to preserve outdoor murals for future decades.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["enduring", "ubiquitous", "ephemeral", "meticulous"],
            correctAnswer: 2, // Index 2 = C
            explanation: "'Ephemeral' means lasting for a very short time or fleeting. The contrast word 'Although' combined with 'designed to fade under weather exposure' indicates that street art is traditionally considered short-lived."
        },
        {
            passage: "Spectroscopic observations of the exoplanet WASP-121b have revealed water vapor and metals such as iron and titanium in its ultra-hot upper atmosphere. Because the planet is tidally locked to its host star, its daytime temperature exceeds 2,500 Kelvin, causing metals to vaporize completely. On the colder nightside, these vaporized metals condense into clouds and fall as metallic rain. These observations demonstrate that extreme solar radiation can dramatically alter atmospheric chemistry on gas giants, creating exotic weather patterns unlike any seen in our solar system.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Exoplanet WASP-121b possesses an atmospheric composition identical to Jupiter's upper atmosphere.",
                "Intense stellar radiation on WASP-121b drives unique atmospheric phenomena, including high-temperature metal vaporization and metallic rain.",
                "Water vapor is the dominant molecule preventing heat dissipation on tidally locked planets.",
                "Modern spectroscopic telescopes are unable to distinguish between cloud layers and solid surfaces on exoplanets."
            ],
            correctAnswer: 1, // Index 1 = B
            explanation: "The passage explains how the extreme heat on WASP-121b causes metals to vaporize on the dayside and condense as metallic rain on the nightside, concluding that extreme radiation creates unique atmospheric chemistry and exotic weather patterns."
        },
        {
            passage: "Neuroscientists studying memory consolidation examined sleep patterns in songbirds learning new vocal patterns. During non-REM sleep, the birds' neural pathways in the premotor cortex fired in sequences identical to those recorded while singing during the day. When researchers selectively disrupted these specific sleep spikes, the birds demonstrated significant declines in pitch accuracy and phrase repetition the following morning. Because uninterrupted sleep replay appears necessary for refining motor memories, researchers conclude that sleep disruptions likely ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "accelerate the rate at which juvenile songbirds master adult vocalizations.",
                "force songbirds to rely exclusively on visual cues rather than auditory feedback.",
                "eliminate the need for songbirds to practice vocalizations during waking hours.",
                "impair the neural consolidation required for birds to accurately reproduce learned vocal patterns."
            ],
            correctAnswer: 3, // Index 3 = D
            explanation: "The text states that disrupting sleep spikes during sleep replay caused significant declines in pitch accuracy and phrase repetition. Therefore, sleep disruptions impair the neural consolidation required to accurately reproduce learned songs."
        },
        {
            passage: "Scholar Dr. Elena Rostova argues that Herman Melville’s novel Moby-Dick uses the unpredictable ocean environment not merely as a backdrop for adventure, but as an allegory for the chaotic, uncontrollable forces of human nature and fate.",
            prompt: "Which quotation from a critical essay best supports Dr. Rostova's argument?",
            options: [
                "\"Melville repeatedly frames the untamed sea as an indifferent, tempestuous void that constantly destabilizes Ahab's illusion of absolute control over his destiny.\"",
                "\"Nineteenth-century whaling logs provide detailed technical accounts of harpoon design and vessel navigation in the South Pacific.\"",
                "\"The popularity of nautical fiction during the Victorian era encouraged American publishers to commission maritime adventure stories.\"",
                "\"Melville’s stylistic choices were heavily influenced by his reading of Shakespearean tragedy during the winter of 1849.\""
            ],
            correctAnswer: 0, // Index 0 = A
            explanation: "Dr. Rostova claims Melville uses the unpredictable ocean as an allegory for chaotic forces of fate and human nature. Option A directly supports this by framing the sea as an indifferent, tempestuous void that destabilizes Ahab's illusion of control over his destiny."
        },
        {
            passage: "Peatlands cover only 3% of Earth's land surface, yet they store twice as much carbon as all the world's forests combined. When peatlands are drained for agriculture, oxygen penetrates the saturated soil, accelerating decomposition and releasing gigatons of stored carbon dioxide back into the atmosphere. Consequently, environmental scientists emphasize that preserving intact peatlands is _______ to global efforts aimed at mitigating climate change.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["detrimental", "peripheral", "indispensable", "superfluous"],
            correctAnswer: 2, // Index 2 = C
            explanation: "'Indispensable' means absolutely necessary or essential. Given that peatlands store huge amounts of carbon and draining them releases massive amounts of CO2, preserving them is essential/indispensable to climate change mitigation."
        },
        {
            passage: "Text 1\nArtificial intelligence generative models trained on millions of copyrighted images threaten the livelihood of independent artists. By synthesizing existing artistic styles into automated outputs without compensation or credit, these tools exploit creative labor under the guise of technological innovation.\n\nText 2\nGenerative AI tools operate by analyzing abstract mathematical patterns in large datasets rather than directly copying specific images. Similar to how human artists study historical movements to refine their own technique, AI software synthesizes stylistic influences to produce original visual works, representing a transformative evolution in creative expression.",
            prompt: "Based on the texts, how would the author of Text 2 most likely characterize the view of AI art production presented in Text 1?",
            options: [
                "As an accurate assessment of how AI models extract and duplicate copyrighted digital files.",
                "As an overly critical perspective that misinterprets algorithmic pattern synthesis as direct exploitation or copying.",
                "As a persuasive argument for banning all digital art tools from commercial galleries.",
                "As an endorsement of the legal protections currently enjoyed by technology corporations."
            ],
            correctAnswer: 1, // Index 1 = B
            explanation: "Text 1 views AI as exploiting artists by copying styles without credit. Text 2 contends that AI analyzes mathematical patterns and synthesizes style similarly to how human artists learn from historical movements. Thus, Text 2 would view Text 1 as overly critical and misinterpreting pattern synthesis as direct copying/exploitation."
        },
        {
            passage: "Urban planning studies indicate that expanding dedicated bus rapid transit (BRT) lanes significantly boosts public transit ridership in dense metropolitan corridors. **Researchers analyzing commuter data in Bogota, Colombia, found that the implementation of full-corridor BRT lanes reduced average transit times by 32% and increased daily ridership by over 450,000 passenger trips.** These findings demonstrate that dedicated transit infrastructure can effectively reduce private vehicle dependency without the massive capital costs associated with subway construction.",
            prompt: "Which choice best describes the function of the highlighted sentence in the overall structure of the text?",
            options: [
                "It presents a theoretical objection to bus rapid transit systems.",
                "It outlines a set of regulatory guidelines for city highway construction.",
                "It proposes an alternative explanation for urban traffic congestion in South America.",
                "It provides concrete empirical evidence supporting the claim that dedicated BRT lanes enhance transit efficiency and usage."
            ],
            correctAnswer: 3, // Index 3 = D
            explanation: "The first sentence posits that BRT lanes boost ridership. The bolded sentence provides specific numerical findings (reduced travel times by 32%, increased ridership by 450k) from Bogota, supplying concrete empirical evidence to support that opening claim."
        },
        {
            passage: "Epigraphers spent decades attempting to decipher the enigmatic Linear A script used by the Minoan civilization, but the lack of a bilingual text rendered their efforts _______ until recent statistical computational methods offered new avenues for linguistic translation.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["futile", "lucrative", "unanimous", "rigorous"],
            correctAnswer: 0, // Index 0 = A
            explanation: "'Futile' means producing no useful result or pointles. The lack of a bilingual translation key rendered early decipherment efforts unsuccessful/futile until computational methods were introduced."
        },
        {
            passage: "Convergent evolution occurs when unrelated species independently evolve remarkably similar physical traits due to adapting to comparable ecological niches. A classic example is the Tasmanian tiger (a marsupial) and the gray wolf (a placental mammal), which shared a distant common ancestor but evolved near-identical skull structures and dental arrangements. Because both species filled the role of apex pack predators in temperate grasslands, evolutionary biologists conclude that similar environmental pressures can ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "force placental mammals to adopt marsupial reproductive strategies over time.",
                "cause geographically isolated species to interbreed and merge into a single species.",
                "drive lineages with separate evolutionary histories toward strikingly similar physical adaptations.",
                "prevent apex predators from developing specialized hunting techniques."
            ],
            correctAnswer: 2, // Index 2 = C
            explanation: "The text explains how unrelated marsupial and placental lineages evolved near-identical skull/dental structures because they occupied similar predatory roles. This demonstrates that similar environmental pressures can drive separate evolutionary lineages toward similar physical adaptations."
        },
        {
            passage: "Quantum computers rely on qubits, which can exist in superpositions of 0 and 1, allowing them to solve complex calculations exponentially faster than classical supercomputers. However, qubits are extraordinarily sensitive to environmental interference—such as minute temperature variations or electromagnetic noise—which causes quantum decoherence and destroys stored data. To overcome this limitation, physicists are developing topological qubits, which encode quantum information non-locally across paired subatomic particles. Preliminary experiments indicate that topological qubits maintain stability even when exposed to environmental disturbances, bringing practical fault-tolerant quantum computing closer to reality.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Classical supercomputers remain superior to quantum systems because quantum data cannot be encrypted.",
                "Topological qubits offer a promising solution to the issue of quantum decoherence caused by environmental interference.",
                "Temperature fluctuations in quantum laboratories have completely halted quantum computing research worldwide.",
                "Subatomic particles cannot be controlled unless they are cooled to absolute zero."
            ],
            correctAnswer: 1, // Index 1 = B
            explanation: "The passage describes the main vulnerability of quantum computing (decoherence from environmental noise) and introduces topological qubits as a promising solution that resists interference and brings practical quantum computing closer."
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        // Build Interactive Web Quiz
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage.replace(/\n/g, '<br>')}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        // Build Hidden "Blank Print" Version
        let printHTML = '<h1 style="text-align: center; color: #1a5276; margin-bottom: 5px;">SAT Reading Practice - Set 25</h1><h3 style="text-align: center; margin-top: 0; margin-bottom: 30px; color: #555;">Blank Copy</h3><hr style="margin-bottom:30px; border: 0; border-top: 1px solid #ccc;">';
        
        quizData.forEach((q, index) => {
            let printOptionsHTML = '';
            q.options.forEach(opt => {
                printOptionsHTML += `
                    <li style="margin-bottom: 12px; display: flex; align-items: baseline;">
                        <div style="display:inline-block; width:14px; height:14px; border:2px solid #555; border-radius:50%; margin-right:12px; position:relative; top: 2px; flex-shrink: 0;"></div>
                        <span>${opt}</span>
                    </li>
                `;
            });
            
            printHTML += `
                <div style="margin-bottom: 45px; page-break-inside: avoid;">
                    <p style="font-weight: bold; font-size: 1.1em; color: #333;">Question ${index + 1}</p>
                    <div style="font-family: Georgia, serif; padding: 15px; background-color: #f9f9f9; border-left: 4px solid #ccc; margin-bottom: 15px;">${q.passage.replace(/\n/g, '<br>')}</div>
                    <p style="font-weight: bold; margin-bottom: 15px;">${q.prompt}</p>
                    <ul style="list-style-type: none; padding: 0;">${printOptionsHTML}</ul>
                </div>
            `;
        });
        document.getElementById('print-blank-container').innerHTML = printHTML;

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please select an answer before checking.";
            feedbackDiv.className = "feedback warning";
            return;
        }

        isLocked[currentQuestion] = true;
        
        const radios = document.getElementsByName(`q${currentQuestion}`);
        radios.forEach(r => r.disabled = true);
        q.options.forEach((_, optIndex) => {
            document.getElementById(`label-${currentQuestion}-${optIndex}`).classList.add('disabled');
        });

        updateNav();

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct!</strong><br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Checked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                const radios = document.getElementsByName(`q${index}`);
                radios.forEach(r => r.disabled = true);
                feedbackDiv.innerHTML = `<strong>Unanswered / Not Checked.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        document.querySelector('.print-blank-btn').style.display = 'none'; 
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `You scored ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)`;
        
        if (score === quizData.length) {
            document.getElementById('harvard-reward').style.display = 'block';
        }
        
        window.scrollTo(0, 0);
    }

    function printBlankQuiz() {
        document.body.classList.add('print-blank-mode');
        window.print();
        document.body.classList.remove('print-blank-mode');
    }

    window.onload = initQuiz;
</script>

</body>
</html>
