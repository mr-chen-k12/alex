<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT Reading Practice - Set 9-10a</title>
<style>
    /* General Styles */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        position: relative;
    }
    h1 {
        text-align: center;
        color: #1a5276;
    }
    
    .print-blank-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        background-color: #7f8c8d;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 4px;
        color: white;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
    }
    .print-blank-btn:hover {
        background-color: #616a6b;
    }

    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #f9f9f9;
        padding: 15px;
        border-left: 4px solid #1a5276;
        margin-bottom: 20px;
        font-size: 1.05em;
    }
    .prompt {
        font-weight: bold;
        margin-bottom: 15px;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 10px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #f0f3f4;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #d5dbdb;
    }
    .options label:hover {
        background: #e5e8e8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }
    .options input {
        margin-right: 15px;
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 4px;
        display: none;
        border-left: 4px solid;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #1e8449;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #c0392b;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #eee;
        padding-top: 20px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #1a5276;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #154360; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    .check-btn { background-color: #d35400; }
    .check-btn:hover { background-color: #a04000; }
    .check-btn:disabled { background-color: #e59866; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #1e8449; }
    
    #results {
        display: none;
        text-align: center;
        padding: 20px;
        background: #eafaf1;
        border: 2px solid #2ecc71;
        border-radius: 8px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        color: #7f8c8d;
    }

    #harvard-reward {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #fff;
        border: 3px double #a51c30;
        border-radius: 8px;
        animation: pullUp 0.5s ease-out;
    }
    #harvard-reward img {
        width: 160px;
        height: auto;
        margin: 15px auto;
        display: block;
    }
    .harvard-text {
        color: #a51c30;
        font-family: Georgia, serif;
        font-size: 1.4em;
        font-weight: bold;
        letter-spacing: 1px;
    }

    #print-blank-container {
        display: none;
    }

    @keyframes pullUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* Printer Friendly Styles */
    @media print {
        body { background-color: white; padding: 0; }
        
        #quiz-container { box-shadow: none; max-width: 100%; border: none; padding: 0; }
        .question-block { 
            display: block !important; 
            page-break-inside: avoid; 
            border-bottom: 1px solid #ccc; 
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .nav-buttons, .check-btn, .progress-tracker, button, .print-blank-btn { display: none !important; }
        .options label { border: none; padding: 5px 0; background: transparent; }
        .options input { appearance: auto; } 

        #harvard-reward {
            display: block !important;
            border: 2px solid #a51c30 !important;
        }

        /* Override for Blank Print Mode */
        body.print-blank-mode #quiz-container { display: none !important; }
        body.print-blank-mode #print-blank-container { display: block !important; }
    }

    @media screen and (max-width: 600px) {
        .print-blank-btn {
            position: relative;
            top: 0;
            right: 0;
            display: block;
            margin: 0 auto 20px auto;
        }
    }
</style>
</head>
<body>

<div id="quiz-container">
    <button class="print-blank-btn" onclick="printBlankQuiz()">🖨️ Print Blank Quiz</button>
    <h1>SAT Reading Practice - Set 9-10a</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>Quiz Complete</h2>
        <p id="score-display" style="font-size: 1.5em; font-weight: bold;"></p>
        <p>Review your answers and explanations below.</p>
        
        <div id="harvard-reward">
            <div class="harvard-text">★ FLAWLESS ACADEMIC EXCELLENCE ★</div>
            <img src="https://raw.githubusercontent.com/mr-chen-k12/math/main/IMG_0232.png" alt="Harvard University Crest">
            <p style="color: #555; font-style: italic; font-weight: bold; margin-top: 5px;">You have successfully earned the Harvard University verification crest for achieving a perfect 10/10 score.</p>
        </div>

        <button onclick="window.print()" style="margin-top: 15px;">🖨️ Print Results</button>
    </div>

    <div id="questions-wrapper">
        <!-- Questions injected here -->
    </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit for Review</button>
    </div>
</div>

<div id="print-blank-container"></div>

<script>
    const quizData = [
        {
            passage: "Although the preliminary findings seemed to indicate a groundbreaking synthesis in high-temperature superconductivity, subsequent re-examinations revealed that the initial data was _______, forcing the research team to retract their publication and reconsider their core hypothesis.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["spurious", "irrefutable", "meticulous", "paramount"],
            correctAnswer: 0, // A
            explanation: "'Spurious' means false, illegitimate, or fake. The context notes that subsequent re-examinations forced the team to retract their publication, meaning the initial data was invalid or false."
        },
        {
            passage: "Bioluminescence in deep-sea marine organisms serves diverse ecological functions beyond simple lighting. In mesopelagic comb jellies, bioluminescent flashes disrupt predator targeting, whereas female anglerfish deploy a glowing lure populated with symbiotic bacteria to attract unsuspecting prey in pitch-black waters. Furthermore, counterillumination—where organisms emit light matching the intensity of downwelling sunlight—allows certain squid species to camouflage their silhouettes from beneath. These adaptations demonstrate that bioluminescence functions primarily as a multifaceted survival mechanism across deep-water species.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Bioluminescence in deep-sea creatures is exclusively used for luring prey into striking distance.",
                "Comb jellies and anglerfish share an identical evolutionary mechanism for producing bioluminescent light.",
                "Deep-sea organisms utilize bioluminescence in varied ways to enhance survival, including hunting, defense, and camouflage.",
                "Counterillumination is the most effective evolutionary strategy for deep-water marine predators."
            ],
            correctAnswer: 2, // C
            explanation: "The passage illustrates three distinct uses of bioluminescence (predator defense, attracting prey, and counterillumination camouflage) to support the main point that bioluminescence is a multifaceted survival mechanism."
        },
        {
            passage: "Historian Dr. Marcella Vance analyzed the economic networks connecting Eastern Mediterranean port cities during the Bronze Age. <b>Specifically, Vance mapped the distribution of distinctive Aegean ceramic hoards to show that trade routes were maintained by decentralized merchant guilds rather than strictly royal monopolies.</b> This evidence challenged long-standing academic theories asserting that Bronze Age commerce was entirely state-controlled.",
            prompt: "Which choice best describes the function of the highlighted sentence in the overall structure of the text?",
            options: [
                "It presents concrete archeological evidence supporting Vance's claim regarding independent merchant activity.",
                "It outlines a methodological flaw in previous studies of Mediterranean maritime commerce.",
                "It summarizes royal decrees that established monopolies over Aegean ceramic exports.",
                "It contrasts Bronze Age merchant networks with those operating in Classical Greece."
            ],
            correctAnswer: 0, // A
            explanation: "The highlighted sentence details the specific empirical evidence (mapping Aegean ceramic hoards) that Dr. Vance used to support her conclusion that merchant guilds operated independently of state monopolies."
        },
        {
            passage: "A public health researcher hypothesizes that expanding urban green canopy coverage in residential neighborhoods directly lowers long-term physiological stress markers in residents.",
            prompt: "Which choice from a community health study best supports the researcher's hypothesis?",
            options: [
                "\"Residents living in municipal sectors with tree canopy coverage exceeding 35% exhibited statistically significant reductions in baseline salivary cortisol levels over a three-year period.\"",
                "\"Public survey responses indicate that 80% of urban residents favor allocating city funds toward park maintenance.\"",
                "\"Urban green spaces attract diverse species of migratory birds during early spring months.\"",
                "\"Constructing new public parks requires significant initial capital investments from local municipal governments.\""
            ],
            correctAnswer: 0, // A
            explanation: "Salivary cortisol is a standard biological marker for physiological stress. Demonstrating a statistically significant reduction in cortisol in high-canopy areas provides direct evidence supporting the hypothesis."
        },
        {
            passage: "Text 1\nSatellite-based remote sensing provides unprecedented global oversight of oceanic phytoplankton blooms. By measuring sea-surface color changes across vast regions simultaneously, satellite imagery allows oceanographers to track macro-level biomass fluctuations and evaluate global carbon cycle dynamics in real time.\n\nText 2\nWhile satellite observations yield broad spatial coverage of ocean surfaces, they cannot penetrate beyond the top few meters of the water column. Consequently, satellite metrics frequently miss deep-chlorophyll maxima—dense populations of phytoplankton thriving in subsurface layers—leading to significant underestimations of total marine primary production unless paired with in-situ robotic float data.",
            prompt: "Based on the texts, how would the author of Text 2 most likely view the satellite-based methodology described in Text 1?",
            options: [
                "As an obsolete technology that should be replaced entirely by surface water sampling.",
                "As a valuable tool for surface observation that nonetheless yields incomplete data unless supplemented by subsurface measurement techniques.",
                "As a flawless approach that provides total transparency regarding carbon cycling at all ocean depths.",
                "As an unreliable method due to constant calibration errors caused by atmospheric interference."
            ],
            correctAnswer: 1, // B
            explanation: "Text 2 acknowledges satellite coverage offers broad spatial data but points out its inability to measure below the surface, concluding it leads to underestimations unless paired with in-situ deep float data."
        },
        {
            passage: "Mycorrhizal fungi establish symbiotic networks with forest tree roots, facilitating nutrient exchange between host trees. In a controlled forestry study, researchers introduced isotopic carbon tracers into mature canopy trees. Within days, the labeled carbon was detected in shaded, juvenile saplings connected to the same underground fungal network. Furthermore, when the fungal connections were physically severed, the carbon transfer between canopy trees and saplings ceased entirely. These findings suggest that mycorrhizal networks ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "compete aggressively with juvenile saplings for limited organic carbon.",
                "act as conduit channels that redistribute photosynthesized carbon from mature trees to understory saplings.",
                "prevent mature canopy trees from absorbing essential soil minerals.",
                "render saplings completely independent of sunlight for photosynthesis."
            ],
            correctAnswer: 1, // B
            explanation: "The experiment proved that carbon moved from canopy trees to shaded saplings through the fungal network, and stopping the connection stopped the carbon transfer, demonstrating its role as a redistribution conduit."
        },
        {
            passage: "During the debate, the philosopher's response was celebrated for its _______; she methodically dismantled each opposing premise with surgical logical clarity and incontrovertible empirical evidence.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["cogency", "ambiguity", "verbosity", "incoherence"],
            correctAnswer: 0, // A
            explanation: "'Cogency' refers to the quality of being clear, logical, and convincing. Methodically dismantling premises with clarity and incontrovertible evidence exemplifies cogency."
        },
        {
            passage: "Computational linguists studying language drift have noted that isolated island communities often retain archaic phonemes long after those sound patterns disappear from continental dialects. For instance, the dialect of Icelandic spoken today retains structural features and vocabulary that have been extinct in mainland Scandinavian languages for centuries. Researchers attribute this phonetic conservation to geographic isolation, which shields localized speech communities from external linguistic influences and rapid dialectical mixing.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Icelandic is the most difficult European language for non-native speakers to acquire.",
                "Geographic isolation can preserve historic linguistic traits by protecting speech communities from external shifts.",
                "Continental Scandinavian languages evolved entirely without grammatical rules or structural consistency.",
                "Phonetic conservation occurs only in regions where formal written dictionaries are banned."
            ],
            correctAnswer: 1, // B
            explanation: "The passage uses Icelandic as an example to explain how geographic isolation protects speech communities from external shifts, preserving archaic language features."
        },
        {
            passage: "The archive curator insisted on organizing the historic manuscript collection according to thematic development rather than an _______ chronological timeline, arguing that strict date sequencing obscured the conceptual evolution of the author's philosophical ideas.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["arbitrary", "indispensable", "innovative", "unprecedented"],
            correctAnswer: 0, // A
            explanation: "'Arbitrary' in this context means determined by chance or wholesale convention rather than internal logic or relevance. The curator felt a rigid date timeline was arbitrary compared to a thematic organization."
        },
        {
            passage: "Grid-scale battery energy storage systems (BESS) are increasingly deployed alongside renewable energy farms to stabilize power grids. Because solar and wind generation fluctuate based on weather, sudden drops in generation can cause voltage instabilities. BESS units respond to frequency shifts in milliseconds, discharging stored power during production lulls and charging during surplus generation. This rapid response capacity suggests that integrating grid-scale battery storage ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "increases reliance on fossil-fuel power plants during peak weather shifts.",
                "mitigates grid volatility caused by the intermittent nature of renewable power generation.",
                "eliminates the necessity of transmission lines between rural generators and urban centers.",
                "forces power plants to shut down permanently during periods of high demand."
            ],
            correctAnswer: 1, // B
            explanation: "The text explains that BESS units quickly discharge power during lulls and absorb surplus power, smoothing out fluctuations. Thus, they mitigate grid volatility from intermittent renewable power."
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        // Build Interactive Web Quiz
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        // Build Hidden "Blank Print" Version
        let printHTML = '<h1 style="text-align: center; color: #1a5276; margin-bottom: 5px;">SAT Reading Practice - Set 9-10a</h1><h3 style="text-align: center; margin-top: 0; margin-bottom: 30px; color: #555;">Blank Copy</h3><hr style="margin-bottom:30px; border: 0; border-top: 1px solid #ccc;">';
        
        quizData.forEach((q, index) => {
            let printOptionsHTML = '';
            q.options.forEach(opt => {
                printOptionsHTML += `
                    <li style="margin-bottom: 12px; display: flex; align-items: baseline;">
                        <div style="display:inline-block; width:14px; height:14px; border:2px solid #555; border-radius:50%; margin-right:12px; position:relative; top: 2px; flex-shrink: 0;"></div>
                        <span>${opt}</span>
                    </li>
                `;
            });
            
            printHTML += `
                <div style="margin-bottom: 45px; page-break-inside: avoid;">
                    <p style="font-weight: bold; font-size: 1.1em; color: #333;">Question ${index + 1}</p>
                    <div style="font-family: Georgia, serif; padding: 15px; background-color: #f9f9f9; border-left: 4px solid #ccc; margin-bottom: 15px;">${q.passage}</div>
                    <p style="font-weight: bold; margin-bottom: 15px;">${q.prompt}</p>
                    <ul style="list-style-type: none; padding: 0;">${printOptionsHTML}</ul>
                </div>
            `;
        });
        document.getElementById('print-blank-container').innerHTML = printHTML;

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please select an answer before checking.";
            feedbackDiv.className = "feedback warning";
            return;
        }

        isLocked[currentQuestion] = true;
        
        const radios = document.getElementsByName(`q${currentQuestion}`);
        radios.forEach(r => r.disabled = true);
        q.options.forEach((_, optIndex) => {
            document.getElementById(`label-${currentQuestion}-${optIndex}`).classList.add('disabled');
        });

        updateNav();

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct!</strong><br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Checked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                const radios = document.getElementsByName(`q${index}`);
                radios.forEach(r => r.disabled = true);
                feedbackDiv.innerHTML = `<strong>Unanswered / Not Checked.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        document.querySelector('.print-blank-btn').style.display = 'none'; 
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `You scored ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)`;
        
        // Displays Harvard reward logo when student achieves 100% (10/10)
        if (score === quizData.length) {
            document.getElementById('harvard-reward').style.display = 'block';
        }
        
        window.scrollTo(0, 0);
    }

    function printBlankQuiz() {
        document.body.classList.add('print-blank-mode');
        window.print();
        document.body.classList.remove('print-blank-mode');
    }

    window.onload = initQuiz;
</script>

</body>
</html>
