<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT Reading Practice - Set 26</title>
<style>
    /* General Styles */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        position: relative;
    }
    h1 {
        text-align: center;
        color: #1a5276;
    }
    
    .print-blank-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        background-color: #7f8c8d;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 4px;
        color: white;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
    }
    .print-blank-btn:hover {
        background-color: #616a6b;
    }

    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #f9f9f9;
        padding: 15px;
        border-left: 4px solid #1a5276;
        margin-bottom: 20px;
        font-size: 1.05em;
    }
    .prompt {
        font-weight: bold;
        margin-bottom: 15px;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 10px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #f0f3f4;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #d5dbdb;
    }
    .options label:hover {
        background: #e5e8e8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }
    .options input {
        margin-right: 15px;
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 4px;
        display: none;
        border-left: 4px solid;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #1e8449;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #c0392b;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #eee;
        padding-top: 20px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #1a5276;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #154360; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    .check-btn { background-color: #d35400; }
    .check-btn:hover { background-color: #a04000; }
    .check-btn:disabled { background-color: #e59866; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #1e8449; }
    
    #results {
        display: none;
        text-align: center;
        padding: 20px;
        background: #eafaf1;
        border: 2px solid #2ecc71;
        border-radius: 8px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        color: #7f8c8d;
    }

    #harvard-reward {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #fff;
        border: 3px double #a51c30;
        border-radius: 8px;
        animation: pullUp 0.5s ease-out;
    }
    #harvard-reward img {
        width: 160px;
        height: auto;
        margin: 15px auto;
        display: block;
    }
    .harvard-text {
        color: #a51c30;
        font-family: Georgia, serif;
        font-size: 1.4em;
        font-weight: bold;
        letter-spacing: 1px;
    }

    #print-blank-container {
        display: none;
    }

    @keyframes pullUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* Printer Friendly Styles */
    @media print {
        body { background-color: white; padding: 0; }
        
        #quiz-container { box-shadow: none; max-width: 100%; border: none; padding: 0; }
        .question-block { 
            display: block !important; 
            page-break-inside: avoid; 
            border-bottom: 1px solid #ccc; 
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .nav-buttons, .check-btn, .progress-tracker, button, .print-blank-btn { display: none !important; }
        .options label { border: none; padding: 5px 0; background: transparent; }
        .options input { appearance: auto; } 

        #harvard-reward {
            display: block !important;
            border: 2px solid #a51c30 !important;
        }

        /* Override for Blank Print Mode */
        body.print-blank-mode #quiz-container { display: none !important; }
        body.print-blank-mode #print-blank-container { display: block !important; }
    }

    @media screen and (max-width: 600px) {
        .print-blank-btn {
            position: relative;
            top: 0;
            right: 0;
            display: block;
            margin: 0 auto 20px auto;
        }
    }
</style>
</head>
<body>

<div id="quiz-container">
    <button class="print-blank-btn" onclick="printBlankQuiz()">🖨️ Print Blank Quiz</button>
    <h1>SAT Reading Practice - Set 26</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>Quiz Complete</h2>
        <p id="score-display" style="font-size: 1.5em; font-weight: bold;"></p>
        <p>Review your answers and explanations below.</p>
        
        <div id="harvard-reward">
            <div class="harvard-text">★ FLAWLESS ACADEMIC EXCELLENCE ★</div>
            <img src="https://mr-chen-k12.github.io/math/IMG_0232.png" alt="Harvard University Crest">
            <p style="color: #555; font-style: italic; font-weight: bold; margin-top: 5px;">You have successfully earned the Harvard University verification crest for achieving a perfect 10/10 score.</p>
        </div>

        <button onclick="window.print()" style="margin-top: 15px;">🖨️ Print Results</button>
    </div>

    <div id="questions-wrapper">
        <!-- Questions injected here -->
    </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit for Review</button>
    </div>
</div>

<div id="print-blank-container"></div>

<script>
    const quizData = [
        {
            passage: "Although many traditional economists predicted that the transition to flexible remote work models would prove _______ to overall employee output, multi-year workplace analytics revealed that productivity and project completion rates actually increased substantially.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["beneficial", "detrimental", "indifferent", "precarious"],
            correctAnswer: 1, // Index 1 = B
            explanation: "'Detrimental' means causing harm or damage. The word 'Although' establishes a contrast between the economists' initial negative predictions and the actual outcome ('productivity... increased substantially')."
        },
        {
            passage: "In a study on avian intelligence, cognitive biologists observed Western scrub-jays re-hiding food stores when another bird was present during the initial caching process. Interestingly, this re-hiding behavior was only observed in scrub-jays that had previously stolen food from other birds themselves. This suggests that scrub-jays project their own past deceptive behaviors onto others to anticipate future theft, demonstrating an advanced social cognition known as 'theory of mind.'",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Scrub-jays re-hide food stores primarily in response to changes in seasonal temperatures.",
                "Food caching in birds is an instinctive habit that occurs without regard to social dynamics.",
                "Scrub-jays use their own past experience with theft to anticipate potential theft by rival birds, exhibiting theory of mind.",
                "Avian intelligence is strictly limited to basic navigation and foraging strategies."
            ],
            correctAnswer: 2, // Index 2 = C
            explanation: "The passage explains that scrub-jays that have stolen food themselves re-hide food in front of onlookers, showing they project their own experiences onto rivals to anticipate theft—an example of 'theory of mind'. Option C accurately summarizes this main point."
        },
        {
            passage: "Deep-sea hydrothermal vents release superheated mineral fluids into ocean basins, creating extreme chemical gradients where sunlight cannot penetrate. Chemoautotrophic bacteria utilize dissolved hydrogen sulfide from these vents to synthesize organic molecules through chemosynthesis, forming the foundational energy source for complex benthic ecosystems like tube worms and vent shrimp. Because these entire biological communities thrive in complete darkness relying solely on chemical energy, planetary scientists hypothesize that life on ice-covered ocean moons like Europa might ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "depend entirely on solar radiation penetrating thick surface ice sheets.",
                "require dense atmospheric oxygen levels to sustain primitive organisms.",
                "consist exclusively of photosynthetic plant species adapted to freezing temperatures.",
                "exist near sub-surface hydrothermal vents powered by chemical reactions rather than sunlight."
            ],
            correctAnswer: 3, // Index 3 = D
            explanation: "The passage demonstrates that deep-sea communities can flourish without sunlight using chemical energy from hydrothermal vents. Therefore, scientists logically hypothesize that life on icy ocean moons could exist near sub-surface hydrothermal vents using chemical energy."
        },
        {
            passage: "In 1912, Alfred Wegener proposed the theory of continental drift, arguing that Earth's landmasses were once joined in a single supercontinent called Pangea. **However, contemporary geologists overwhelmingly rejected Wegener's hypothesis because he could not identify a plausible physical mechanism capable of driving the movement of massive continents across the ocean floor.** It was not until the 1960s, with the discovery of seafloor spreading and plate tectonics, that Wegener's core idea was scientifically validated.",
            prompt: "Which choice best describes the function of the highlighted sentence in the overall structure of the text?",
            options: [
                "It explains why Wegener's theory was initially dismissed by the scientific community.",
                "It details the specific empirical proof Wegener gathered during his polar expeditions.",
                "It introduces the modern concept of plate tectonics and mantle convection.",
                "It demonstrates that continental drift has been rendered completely obsolete by recent oceanographic discoveries."
            ],
            correctAnswer: 0, // Index 0 = A
            explanation: "The highlighted sentence specifically details the reason geologists rejected Wegener's hypothesis in 1912 (the lack of a plausible physical mechanism), explaining why his theory was initially dismissed."
        },
        {
            passage: "Text 1\nUniversal basic income (UBI)—unconditional financial transfers provided regularly to all citizens—offers a transformative solution to economic inequality. By guaranteeing a baseline financial safety net, UBI eradicates poverty, improves public health, and allows workers to pursue education or entrepreneurial ventures without fear of immediate destitution.\n\nText 2\nWhile small-scale guaranteed income pilots demonstrate localized benefits, implementing a national UBI program would trigger severe macroeconomic turmoil. Funding universal payments requires steep tax increases that disincentivize private investment, while simultaneously driving demand-pull inflation that erodes household purchasing power.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to Text 1's claim that UBI 'offers a transformative solution to economic inequality'?",
            options: [
                "By arguing that UBI creates long-term financial growth without requiring tax revenues.",
                "By contending that national UBI implementation introduces macroeconomic risks—such as inflation and reduced investment—that outweigh its localized benefits.",
                "By suggesting that cash transfers should be restricted entirely to corporate entities rather than citizens.",
                "By asserting that economic inequality can only be eliminated by returning to a gold-backed currency system."
            ],
            correctAnswer: 1, // Index 1 = B
            explanation: "Text 2 acknowledges localized benefits of pilot programs but argues that nationwide implementation creates severe macroeconomic issues (tax spikes, inflation, reduced investment). Thus, the author would argue that national risks outweigh the benefits highlighted in Text 1."
        },
        {
            passage: "Literary scholar James Vance argues that in her poetry, Emily Dickinson frequently uses unexpected dashes and irregular capitalization not as stylistic eccentricities, but to visually simulate the fractured, hesitant pacing of internal thought processes.",
            prompt: "Which quotation from a critical analysis of Dickinson's poetry best supports James Vance's argument?",
            options: [
                "\"In 'I heard a Fly buzz - when I died -', the sudden mid-line dashes disrupt syntactic flow, forcing the reader to experience the speaker's faltering consciousness.\"",
                "\"Dickinson was an avid correspondent who regularly mailed hand-copied poems to literary editors throughout New England.\"",
                "\"The rhythmic structure of Dickinson's hymn-like stanzas mirrors traditional English ballad meters popular during the nineteenth century.\"",
                "\"Posthumous editors routinely altered Dickinson's original punctuation to conform to standardized grammatical conventions.\""
            ],
            correctAnswer: 0, // Index 0 = A
            explanation: "James Vance claims Dickinson's dashes simulate fractured, hesitant internal thought pacing. Option A directly supports this assertion by noting how mid-line dashes disrupt syntax to reflect faltering consciousness."
        },
        {
            passage: "The lead investigator maintained a strictly _______ posture throughout the high-profile inquiry, declining to comment publicly or favor either political party until all physical evidence had been thoroughly examined by independent forensic laboratories.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["partisan", "dispassionate", "dogmatic", "volatile"],
            correctAnswer: 1, // Index 1 = B
            explanation: "'Dispassionate' means neutral, objective, and uninfluenced by emotion or personal bias. The text emphasizes that the investigator refused to comment publicly or favor either political party, maintaining strict objectivity."
        },
        {
            passage: "Atmospheric chemists studying indoor air quality discovered that household cleaning products containing terpenes react with ambient indoor ozone to form ultrafine secondary organic aerosols (SOAs). Laboratory experiments confirmed that increasing ventilation rates in rooms significantly reduced indoor ozone concentrations, thereby halting the chemical reactions that generate SOAs. Because high SOA levels cause respiratory irritation, researchers conclude that simple improvements in indoor air circulation can ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "increase human exposure to hazardous volatile organic compounds during cleaning.",
                "eliminate the necessity for sanitizing surfaces in commercial facilities.",
                "mitigate the formation of irritating air pollutants generated during household cleaning.",
                "cause indoor ozone concentrations to rise to dangerous outdoor levels."
            ],
            correctAnswer: 2, // Index 2 = C
            explanation: "The text explains that higher ventilation reduces indoor ozone, stopping the chemical reactions that form respiratory-irritating SOAs. Therefore, improving indoor air circulation can mitigate the formation of these irritating pollutants."
        },
        {
            passage: "Dendrochronology, the study of tree-ring growth patterns, allows archaeologists to precisely date wooden artifacts and reconstruct historical climate variations. Because trees produce wider rings during wet, favorable growing seasons and narrower rings during droughts, ring sequences create a distinct environmental pattern for a given geographical area. By matching overlapping ring sequences across living trees and ancient timber structures, researchers have established continuous climate chronologies extending back thousands of years.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Tree-ring growth varies so wildly within individual forests that dendrochronology cannot reliably date artifacts.",
                "Severe droughts are the single determining factor in whether ancient trees survive to maturity.",
                "Dendrochronology utilizes tree-ring growth sequences to date historical wooden objects and map past climate trends.",
                "Modern archaeologists rely exclusively on radiocarbon dating for analyzing ancient wooden structures."
            ],
            correctAnswer: 2, // Index 2 = C
            explanation: "The passage explains how dendrochronology uses tree-ring sequences to accurately date historical wooden objects and reconstruct historical climate patterns. Option C encapsulates this central point."
        },
        {
            passage: "Far from being an insurmountable obstacle, the initial engineering setback served as a powerful catalyst, inspiring the design team to overhaul their propulsion architecture and ultimately produce a far more _______ and energy-efficient system.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["fragile", "obsolete", "redundant", "robust"],
            correctAnswer: 3, // Index 3 = D
            explanation: "'Robust' means strong, resilient, or sturdy. The sentence sets up a positive contrast with 'insurmountable obstacle', noting that the setback inspired an overhaul that yielded a far more effective ('robust and energy-efficient') system."
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        // Build Interactive Web Quiz
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage.replace(/\n/g, '<br>')}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        // Build Hidden "Blank Print" Version
        let printHTML = '<h1 style="text-align: center; color: #1a5276; margin-bottom: 5px;">SAT Reading Practice - Set 26</h1><h3 style="text-align: center; margin-top: 0; margin-bottom: 30px; color: #555;">Blank Copy</h3><hr style="margin-bottom:30px; border: 0; border-top: 1px solid #ccc;">';
        
        quizData.forEach((q, index) => {
            let printOptionsHTML = '';
            q.options.forEach(opt => {
                printOptionsHTML += `
                    <li style="margin-bottom: 12px; display: flex; align-items: baseline;">
                        <div style="display:inline-block; width:14px; height:14px; border:2px solid #555; border-radius:50%; margin-right:12px; position:relative; top: 2px; flex-shrink: 0;"></div>
                        <span>${opt}</span>
                    </li>
                `;
            });
            
            printHTML += `
                <div style="margin-bottom: 45px; page-break-inside: avoid;">
                    <p style="font-weight: bold; font-size: 1.1em; color: #333;">Question ${index + 1}</p>
                    <div style="font-family: Georgia, serif; padding: 15px; background-color: #f9f9f9; border-left: 4px solid #ccc; margin-bottom: 15px;">${q.passage.replace(/\n/g, '<br>')}</div>
                    <p style="font-weight: bold; margin-bottom: 15px;">${q.prompt}</p>
                    <ul style="list-style-type: none; padding: 0;">${printOptionsHTML}</ul>
                </div>
            `;
        });
        document.getElementById('print-blank-container').innerHTML = printHTML;

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please select an answer before checking.";
            feedbackDiv.className = "feedback warning";
            return;
        }

        isLocked[currentQuestion] = true;
        
        const radios = document.getElementsByName(`q${currentQuestion}`);
        radios.forEach(r => r.disabled = true);
        q.options.forEach((_, optIndex) => {
            document.getElementById(`label-${currentQuestion}-${optIndex}`).classList.add('disabled');
        });

        updateNav();

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct!</strong><br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Checked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                const radios = document.getElementsByName(`q${index}`);
                radios.forEach(r => r.disabled = true);
                feedbackDiv.innerHTML = `<strong>Unanswered / Not Checked.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        document.querySelector('.print-blank-btn').style.display = 'none'; 
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `You scored ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)`;
        
        if (score === quizData.length) {
            document.getElementById('harvard-reward').style.display = 'block';
        }
        
        window.scrollTo(0, 0);
    }

    function printBlankQuiz() {
        document.body.classList.add('print-blank-mode');
        window.print();
        document.body.classList.remove('print-blank-mode');
    }

    window.onload = initQuiz;
</script>

</body>
</html>
