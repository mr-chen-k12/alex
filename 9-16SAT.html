<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT Reading Practice - Set 9-15a</title>
<style>
    /* General Styles */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        position: relative;
    }
    h1 {
        text-align: center;
        color: #1a5276;
    }
    
    .print-blank-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        background-color: #7f8c8d;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 4px;
        color: white;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
    }
    .print-blank-btn:hover {
        background-color: #616a6b;
    }

    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #f9f9f9;
        padding: 15px;
        border-left: 4px solid #1a5276;
        margin-bottom: 20px;
        font-size: 1.05em;
    }
    .prompt {
        font-weight: bold;
        margin-bottom: 15px;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 10px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #f0f3f4;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #d5dbdb;
    }
    .options label:hover {
        background: #e5e8e8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }
    .options input {
        margin-right: 15px;
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 4px;
        display: none;
        border-left: 4px solid;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #1e8449;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #c0392b;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #eee;
        padding-top: 20px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #1a5276;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #154360; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    .check-btn { background-color: #d35400; }
    .check-btn:hover { background-color: #a04000; }
    .check-btn:disabled { background-color: #e59866; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #1e8449; }
    
    #results {
        display: none;
        text-align: center;
        padding: 20px;
        background: #eafaf1;
        border: 2px solid #2ecc71;
        border-radius: 8px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        color: #7f8c8d;
    }

    #univ-reward {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #fff;
        border: 3px double #a51c30;
        border-radius: 8px;
        animation: pullUp 0.5s ease-out;
    }
    #univ-reward img {
        width: 160px;
        height: auto;
        margin: 15px auto;
        display: block;
    }
    .univ-text {
        font-family: Georgia, serif;
        font-size: 1.4em;
        font-weight: bold;
        letter-spacing: 1px;
    }

    #print-blank-container {
        display: none;
    }

    @keyframes pullUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* Printer Friendly Styles */
    @media print {
        body { background-color: white; padding: 0; }
        
        #quiz-container { box-shadow: none; max-width: 100%; border: none; padding: 0; }
        .question-block { 
            display: block !important; 
            page-break-inside: avoid; 
            border-bottom: 1px solid #ccc; 
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .nav-buttons, .check-btn, .progress-tracker, button, .print-blank-btn { display: none !important; }
        .options label { border: none; padding: 5px 0; background: transparent; }
        .options input { appearance: auto; } 

        #univ-reward {
            display: block !important;
            border-style: solid !important;
            border-width: 2px !important;
        }

        /* Override for Blank Print Mode */
        body.print-blank-mode #quiz-container { display: none !important; }
        body.print-blank-mode #print-blank-container { display: block !important; }
    }

    @media screen and (max-width: 600px) {
        .print-blank-btn {
            position: relative;
            top: 0;
            right: 0;
            display: block;
            margin: 0 auto 20px auto;
        }
    }
</style>
</head>
<body>

<div id="quiz-container">
    <button class="print-blank-btn" onclick="printBlankQuiz()">🖨️ Print Blank Quiz</button>
    <h1>SAT Reading Practice - Set 9-15a</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>Quiz Complete</h2>
        <p id="score-display" style="font-size: 1.5em; font-weight: bold;"></p>
        <p>Review your answers and explanations below.</p>
        
        <div id="univ-reward">
            <div class="univ-text" id="univ-reward-title">★ FLAWLESS ACADEMIC EXCELLENCE ★</div>
            <img id="univ-reward-img" src="" alt="University Crest">
            <p id="univ-reward-text" style="color: #555; font-style: italic; font-weight: bold; margin-top: 5px;"></p>
        </div>

        <button onclick="window.print()" style="margin-top: 15px;">🖨️ Print Results</button>
    </div>

    <div id="questions-wrapper">
        <!-- Questions injected here -->
    </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit for Review</button>
    </div>
</div>

<div id="print-blank-container"></div>

<script>
    const universityRewards = [
        {
            name: "Harvard University",
            img: "https://mr-chen-k12.github.io/math/IMG_0232.png",
            color: "#a51c30"
        },
        {
            name: "Boston University",
            img: "https://mr-chen-k12.github.io/books/IMG_0121.png",
            color: "#CC0000"
        },
        {
            name: "Yale University",
            img: "https://mr-chen-k12.github.io/books/IMG_0122.png",
            color: "#00356B"
        }
    ];

    const quizData = [
        {
            passage: "Despite initial concerns that the sculptor's new experimental polymer medium would render her art _______, museum conservators noted that the sculptures maintained remarkable structural integrity and resistance to light degradation over several decades.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["ephemeral", "enduring", "ubiquitous", "pragmatic"],
            correctAnswer: 0, // A
            explanation: "'Ephemeral' means lasting for a very short time. The text contrasts initial worries about short lifespan ('ephemeral') with conservators' observations of long-term 'structural integrity' over decades."
        },
        {
            passage: "Ethnomusicologists studying traditional vocal techniques in the Appalachian Mountains discovered that distinct singing styles served as acoustic beacons across isolated valleys. Specific vocal resonance patterns allowed singers to convey messages across distances exceeding two miles. Rather than existing purely for artistic performance, these vocal traditions functioned as essential communication channels among remote rural settlements prior to telecommunications.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Appalachian vocal traditions functioned as important long-distance communication systems in addition to cultural expressions.",
                "Modern telecommunications have completely eliminated traditional music in mountainous regions.",
                "Vocal resonance in singers is determined entirely by altitude and air pressure.",
                "Ethnomusicologists consider mountain singing styles superior to contemporary vocal performances."
            ],
            correctAnswer: 0, // A
            explanation: "The text explains how Appalachian vocal traditions served as crucial long-distance communication systems across isolated valleys prior to modern telecommunications."
        },
        {
            passage: "Marine ecologists investigating coral reef degradation noted that herbivorous parrotfish feed heavily on invasive macroalgae that choke coral polyps. In protected marine reserves where parrotfish fishing was strictly banned, live coral cover rebounded by 35% over five years. Conversely, in unmanaged zones where parrotfish populations declined due to overfishing, macroalgae overwhelmed reef structures. This evidence suggests that safeguarding parrotfish populations _______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "is a vital strategy for promoting coral reef recovery and health.",
                "directly accelerates the growth of harmful invasive macroalgae species.",
                "causes immediate declines in overall ocean water clarity and quality.",
                "requires replacing natural reefs with artificial concrete structures."
            ],
            correctAnswer: 0, // A
            explanation: "Because parrotfish consume choking macroalgae and protected areas saw a 35% rebound in live coral cover, protecting parrotfish is logically a vital strategy for reef recovery."
        },
        {
            passage: "Archaeologists researching ancient agrarian settlement patterns in the Nile Delta reevaluated long-held assumptions about early irrigation practices. <b>Specifically, Dr. Hassan examined soil core sediment layers and pollen samples from 3000 BCE to demonstrate that seasonal flood basin farming predated canal building by centuries.</b> This empirical finding revised the chronological timeline of Egyptian agricultural development.",
            prompt: "Which choice best describes the function of the highlighted sentence in the overall structure of the text?",
            options: [
                "It details the specific empirical methodology and evidence Dr. Hassan used to revise the agricultural timeline.",
                "It presents a critique of modern irrigation systems used in contemporary Egyptian farming.",
                "It summarizes political conflicts between ancient Nile Delta city-states over water rights.",
                "It compares sediment layers in the Nile Delta with those found in the Indus Valley."
            ],
            correctAnswer: 0, // A
            explanation: "The highlighted sentence specifies the empirical methodology (analyzing soil core sediment layers and pollen samples) Dr. Hassan used to show flood basin farming predated canal building."
        },
        {
            passage: "Text 1\nUrban vertical farming offers a revolutionary solution to food production challenges. By growing crops indoors using hydro-technology and LED illumination, vertical farms yield up to ten times more produce per square foot while consuming 95% less water than traditional agriculture.\n\nText 2\nWhile vertical farming excels in water efficiency, its capital and energy costs remain prohibitive. Powering high-intensity LED grow lights and climate control units requires immense electricity, which often generates substantial carbon emissions if relying on fossil fuel grids.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to Text 1's enthusiastic view of vertical farming?",
            options: [
                "By pointing out that vertical farming's high energy consumption and operational costs hinder its environmental sustainability.",
                "By arguing that traditional outdoor farming uses significantly less land than vertical farming.",
                "By asserting that hydro-technology fails to supply crops with adequate nutrients.",
                "By agreeing that vertical farming completely eliminates the need for electrical grid energy."
            ],
            correctAnswer: 0, // A
            explanation: "Text 2 explicitly points out the immense electrical energy demands and potential carbon emissions of vertical farming, counterbalancing Text 1's optimism."
        },
        {
            passage: "Historian Dr. Evelyn Reed argues that the economic success of the Hanseatic League in medieval Northern Europe was driven primarily by standardized maritime trading regulations rather than superior naval force.",
            prompt: "Which quotation from a historical ledger best supports Dr. Reed's argument?",
            options: [
                "\"Merchant guilds across thirty Baltic ports adhered to unified commercial codes and standardized weights, facilitating rapid trade dispute resolutions.\"",
                "\"Hanseatic warships engaged in frequent battles against privateers along the North Sea coastline.\"",
                "\"Salted herring remained the most profitable commodity exported from Baltic fisheries during autumn months.\"",
                "\"Shipbuilders in Hamburg constructed larger wooden hulls to withstand winter storms.\""
            ],
            correctAnswer: 0, // A
            explanation: "Option A directly cites standardized commercial codes and weights across thirty ports, supporting Dr. Reed's claim that standardized trading regulations drove economic success."
        },
        {
            passage: "Although the scientific board initially regarded the researcher's theory with _______, subsequent independent trials replicated her remarkable results and confirmed the hypothesis.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["skepticism", "reverence", "credulity", "conviction"],
            correctAnswer: 0, // A
            explanation: "'Skepticism' means doubt or disbelief. The text contrasts initial scientific doubt ('skepticism') with later confirmation when independent trials replicated the results."
        },
        {
            passage: "Astrophysicists analyzing spectroscopic data from exoplanet Kepler-186f detected atmospheric water vapor absorption lines alongside stable surface temperatures conducive to liquid water. Climate models indicate that the planet's atmospheric density provides sufficient pressure to prevent water bodies from boiling or freezing solid. Because liquid water is considered a prerequisite for terrestrial-style biology, these observations imply that Kepler-186f _______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "possesses physical conditions capable of supporting liquid surface water and potential habitability.",
                "is composed entirely of dense hydrogen and helium gas with no solid surface.",
                "orbits its host star at a distance that causes immediate atmospheric evaporation.",
                "experiences surface temperatures far too extreme for molecular water formation."
            ],
            correctAnswer: 0, // A
            explanation: "Because atmospheric water vapor, stable temperatures, and sufficient atmospheric pressure were observed, Kepler-186f logically possesses conditions capable of supporting liquid water and potential habitability."
        },
        {
            passage: "Behavioral economists investigating decision-making found that the 'choice overload' phenomenon occurs when individuals face an excessive number of options. In field experiments, shoppers presented with 24 jam varieties were far less likely to complete a purchase than shoppers presented with only 6 varieties, despite the larger display attracting more initial browsers. Reducing choices decreased cognitive fatigue and increased final purchasing rates. Therefore, streamlining product selections can enhance consumer decision efficiency and boost sales.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Offering fewer choices can reduce decision fatigue and lead to higher purchase rates among consumers.",
                "Consumers consistently prefer large product assortments when making high-value purchases.",
                "Field experiments in retail settings are generally unreliable for predicting economic behavior.",
                "Cognitive fatigue is caused exclusively by visual exposure to bright supermarket displays."
            ],
            correctAnswer: 0, // A
            explanation: "The passage explains that offering fewer options reduces cognitive fatigue and increases purchase conversion, summarizing this main idea in Option A."
        },
        {
            passage: "The CEO was commended for her _______ leadership during the financial crisis; her calm demeanor and decisive strategic shifts steered the firm back to profitability without employee layoffs.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["exemplary", "precarious", "ineffectual", "erratic"],
            correctAnswer: 0, // A
            explanation: "'Exemplary' means serving as a desirable model; commendable. Steering a company back to profitability smoothly during a crisis represents exemplary leadership."
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        // Build Interactive Web Quiz
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        // Build Hidden "Blank Print" Version
        let printHTML = '<h1 style="text-align: center; color: #1a5276; margin-bottom: 5px;">SAT Reading Practice - Set 9-15a</h1><h3 style="text-align: center; margin-top: 0; margin-bottom: 30px; color: #555;">Blank Copy</h3><hr style="margin-bottom:30px; border: 0; border-top: 1px solid #ccc;">';
        
        quizData.forEach((q, index) => {
            let printOptionsHTML = '';
            q.options.forEach(opt => {
                printOptionsHTML += `
                    <li style="margin-bottom: 12px; display: flex; align-items: baseline;">
                        <div style="display:inline-block; width:14px; height:14px; border:2px solid #555; border-radius:50%; margin-right:12px; position:relative; top: 2px; flex-shrink: 0;"></div>
                        <span>${opt}</span>
                    </li>
                `;
            });
            
            printHTML += `
                <div style="margin-bottom: 45px; page-break-inside: avoid;">
                    <p style="font-weight: bold; font-size: 1.1em; color: #333;">Question ${index + 1}</p>
                    <div style="font-family: Georgia, serif; padding: 15px; background-color: #f9f9f9; border-left: 4px solid #ccc; margin-bottom: 15px;">${q.passage}</div>
                    <p style="font-weight: bold; margin-bottom: 15px;">${q.prompt}</p>
                    <ul style="list-style-type: none; padding: 0;">${printOptionsHTML}</ul>
                </div>
            `;
        });
        document.getElementById('print-blank-container').innerHTML = printHTML;

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please select an answer before checking.";
            feedbackDiv.className = "feedback warning";
            return;
        }

        isLocked[currentQuestion] = true;
        
        const radios = document.getElementsByName(`q${currentQuestion}`);
        radios.forEach(r => r.disabled = true);
        q.options.forEach((_, optIndex) => {
            document.getElementById(`label-${currentQuestion}-${optIndex}`).classList.add('disabled');
        });

        updateNav();

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct!</strong><br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Checked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                const radios = document.getElementsByName(`q${index}`);
                radios.forEach(r => r.disabled = true);
                feedbackDiv.innerHTML = `<strong>Unanswered / Not Checked.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        document.querySelector('.print-blank-btn').style.display = 'none'; 
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `You scored ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)`;
        
        // Pick a random university crest reward on a perfect score (10/10)
        if (score === quizData.length) {
            const reward = universityRewards[Math.floor(Math.random() * universityRewards.length)];
            const rewardDiv = document.getElementById('univ-reward');
            const rewardTitle = document.getElementById('univ-reward-title');
            const rewardImg = document.getElementById('univ-reward-img');
            const rewardText = document.getElementById('univ-reward-text');
            
            rewardDiv.style.borderColor = reward.color;
            rewardTitle.style.color = reward.color;
            rewardImg.src = reward.img;
            rewardImg.alt = reward.name + " Crest";
            rewardText.textContent = `You have successfully earned the ${reward.name} verification crest for achieving a perfect 10/10 score.`;
            
            rewardDiv.style.display = 'block';
        }
        
        window.scrollTo(0, 0);
    }

    function printBlankQuiz() {
        document.body.classList.add('print-blank-mode');
        window.print();
        document.body.classList.remove('print-blank-mode');
    }

    window.onload = initQuiz;
</script>

</body>
</html>
