<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT Reading Practice - Set 5</title>
<style>
    /* General Styles */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        position: relative;
    }
    h1 {
        text-align: center;
        color: #1a5276;
    }
    
    .print-blank-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        background-color: #7f8c8d;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 4px;
        color: white;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
    }
    .print-blank-btn:hover {
        background-color: #616a6b;
    }

    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #f9f9f9;
        padding: 15px;
        border-left: 4px solid #1a5276;
        margin-bottom: 20px;
        font-size: 1.05em;
    }
    .prompt {
        font-weight: bold;
        margin-bottom: 15px;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 10px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #f0f3f4;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #d5dbdb;
    }
    .options label:hover {
        background: #e5e8e8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }
    .options input {
        margin-right: 15px;
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 4px;
        display: none;
        border-left: 4px solid;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #1e8449;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #c0392b;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #eee;
        padding-top: 20px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #1a5276;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #154360; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    .check-btn { background-color: #d35400; }
    .check-btn:hover { background-color: #a04000; }
    .check-btn:disabled { background-color: #e59866; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #1e8449; }
    
    #results {
        display: none;
        text-align: center;
        padding: 20px;
        background: #eafaf1;
        border: 2px solid #2ecc71;
        border-radius: 8px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        color: #7f8c8d;
    }

    #print-blank-container {
        display: none;
    }

    /* Printer Friendly Styles */
    @media print {
        body { background-color: white; padding: 0; }
        
        /* Default Print Behavior (When printing results) */
        #quiz-container { box-shadow: none; max-width: 100%; border: none; padding: 0; }
        .question-block { 
            display: block !important; 
            page-break-inside: avoid; 
            border-bottom: 1px solid #ccc; 
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .nav-buttons, .check-btn, .progress-tracker, button, .print-blank-btn { display: none !important; }
        .options label { border: none; padding: 5px 0; background: transparent; }
        .options input { appearance: auto; } 

        /* Override for Blank Print Mode */
        body.print-blank-mode #quiz-container { display: none !important; }
        body.print-blank-mode #print-blank-container { display: block !important; }
    }

    @media screen and (max-width: 600px) {
        .print-blank-btn {
            position: relative;
            top: 0;
            right: 0;
            display: block;
            margin: 0 auto 20px auto;
        }
    }
</style>
</head>
<body>

<div id="quiz-container">
    <button class="print-blank-btn" onclick="printBlankQuiz()">🖨️ Print Blank Quiz</button>
    <h1>SAT Reading Practice - Set 5</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>Quiz Complete</h2>
        <p id="score-display" style="font-size: 1.5em; font-weight: bold;"></p>
        <p>Review your answers and explanations below.</p>
        <button onclick="window.print()" style="margin-top: 10px;">🖨️ Print Results</button>
    </div>

    <div id="questions-wrapper">
        <!-- Questions injected here -->
    </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit for Review</button>
    </div>
</div>

<div id="print-blank-container"></div>

<script>
    const quizData = [
        {
            passage: "Although the new architectural project was initially dismissed as a garish eyesore, local urban planners eventually lauded its ______ design; the building seamlessly integrated sustainable solar elements with classical aesthetics without disrupting the historical skyline.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["ostentatious", "harmonious", "obsolete", "capricious"],
            correctAnswer: 1,
            explanation: "'Harmonious' means forming a pleasing or consistent whole. The passage describes how the design 'seamlessly integrated' different styles 'without disrupting the historical skyline,' indicating it was harmonious."
        },
        {
            passage: "Mycorrhizal fungi form symbiotic networks with the roots of forest trees, facilitating the exchange of nutrients and water. Traditionally, scientists viewed this relationship as a simple bilateral trade. However, recent isotope-tracking experiments show that these underground networks actually redistribute resources from mature, sun-lit trees to struggling saplings shaded by the canopy, essentially acting as an ecological safety net for the entire forest community.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Mycorrhizal fungi primarily strip nutrients from mature trees, threatening forest health.",
                "Fungal networks serve a broader cooperative function in forests by managing resource distribution among trees.",
                "Saplings would grow much faster if they were entirely separated from fungal networks.",
                "The bilateral trade between fungi and individual tree roots is an inefficient evolutionary quirk."
            ],
            correctAnswer: 1,
            explanation: "The text explains that instead of a simple bilateral trade, the networks redistribute resources from mature trees to struggling saplings, acting as a safety net for the entire forest community. This supports the idea of a broader cooperative function."
        },
        {
            passage: "For centuries, historians believed that the rapid spread of the Black Death across 14th-century Europe was entirely driven by human-to-human contact along trade routes. However, a new climate reconstruction reveals that the pandemic's peaks precisely coincided with periods of uncharacteristically high humidity and rainfall, conditions that cause wild rodent populations—and their flea parasites—to explode. Consequently, ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "the plague would have spread just as rapidly even if all international trade had been completely halted.",
                "environmental factors played a far more critical role in accelerating the pandemic than previously acknowledged.",
                "human merchants deliberately avoided regions experiencing high rainfall and humidity.",
                "the 14th-century pandemic was completely eradicated once European weather patterns dried out."
            ],
            correctAnswer: 1,
            explanation: "The passage shifts focus from purely human trade routes to climate reconstructions showing pandemic peaks matching humidity/rainfall that boosted rodent/flea populations. Thus, environmental factors played a crucial, previously overlooked role."
        },
        {
            passage: "Text 1\nThe integration of generative AI into creative fields will democratize art production. By lowering the technical barrier to entry, individuals without formal training in painting or digital design can finally manifest their complex ideas. This will unleash an unprecedented wave of diverse human expression.\n\nText 2\nGenerative AI tools do not democratize art; they dilute it. By flooding digital spaces with derivative works generated from uncredited intellectual property, these platforms drown out human artisans who spend decades mastering their craft. True art requires intentional human labor and lived experience, elements entirely absent from algorithmic outputs.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to the prediction in Text 1 regarding the 'unprecedented wave of diverse human expression'?",
            options: [
                "By arguing that the resulting outputs lack genuine artistic value and instead undermine authentic human creators.",
                "By agreeing that generative AI will motivate human artists to improve their technical training.",
                "By asserting that individuals without formal training have no desire to express creative ideas.",
                "By suggesting that algorithmic outputs will eventually surpass human art in legal copyright protections."
            ],
            correctAnswer: 0,
            explanation: "Text 2 states that AI tools 'dilute' art, produce 'derivative works,' and lack 'intentional human labor and lived experience.' It directly opposes Text 1's optimism, viewing the wave as a negative dilution that hurts true human artisans."
        },
        {
            passage: "The director's early films were celebrated for their vibrant, kinetic editing and explosive sound design. Her latest feature, by contrast, demonstrates a much more ______ aesthetic, relying on long, silent takes and static camera compositions to evoke an atmosphere of profound stillness.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["flamboyant", "austere", "erratic", "conventional"],
            correctAnswer: 1,
            explanation: "'Austere' means severe or simple and unadorned. Long, silent takes and static camera compositions used to evoke 'profound stillness' match an austere aesthetic, directly contrasting with the early 'vibrant, kinetic' style."
        },
        {
            passage: "To determine the construction timeline of the ancient Peruvian geoglyphs, archaeologists first mapped the lines using high-resolution drone photography. Next, they collected organic charcoal samples trapped beneath the overturned desert stones. Finally, by applying accelerated mass spectrometry radiocarbon dating to the samples, the team definitively proved that the earthworks were created between 200 BCE and 500 CE.",
            prompt: "Which choice best describes the overall structure of the text?",
            options: [
                "It introduces a historical debate, presents conflicting viewpoints, and proposes a compromise.",
                "It describes a chronological sequence of scientific steps taken to establish the age of an archaeological site.",
                "It critiques the use of drone photography in modern architectural excavations.",
                "It poses a theoretical question about ancient cultures and provides an imaginative answer."
            ],
            correctAnswer: 1,
            explanation: "The text uses transitional words like 'first,' 'Next,' and 'Finally' to outline the step-by-step process used by archaeologists to date the geoglyphs. This represents a chronological sequence of scientific steps."
        },
        {
            passage: "Literary critic Evelyn Cho contends that Charlotte Brontë's 'Jane Eyre' uses weather and natural landscapes not merely as background scenery, but as an external manifestation of Jane’s internal psychological rebellion against oppressive societal expectations.",
            prompt: "Which quotation from 'Jane Eyre' best supports Cho's contention?",
            options: [
                "\"The kitchen, the schoolroom, the bed-chamber, all looked cold and dark under the winter sky.\"",
                "\"I resisted all the way: a new thing for me, and a circumstance which greatly strengthened the bad opinions the servants entertained of me.\"",
                "\"The wind roared out of the woods; a fierce wind, which seemed as if it would tear up the very ground beneath me, mirroring the wild tumult rising in my own defiant breast.\"",
                "\"It was a fine, autumn day; the leaves were falling from the trees, and the sun shone brightly.\""
            ],
            correctAnswer: 2,
            explanation: "Cho claims that weather acts as an 'external manifestation of Jane's internal psychological rebellion.' The third option explicitly connects the external landscape ('fierce wind') to her internal emotional state ('mirroring the wild tumult rising in my own defiant breast')."
        },
        {
            passage: "Despite the coral reef being subjected to intense warming events and severe bleaching, its subsequent recovery stunned marine biologists, who had predicted total ecological collapse. The ecosystem proved remarkably ______; within eighteen months, opportunistic macroalgae were replaced by fast-growing staghorn corals, restoring fish populations to pre-bleaching levels.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["fragile", "resilient", "stagnant", "perilous"],
            correctAnswer: 1,
            explanation: "'Resilient' means able to withstand or recover quickly from difficult conditions. The passage notes that the reef recovered surprisingly fast after severe bleaching, demonstrating resilience."
        },
        {
            passage: "Most astrophysicists subscribe to the inflationary Big Bang model, which asserts that the universe expanded exponentially in a fraction of a second after its birth. However, a small cohort of theoretical physicists champions the 'Big Bounce' hypothesis. This alternative framework posits that our current universe did not emerge from a singular point of infinite density, but rather resulted from the collapse of a pre-existing universe that reached a maximum contraction and rebounded. While the Big Bounce avoids certain mathematical infinities, it fails to explain the precise uniformity of the cosmic microwave background radiation.",
            prompt: "Which choice best describes the function of the third sentence ('This alternative... rebounded') in the overall structure of the text?",
            options: [
                "It delivers empirical proof that completely invalidates the inflationary Big Bang model.",
                "It outlines the core mechanism of the non-mainstream cosmological theory introduced in the previous sentence.",
                "It highlights a mathematical error common to both the Big Bang and Big Bounce models.",
                "It explains why the cosmic microwave background radiation is non-uniform."
            ],
            correctAnswer: 1,
            explanation: "The second sentence introduces the 'Big Bounce' hypothesis. The third sentence explains what this alternative framework posits (the collapse and rebound of a pre-existing universe), thus detailing its core mechanism."
        },
        {
            passage: "Sociologists studying urban public transits have long assumed that installing security cameras directly decreases petty crime rates at train stations. However, a comprehensive analysis across fifty metropolitan stations revealed that camera placement had almost no effect on overall crime numbers unless paired with high-intensity overhead lighting. Stations that added cameras but remained dimly lit saw zero reduction in incidents, whereas brightly lit stations experienced a significant drop. This finding strongly implies that ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "security cameras are completely useless assets for urban transit authorities.",
                "criminal behavior is primarily deterred by the visibility of the environment rather than the passive recording of data.",
                "overhead lighting should completely replace human security patrols to maximize safety.",
                "metropolitan stations should discontinue tracking crime statistics altogether."
            ],
            correctAnswer: 1,
            explanation: "The study shows cameras alone do nothing without bright lighting, and lighting + cameras creates a drop. This suggests that the immediate visibility / environmental lighting environment is the critical factor in deterring the behavior, rather than just passive recording."
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        // Build Interactive Web Quiz
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage.replace(/\n/g, '<br>')}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        // Build Hidden "Blank Print" Version
        let printHTML = '<h1 style="text-align: center; color: #1a5276; margin-bottom: 5px;">SAT Reading Practice - Set 5</h1><h3 style="text-align: center; margin-top: 0; margin-bottom: 30px; color: #555;">Blank Copy</h3><hr style="margin-bottom:30px; border: 0; border-top: 1px solid #ccc;">';
        
        quizData.forEach((q, index) => {
            let printOptionsHTML = '';
            q.options.forEach(opt => {
                printOptionsHTML += `
                    <li style="margin-bottom: 12px; display: flex; align-items: baseline;">
                        <div style="display:inline-block; width:14px; height:14px; border:2px solid #555; border-radius:50%; margin-right:12px; position:relative; top: 2px; flex-shrink: 0;"></div>
                        <span>${opt}</span>
                    </li>
                `;
            });
            
            printHTML += `
                <div style="margin-bottom: 45px; page-break-inside: avoid;">
                    <p style="font-weight: bold; font-size: 1.1em; color: #333;">Question ${index + 1}</p>
                    <div style="font-family: Georgia, serif; padding: 15px; background-color: #f9f9f9; border-left: 4px solid #ccc; margin-bottom: 15px;">${q.passage.replace(/\n/g, '<br>')}</div>
                    <p style="font-weight: bold; margin-bottom: 15px;">${q.prompt}</p>
                    <ul style="list-style-type: none; padding: 0;">${printOptionsHTML}</ul>
                </div>
            `;
        });
        document.getElementById('print-blank-container').innerHTML = printHTML;

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please select an answer before checking.";
            feedbackDiv.className = "feedback warning";
            return;
        }

        isLocked[currentQuestion] = true;
        
        const radios = document.getElementsByName(`q${currentQuestion}`);
        radios.forEach(r => r.disabled = true);
        q.options.forEach((_, optIndex) => {
            document.getElementById(`label-${currentQuestion}-${optIndex}`).classList.add('disabled');
        });

        updateNav();

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct!</strong><br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Checked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                const radios = document.getElementsByName(`q${index}`);
                radios.forEach(r => r.disabled = true);
                feedbackDiv.innerHTML = `<strong>Unanswered / Not Checked.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        document.querySelector('.print-blank-btn').style.display = 'none'; 
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `You scored ${score} out of ${quizData.length} (${(score/quizData.length)*100}%)`;
        
        window.scrollTo(0, 0);
    }

    function printBlankQuiz() {
        document.body.classList.add('print-blank-mode');
        window.print();
        document.body.classList.remove('print-blank-mode');
    }

    window.onload = initQuiz;
</script>

</body>
</html>
