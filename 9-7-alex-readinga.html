<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT Reading Practice - Set 24</title>
<style>
    /* General Styles */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        position: relative;
    }
    h1 {
        text-align: center;
        color: #1a5276;
    }
    
    .print-blank-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        background-color: #7f8c8d;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 4px;
        color: white;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
    }
    .print-blank-btn:hover {
        background-color: #616a6b;
    }

    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #f9f9f9;
        padding: 15px;
        border-left: 4px solid #1a5276;
        margin-bottom: 20px;
        font-size: 1.05em;
    }
    .prompt {
        font-weight: bold;
        margin-bottom: 15px;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 10px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #f0f3f4;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #d5dbdb;
    }
    .options label:hover {
        background: #e5e8e8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }
    .options input {
        margin-right: 15px;
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 4px;
        display: none;
        border-left: 4px solid;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #1e8449;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #c0392b;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #eee;
        padding-top: 20px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #1a5276;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #154360; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    .check-btn { background-color: #d35400; }
    .check-btn:hover { background-color: #a04000; }
    .check-btn:disabled { background-color: #e59866; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #1e8449; }
    
    #results {
        display: none;
        text-align: center;
        padding: 20px;
        background: #eafaf1;
        border: 2px solid #2ecc71;
        border-radius: 8px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        color: #7f8c8d;
    }

    #harvard-reward {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #fff;
        border: 3px double #a51c30;
        border-radius: 8px;
        animation: pullUp 0.5s ease-out;
    }
    #harvard-reward img {
        width: 160px;
        height: auto;
        margin: 15px auto;
        display: block;
    }
    .harvard-text {
        color: #a51c30;
        font-family: Georgia, serif;
        font-size: 1.4em;
        font-weight: bold;
        letter-spacing: 1px;
    }

    #print-blank-container {
        display: none;
    }

    @keyframes pullUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* Printer Friendly Styles */
    @media print {
        body { background-color: white; padding: 0; }
        
        #quiz-container { box-shadow: none; max-width: 100%; border: none; padding: 0; }
        .question-block { 
            display: block !important; 
            page-break-inside: avoid; 
            border-bottom: 1px solid #ccc; 
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .nav-buttons, .check-btn, .progress-tracker, button, .print-blank-btn { display: none !important; }
        .options label { border: none; padding: 5px 0; background: transparent; }
        .options input { appearance: auto; } 

        #harvard-reward {
            display: block !important;
            border: 2px solid #a51c30 !important;
        }

        /* Override for Blank Print Mode */
        body.print-blank-mode #quiz-container { display: none !important; }
        body.print-blank-mode #print-blank-container { display: block !important; }
    }

    @media screen and (max-width: 600px) {
        .print-blank-btn {
            position: relative;
            top: 0;
            right: 0;
            display: block;
            margin: 0 auto 20px auto;
        }
    }
</style>
</head>
<body>

<div id="quiz-container">
    <button class="print-blank-btn" onclick="printBlankQuiz()">🖨️ Print Blank Quiz</button>
    <h1>SAT Reading Practice - Set 24</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>Quiz Complete</h2>
        <p id="score-display" style="font-size: 1.5em; font-weight: bold;"></p>
        <p>Review your answers and explanations below.</p>
        
        <div id="harvard-reward">
            <div class="harvard-text">★ FLAWLESS ACADEMIC EXCELLENCE ★</div>
            <img src="https://mr-chen-k12.github.io/math/IMG_0232.png" alt="Harvard University Crest">
            <p style="color: #555; font-style: italic; font-weight: bold; margin-top: 5px;">You have successfully earned the Harvard University verification crest for achieving a perfect 10/10 score.</p>
        </div>

        <button onclick="window.print()" style="margin-top: 15px;">🖨️ Print Results</button>
    </div>

    <div id="questions-wrapper">
        <!-- Questions injected here -->
    </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit for Review</button>
    </div>
</div>

<div id="print-blank-container"></div>

<script>
    const quizData = [
        {
            passage: "Despite the author’s initial assertion that her conclusions were definitive, several prominent historians noted that her analysis was based on _______ data, relying on fragmented records and unverified hearsay rather than verified archival documentation.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["unassailable", "scanty", "redundant", "exhaustive"],
            correctAnswer: 1, // Index 1 = B
            explanation: "'Scanty' means small or insufficient in quantity or amount. The passage states that her analysis relied on 'fragmented records and unverified hearsay rather than verified archival documentation,' contrasting her claim of 'definitive' conclusions with the incomplete nature of her data."
        },
        {
            passage: "For decades, palaeontologists hypothesized that the extinction of late-Cretaceous ammonites was solely caused by a rapid decrease in sea surface temperatures. However, a recent geochemical analysis of fossilized shells across multiple ocean basins revealed that oceanic acidification—triggered by massive volcanic eruptions—was the primary driver. The study demonstrated that surface temperature fluctuations were relatively minor compared to the severe drop in seawater pH, which prevented shell formation in juvenile organisms.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "New evidence indicates that oceanic acidification, rather than temperature drop, was the primary cause of ammonite extinction.",
                "Late-Cretaceous ammonites were able to adapt to fluctuating seawater pH levels by thickening their shells.",
                "Volcanic eruptions had no measurable impact on late-Cretaceous ocean chemistry.",
                "Palaeontologists have abandoned geochemical analysis in favor of satellite imaging."
            ],
            correctAnswer: 0, // Index 0 = A
            explanation: "The passage sets up a contrast between an old hypothesis (ocean cooling caused ammonite extinction) and new geochemical evidence showing that oceanic acidification from volcanic activity was the actual primary driver. Option A accurately summarizes this main idea."
        },
        {
            passage: "Literary critic Dr. Aris Thorne argues that in his early gothic novels, Charles Brockden Brown uses disorienting interior architecture—such as labyrinthine hallways and hidden doors—not merely as atmospheric window dressing, but to represent his protagonists' psychological instability and moral confusion.",
            prompt: "Which quotation from a critical analysis of Brown's work best supports Dr. Thorne's argument?",
            options: [
                "\"Brown's personal journals reveal that he derived inspiration for his architectural settings from European castles he visited in his youth.\"",
                "\"Critics during Brown's lifetime praised his ability to craft realistic dialogue among upper-class American characters.\"",
                "\"In *Wieland*, the protagonist's descent into madness is visually framed by her wandering through an endlessly winding, windowless corridor that leads back to her own locked room.\"",
                "\"Early gothic fiction relied heavily on supernatural phenomena such as ghosts and curses to generate suspense.\""
            ],
            correctAnswer: 2, // Index 2 = C
            explanation: "Dr. Thorne asserts that Brown uses maze-like architectural spaces to reflect internal psychological instability. Option C directly supports this by showing how a protagonist's madness is visually mirrored by her wandering through an endless, disorienting corridor."
        },
        {
            passage: "In cognitive science, the concept of cognitive load theory suggests that human working memory has a limited capacity for processing new information simultaneously. When instructional materials present redundant visual and auditory information at the same time, the brain becomes overwhelmed trying to cross-reference the dual streams, reducing overall comprehension. Conversely, when complex concepts are broken into sequential, non-overlapping segments, working memory retains significantly more detail. Therefore, educators seeking to maximize student retention of multi-step procedures should likely ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "present all visual diagrams and spoken explanations simultaneously at maximum volume.",
                "avoid presenting redundant, overlapping visual and audio information simultaneously during instruction.",
                "eliminate all visual aids entirely and rely solely on written textbooks.",
                "increase the speed at which complex material is presented to reduce study time."
            ],
            correctAnswer: 1, // Index 1 = B
            explanation: "The passage explains that presenting redundant visual and audio information simultaneously overwhelms working memory and lowers comprehension. Therefore, educators looking to maximize retention should avoid presenting redundant visual and audio inputs at the same time."
        },
        {
            passage: "Although the committee chairman publicly praised the proposed urban renewal project for its potential to revitalize downtown commerce, his private journal entries revealed that he was deeply _______ about its long-term financial viability.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["sanguine", "dogmatic", "skeptical", "euphoric"],
            correctAnswer: 2, // Index 2 = C
            explanation: "'Skeptical' means inclined to doubt or hesitate. The sentence relies on a contrast ('Although') between his public praise for the project and his private journal entries, which expressed doubts regarding its financial viability."
        },
        {
            passage: "In plant biology, dynamic photoinhibition refers to a physiological mechanism by which plants temporarily suppress photosynthetic activity when exposed to excessive light levels. While photosynthesis converts light into chemical energy, sunlight in excess of a plant's processing capacity damages delicate cellular machinery. By dissipating surplus photon energy as harmless heat, photoinhibition prevents severe oxidative damage to chloroplasts during peak midday sun, allowing normal metabolic activity to resume once light intensity wanes.",
            prompt: "Which choice best describes the overall structure of the text?",
            options: [
                "It defines a physiological process, explains the potential danger it mitigates, and details its protective mechanism.",
                "It compares two agricultural techniques, criticizes commercial farming methods, and demands policy reform.",
                "It details the historical discovery of chloroplasts, lists several key scientists, and outlines future research goals.",
                "It describes a genetic mutation in crop plants, highlights its negative effects, and proposes a gene-editing solution."
            ],
            correctAnswer: 0, // Index 0 = A
            explanation: "The text defines 'dynamic photoinhibition', explains the potential danger (excess light damaging cellular machinery), and describes how the process protects the plant (dissipating surplus energy as heat). Option A accurately reflects this structural flow."
        },
        {
            passage: "Text 1\nThe adoption of agroforestry—integrating trees and shrubs into crop fields—offers an ideal path toward sustainable farming. Tree roots stabilize topsoil against erosion, while leaf litter naturally enriches soil nitrogen, reducing the need for synthetic chemical fertilizers.\n\nText 2\nWhile agroforestry offers ecological benefits, its widespread implementation poses severe challenges for mechanized agriculture. Dense tree rows obstruct large industrial harvesters and reduce total acreage available for high-yield staple crops like corn and wheat, making it financially unviable for large-scale commercial farms.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to the claim in Text 1 that agroforestry is 'an ideal path toward sustainable farming'?",
            options: [
                "By arguing that trees absorb too much oxygen from the surrounding atmosphere.",
                "By claiming that leaf litter contains toxic compounds that kill staple crops.",
                "By suggesting that small-scale gardens should replace all commercial agriculture.",
                "By pointing out that agroforestry creates practical and financial obstacles for large-scale, mechanized farming."
            ],
            correctAnswer: 3, // Index 3 = D
            explanation: "Text 1 highlights agroforestry as ideal and sustainable. Text 2 points out that agroforestry creates major obstacles for mechanized harvesters and reduces farmland for staple crops, making it financially difficult for large commercial farms. Option D captures Text 2's counterargument."
        },
        {
            passage: "Far from being a _______ endeavor, scientific discovery relies heavily on collaborative peer review, shared data repositories, and open replication trials across international research institutions.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["collaborative", "solitary", "rigorous", "methodical"],
            correctAnswer: 1, // Index 1 = B
            explanation: "'Solitary' means done or existing alone. The phrase 'Far from being a [solitary] endeavor' sets up the contrast with the rest of the sentence, which stresses that science relies on collaboration, shared repositories, and open peer review."
        },
        {
            passage: "In behavioral economics, 'loss aversion' describes the tendency for people to feel the pain of a loss far more intensely than the pleasure of an equivalent gain. To test this phenomenon in real-world transactions, researchers tracked individual trading behavior across several stock exchanges. **They found that investors were twice as likely to hold onto declining stocks in hopes of breaking even than to sell winning stocks, choosing to risk further losses rather than realize an immediate emotional pain.** This behavioral pattern explains why financial markets often display irrational holding patterns during economic downturns.",
            prompt: "Which choice best describes the function of the highlighted sentence in the overall structure of the text?",
            options: [
                "It challenges the fundamental premise of loss aversion theory.",
                "It provides historical context for the founding of stock exchanges.",
                "It presents specific empirical findings from the study that demonstrate loss aversion in investor decision-making.",
                "It outlines a new regulatory framework proposed by economists to prevent stock crashes."
            ],
            correctAnswer: 2, // Index 2 = C
            explanation: "The passage introduces the theory of loss aversion and mentions a study of stock traders. The bolded sentence gives the specific empirical results of that study (investors holding losing stocks twice as long as winning ones), supporting the overall concept. Option C correctly describes this function."
        },
        {
            passage: "Planetary scientists analyzing radar imaging data from Venus have identified localized areas of fresh basaltic lava flows with minimal impact cratering. On planetary bodies, impact cratering occurs at a relatively uniform statistical rate over billions of years; therefore, surfaces with very few craters are geologically young, while heavily cratered regions are ancient. Because these low-crater lava fields indicate recent surface reshaping, scientists infer that Venus ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "has maintained a completely frozen, geologically inactive core throughout its history.",
                "was impacted by a massive asteroid that wiped out all impact craters simultaneously.",
                "is composed entirely of water ice hidden beneath a thin layer of volcanic ash.",
                "has experienced relatively recent volcanic activity and remains geologically active."
            ],
            correctAnswer: 3, // Index 3 = D
            explanation: "The text explains that surfaces with few impact craters are geologically young. Since scientists discovered fresh lava flows with minimal cratering on Venus, they can infer that the planet has experienced recent volcanic activity and is geologically active, matching Option D."
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        // Build Interactive Web Quiz
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage.replace(/\n/g, '<br>')}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        // Build Hidden "Blank Print" Version
        let printHTML = '<h1 style="text-align: center; color: #1a5276; margin-bottom: 5px;">SAT Reading Practice - Set 24</h1><h3 style="text-align: center; margin-top: 0; margin-bottom: 30px; color: #555;">Blank Copy</h3><hr style="margin-bottom:30px; border: 0; border-top: 1px solid #ccc;">';
        
        quizData.forEach((q, index) => {
            let printOptionsHTML = '';
            q.options.forEach(opt => {
                printOptionsHTML += `
                    <li style="margin-bottom: 12px; display: flex; align-items: baseline;">
                        <div style="display:inline-block; width:14px; height:14px; border:2px solid #555; border-radius:50%; margin-right:12px; position:relative; top: 2px; flex-shrink: 0;"></div>
                        <span>${opt}</span>
                    </li>
                `;
            });
            
            printHTML += `
                <div style="margin-bottom: 45px; page-break-inside: avoid;">
                    <p style="font-weight: bold; font-size: 1.1em; color: #333;">Question ${index + 1}</p>
                    <div style="font-family: Georgia, serif; padding: 15px; background-color: #f9f9f9; border-left: 4px solid #ccc; margin-bottom: 15px;">${q.passage.replace(/\n/g, '<br>')}</div>
                    <p style="font-weight: bold; margin-bottom: 15px;">${q.prompt}</p>
                    <ul style="list-style-type: none; padding: 0;">${printOptionsHTML}</ul>
                </div>
            `;
        });
        document.getElementById('print-blank-container').innerHTML = printHTML;

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please select an answer before checking.";
            feedbackDiv.className = "feedback warning";
            return;
        }

        isLocked[currentQuestion] = true;
        
        const radios = document.getElementsByName(`q${currentQuestion}`);
        radios.forEach(r => r.disabled = true);
        q.options.forEach((_, optIndex) => {
            document.getElementById(`label-${currentQuestion}-${optIndex}`).classList.add('disabled');
        });

        updateNav();

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct!</strong><br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Checked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                const radios = document.getElementsByName(`q${index}`);
                radios.forEach(r => r.disabled = true);
                feedbackDiv.innerHTML = `<strong>Unanswered / Not Checked.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        document.querySelector('.print-blank-btn').style.display = 'none'; 
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `You scored ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)`;
        
        if (score === quizData.length) {
            document.getElementById('harvard-reward').style.display = 'block';
        }
        
        window.scrollTo(0, 0);
    }

    function printBlankQuiz() {
        document.body.classList.add('print-blank-mode');
        window.print();
        document.body.classList.remove('print-blank-mode');
    }

    window.onload = initQuiz;
</script>

</body>
</html>
