<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT Reading Practice - Set 9-14a</title>
<style>
    /* General Styles */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        position: relative;
    }
    h1 {
        text-align: center;
        color: #1a5276;
    }
    
    .print-blank-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        background-color: #7f8c8d;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 4px;
        color: white;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
    }
    .print-blank-btn:hover {
        background-color: #616a6b;
    }

    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #f9f9f9;
        padding: 15px;
        border-left: 4px solid #1a5276;
        margin-bottom: 20px;
        font-size: 1.05em;
    }
    .prompt {
        font-weight: bold;
        margin-bottom: 15px;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 10px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #f0f3f4;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #d5dbdb;
    }
    .options label:hover {
        background: #e5e8e8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }
    .options input {
        margin-right: 15px;
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 4px;
        display: none;
        border-left: 4px solid;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #1e8449;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #c0392b;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #eee;
        padding-top: 20px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #1a5276;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #154360; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    .check-btn { background-color: #d35400; }
    .check-btn:hover { background-color: #a04000; }
    .check-btn:disabled { background-color: #e59866; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #1e8449; }
    
    #results {
        display: none;
        text-align: center;
        padding: 20px;
        background: #eafaf1;
        border: 2px solid #2ecc71;
        border-radius: 8px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        color: #7f8c8d;
    }

    #univ-reward {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #fff;
        border: 3px double #a51c30;
        border-radius: 8px;
        animation: pullUp 0.5s ease-out;
    }
    #univ-reward img {
        width: 160px;
        height: auto;
        margin: 15px auto;
        display: block;
    }
    .univ-text {
        font-family: Georgia, serif;
        font-size: 1.4em;
        font-weight: bold;
        letter-spacing: 1px;
    }

    #print-blank-container {
        display: none;
    }

    @keyframes pullUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* Printer Friendly Styles */
    @media print {
        body { background-color: white; padding: 0; }
        
        #quiz-container { box-shadow: none; max-width: 100%; border: none; padding: 0; }
        .question-block { 
            display: block !important; 
            page-break-inside: avoid; 
            border-bottom: 1px solid #ccc; 
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .nav-buttons, .check-btn, .progress-tracker, button, .print-blank-btn { display: none !important; }
        .options label { border: none; padding: 5px 0; background: transparent; }
        .options input { appearance: auto; } 

        #univ-reward {
            display: block !important;
            border-style: solid !important;
            border-width: 2px !important;
        }

        /* Override for Blank Print Mode */
        body.print-blank-mode #quiz-container { display: none !important; }
        body.print-blank-mode #print-blank-container { display: block !important; }
    }

    @media screen and (max-width: 600px) {
        .print-blank-btn {
            position: relative;
            top: 0;
            right: 0;
            display: block;
            margin: 0 auto 20px auto;
        }
    }
</style>
</head>
<body>

<div id="quiz-container">
    <button class="print-blank-btn" onclick="printBlankQuiz()">🖨️ Print Blank Quiz</button>
    <h1>SAT Reading Practice - Set 9-14a</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>Quiz Complete</h2>
        <p id="score-display" style="font-size: 1.5em; font-weight: bold;"></p>
        <p>Review your answers and explanations below.</p>
        
        <div id="univ-reward">
            <div class="univ-text" id="univ-reward-title">★ FLAWLESS ACADEMIC EXCELLENCE ★</div>
            <img id="univ-reward-img" src="" alt="University Crest">
            <p id="univ-reward-text" style="color: #555; font-style: italic; font-weight: bold; margin-top: 5px;"></p>
        </div>

        <button onclick="window.print()" style="margin-top: 15px;">🖨️ Print Results</button>
    </div>

    <div id="questions-wrapper">
        <!-- Questions injected here -->
    </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit for Review</button>
    </div>
</div>

<div id="print-blank-container"></div>

<script>
    const universityRewards = [
        {
            name: "Harvard University",
            img: "https://mr-chen-k12.github.io/math/IMG_0232.png",
            color: "#a51c30"
        },
        {
            name: "Boston University",
            img: "https://mr-chen-k12.github.io/books/IMG_0121.png",
            color: "#CC0000"
        },
        {
            name: "Yale University",
            img: "https://mr-chen-k12.github.io/books/IMG_0122.png",
            color: "#00356B"
        }
    ];

    const quizData = [
        {
            passage: "Although early reviewers characterized the novelist's prose style as austere and unvarnished, contemporary scholars appreciate its subtle complexity, noting how her sparse word choice creates remarkably _______ imagery that lingers long after reading.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["evocative", "pedestrian", "monotonous", "superfluous"],
            correctAnswer: 0, // A
            explanation: "'Evocative' means bringing strong images, memories, or feelings to mind. The text contrasts early views of the style being 'austere' with modern appreciation for imagery that 'lingers long after reading'."
        },
        {
            passage: "Mycorrhizal networks consist of underground fungal hyphae that connect the root systems of neighboring plants. Studies demonstrate that mature trees utilize these fungal pathways to transfer carbon, nitrogen, and protective chemical signals to younger seedlings shaded by the forest canopy. When mature trees are threatened by pest infestations, they broadcast warning signals through the network, prompting neighboring flora to preemptively produce defensive compounds. Thus, these subterranean fungal links play an essential role in forest ecosystem resilience and communication.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Shaded seedlings rely exclusively on solar radiation to produce defensive chemical compounds against pests.",
                "Subterranean mycorrhizal networks facilitate resource distribution and warning signals among forest plants, strengthening ecosystem resilience.",
                "Pest infestations are primarily caused by fungal hyphae attacking mature tree root systems.",
                "Forest canopy height determines the speed at which nitrogen moves through subterranean soil environments."
            ],
            correctAnswer: 1, // B
            explanation: "The passage describes how mycorrhizal networks transport nutrients and warning signals between plants, concluding that they are essential for forest ecosystem resilience and communication."
        },
        {
            passage: "Urban centers often experience the 'heat island' effect, where dense concentrations of asphalt and concrete absorb and re-emit solar heat, raising localized temperatures compared to surrounding rural areas. Environmental engineers tested cool roof coatings—materials designed to reflect sunlight and emit absorbed heat—across several downtown commercial buildings. During summer heatwaves, surface temperatures on treated roofs dropped by up to 40°F, significantly decreasing indoor cooling demands. This outcome suggests that widespread implementation of cool roof technology in dense urban zones _______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "could substantially mitigate urban heat island effects and lower energy requirements.",
                "will force commercial building owners to abandon traditional HVAC maintenance entirely.",
                "increases asphalt heat absorption during winter weather events.",
                "eliminates the need for municipal water conservation during summer droughts."
            ],
            correctAnswer: 0, // A
            explanation: "Because cool roofs dropped surface temperatures by 40°F and decreased cooling demand, implementing them broadly can logically mitigate the urban heat island effect and lower energy use."
        },
        {
            passage: "Geologists studying plate tectonics long debated the precise mechanisms driving continental drift along oceanic ridges. <b>Specifically, Dr. Albright analyzed magnetic anomaly patterns recorded in basaltic crust along the Mid-Atlantic Ridge to quantify historical rates of seafloor spreading.</b> Her precise magnetic mapping provided concrete empirical confirmation for ridge-push mechanics.",
            prompt: "Which choice best describes the function of the highlighted sentence in the overall structure of the text?",
            options: [
                "It describes the specific empirical research method Dr. Albright used to quantify seafloor spreading and support theoretical mechanics.",
                "It outlines a new theoretical debate regarding the composition of basaltic continental crust.",
                "It criticizes previous geological surveys for neglecting magnetic anomaly patterns in freshwater lakes.",
                "It summarizes international treaties governing seabed mineral exploration along oceanic ridges."
            ],
            correctAnswer: 0, // A
            explanation: "The highlighted sentence details the specific method (analyzing magnetic anomaly patterns) Dr. Albright employed to measure seafloor spreading, providing evidence to support the plate tectonics theory."
        },
        {
            passage: "Text 1\nRemote work arrangements offer profound advantages for modern organizations. By eliminating long daily commutes, remote models improve employee well-being and productivity while allowing companies to recruit talent from a global pool unconstrained by geographic boundaries.\n\nText 2\nWhile remote work provides personal flexibility, it frequently impairs spontaneous interdepartmental collaboration and mentorship. Casual workplace encounters foster creative innovation that planned video conferences rarely replicate, risking long-term organizational stagnation if fully remote models replace physical offices entirely.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to Text 1's perspective on remote work?",
            options: [
                "By arguing that Text 1 overlooks how the absence of physical office interaction can hinder spontaneous collaboration and innovation.",
                "By claiming that daily commutes are necessary for developing advanced technological skills.",
                "By asserting that recruiting global talent inevitably reduces employee productivity.",
                "By agreeing that video conferences fully replace all informal workplace interactions."
            ],
            correctAnswer: 0, // A
            explanation: "Text 2 emphasizes that remote work hinders spontaneous collaboration and informal innovation, directly addressing what Text 1 overlooks in its praise of remote work."
        },
        {
            passage: "Literary historian Dr. Arthur Vance contends that medieval European monastic scriptoria played a pivotal role in preserving classical philosophical texts that would otherwise have been lost to history.",
            prompt: "Which quotation from a historical archive best supports Dr. Vance's claim?",
            options: [
                "\"Ninth-century monastic inventory logs record meticulous hand-copied manuscripts of ancient Greek philosophy that existed nowhere else in Europe at the time.\"",
                "\"Monastic gardens in northern Italy cultivated medicinal herbs to treat local village populations during disease outbreaks.\"",
                "\"Medieval scribes utilized parchment crafted from calfskin rather than imported papyrus paper.\"",
                "\"Architectural plans reveal that 12th-century monasteries featured central courtyards enclosed by vaulted stone cloister arches.\""
            ],
            correctAnswer: 0, // A
            explanation: "Option A provides direct evidence of monastic scriptoria preserving unique manuscripts of ancient Greek philosophy that existed nowhere else, supporting Dr. Vance's claim."
        },
        {
            passage: "Although the chemical reaction was initially believed to occur _______ under room-temperature conditions, careful laboratory experiments revealed that it required a specific metallic catalyst to initiate.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["spontaneously", "sluggishly", "reluctantly", "partially"],
            correctAnswer: 0, // A
            explanation: "'Spontaneously' means occurring without external stimulus or catalyst. The contrast is between the initial belief that it happened on its own ('spontaneously') and the finding that it required a catalyst."
        },
        {
            passage: "Paleontologists examining fossilized skeletal structures of avian dinosaurs from high-latitude Cretaceous sites discovered dense vascular networks within bone cross-sections. In modern vertebrates, high vascular density correlates directly with rapid metabolic rates and endothermy (warm-bloodedness), which allows animals to maintain stable internal body temperatures in cold climates. Because these polar avian dinosaurs inhabited environments with freezing winter temperatures, researchers concluded that their bone structure provided necessary thermoregulation. This evidence implies that these dinosaurs _______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "possessed endothermic metabolisms that enabled survival in cold polar climates.",
                "relied exclusively on solar heat absorption to maintain body temperature during winter.",
                "were unable to survive at latitudes higher than the equator.",
                "exhibited bone density characteristics identical to modern cold-blooded reptiles."
            ],
            correctAnswer: 0, // A
            explanation: "High vascular density linked to endothermy in freezing climates logically supports the conclusion that these polar dinosaurs possessed endothermic metabolisms for thermoregulation."
        },
        {
            passage: "Tidal energy power plants capture kinetic energy from ocean currents during high and low tide cycles. Unlike solar or wind power, which fluctuate unpredictable according to weather patterns, tidal cycles are governed by gravitational interactions between Earth, the Moon, and the Sun, making energy generation completely predictable centuries in advance. Consequently, incorporating tidal power into regional electrical grids provides a uniquely reliable baseline of renewable energy that simplifies power grid management.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Tidal power generation depends on atmospheric pressure and surface weather patterns.",
                "The gravitational pull of the Sun is the sole factor influencing ocean currents.",
                "Tidal energy is highly predictable and reliable compared to other renewables, making it a valuable contributor to grid stability.",
                "Wind energy is more cost-effective and predictable than tidal power plants in coastal regions."
            ],
            correctAnswer: 2, // C
            explanation: "The passage contrasts predictable tidal power with variable solar/wind power, highlighting tidal energy's reliability for grid stability."
        },
        {
            passage: "The chief negotiator was widely commended for her _______ approach during treaty deliberations; rather than insisting on rigid ideology, she focused on practical, mutually beneficial compromises.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["pragmatic", "dogmatic", "capricious", "intransigent"],
            correctAnswer: 0, // A
            explanation: "'Pragmatic' means dealing with things sensibly and realistically in a way based on practical considerations. Focusing on practical compromises rather than rigid ideology describes a pragmatic approach."
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        // Build Interactive Web Quiz
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        // Build Hidden "Blank Print" Version
        let printHTML = '<h1 style="text-align: center; color: #1a5276; margin-bottom: 5px;">SAT Reading Practice - Set 9-14a</h1><h3 style="text-align: center; margin-top: 0; margin-bottom: 30px; color: #555;">Blank Copy</h3><hr style="margin-bottom:30px; border: 0; border-top: 1px solid #ccc;">';
        
        quizData.forEach((q, index) => {
            let printOptionsHTML = '';
            q.options.forEach(opt => {
                printOptionsHTML += `
                    <li style="margin-bottom: 12px; display: flex; align-items: baseline;">
                        <div style="display:inline-block; width:14px; height:14px; border:2px solid #555; border-radius:50%; margin-right:12px; position:relative; top: 2px; flex-shrink: 0;"></div>
                        <span>${opt}</span>
                    </li>
                `;
            });
            
            printHTML += `
                <div style="margin-bottom: 45px; page-break-inside: avoid;">
                    <p style="font-weight: bold; font-size: 1.1em; color: #333;">Question ${index + 1}</p>
                    <div style="font-family: Georgia, serif; padding: 15px; background-color: #f9f9f9; border-left: 4px solid #ccc; margin-bottom: 15px;">${q.passage}</div>
                    <p style="font-weight: bold; margin-bottom: 15px;">${q.prompt}</p>
                    <ul style="list-style-type: none; padding: 0;">${printOptionsHTML}</ul>
                </div>
            `;
        });
        document.getElementById('print-blank-container').innerHTML = printHTML;

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please select an answer before checking.";
            feedbackDiv.className = "feedback warning";
            return;
        }

        isLocked[currentQuestion] = true;
        
        const radios = document.getElementsByName(`q${currentQuestion}`);
        radios.forEach(r => r.disabled = true);
        q.options.forEach((_, optIndex) => {
            document.getElementById(`label-${currentQuestion}-${optIndex}`).classList.add('disabled');
        });

        updateNav();

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct!</strong><br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Checked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                const radios = document.getElementsByName(`q${index}`);
                radios.forEach(r => r.disabled = true);
                feedbackDiv.innerHTML = `<strong>Unanswered / Not Checked.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        document.querySelector('.print-blank-btn').style.display = 'none'; 
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `You scored ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)`;
        
        // Pick a random university crest reward on a perfect score (10/10)
        if (score === quizData.length) {
            const reward = universityRewards[Math.floor(Math.random() * universityRewards.length)];
            const rewardDiv = document.getElementById('univ-reward');
            const rewardTitle = document.getElementById('univ-reward-title');
            const rewardImg = document.getElementById('univ-reward-img');
            const rewardText = document.getElementById('univ-reward-text');
            
            rewardDiv.style.borderColor = reward.color;
            rewardTitle.style.color = reward.color;
            rewardImg.src = reward.img;
            rewardImg.alt = reward.name + " Crest";
            rewardText.textContent = `You have successfully earned the ${reward.name} verification crest for achieving a perfect 10/10 score.`;
            
            rewardDiv.style.display = 'block';
        }
        
        window.scrollTo(0, 0);
    }

    function printBlankQuiz() {
        document.body.classList.add('print-blank-mode');
        window.print();
        document.body.classList.remove('print-blank-mode');
    }

    window.onload = initQuiz;
</script>

</body>
</html>
