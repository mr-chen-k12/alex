<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Concept Review: Set 2</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
    /* Clean, naked theme */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #ffffff;
        color: #333333;
        margin: 0;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    #app {
        width: 100%;
        max-width: 700px;
        position: relative;
    }
    
    /* Scoreboard */
    .scoreboard {
        margin-bottom: 40px;
        padding: 20px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        background-color: #fafafa;
    }
    .scoreboard h2 { margin-top: 0; text-align: center; font-size: 1.2rem; color: #555; }
    
    .progress-track {
        height: 8px;
        background: #e0e0e0;
        border-radius: 4px;
        margin: 40px 0 10px 0;
        position: relative;
    }
    
    #marker {
        position: absolute;
        top: -25px;
        left: 0%; /* Starts at 0 */
        transform: translateX(-50%);
        transition: left 0.4s ease-out;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .triangle-down {
        width: 0; 
        height: 0; 
        border-left: 12px solid transparent;
        border-right: 12px solid transparent;
        border-top: 16px solid #ff4757;
    }
    
    .status-labels {
        display: flex;
        justify-content: space-between;
        font-weight: bold;
        color: #888;
        font-size: 0.9rem;
    }

    /* Quiz Area */
    .question-box {
        font-size: 1.3rem;
        margin-bottom: 25px;
        line-height: 1.5;
    }
    .options-box {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .option {
        padding: 15px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 1.1rem;
        background: #fff;
    }
    .option:hover { background-color: #f1f2f6; border-color: #a4b0be; }
    .option input { display: none; }
    
    .btn {
        margin-top: 30px;
        padding: 12px 24px;
        font-size: 1.1rem;
        font-weight: bold;
        color: white;
        background-color: #2ed573;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.2s;
        width: 100%;
    }
    .btn:hover { background-color: #26b360; }
    .btn:disabled { background-color: #ccc; cursor: not-allowed; }

    /* Bottom Right Tracker */
    .bottom-right-tracker {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: white;
        padding: 15px 20px;
        border: 2px solid #ff4757;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        font-weight: bold;
        font-size: 1rem;
        color: #ff4757;
    }

    /* Review Area */
    #review-area { display: none; margin-top: 40px; }
    .review-item {
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 8px;
        border-left: 5px solid;
        background: #fafafa;
    }
    .review-item.wrong { border-left-color: #ff4757; }
    .review-item.correct { border-left-color: #2ed573; }
    .review-item p { margin: 5px 0; }
    
</style>
</head>
<body>

<div id="app">
    <div class="scoreboard" id="scoreboard">
        <h2>Progress Tracker</h2>
        <div class="progress-track">
            <div id="marker">
                <div class="triangle-down"></div>
            </div>
        </div>
        <div class="status-labels">
            <span>Trying</span>
            <span>Good Job</span>
            <span>Lits 🔥</span>
        </div>
    </div>

    <div id="quiz-area">
        <div id="progress-text" style="color:#888; font-weight:bold; margin-bottom:10px;">Question 1 of 50</div>
        <div class="question-box" id="question-text">Loading...</div>
        <div class="options-box" id="options-container"></div>
        <button class="btn" id="submit-btn" onclick="submitAnswer()">Submit Answer</button>
    </div>

    <div id="review-area">
        <h2>Complete Review</h2>
        <p>Here is a breakdown of your missing work and the correct solutions.</p>
        <div id="review-list"></div>
        <button class="btn" onclick="location.reload()">Try Again</button>
    </div>
</div>

<div class="bottom-right-tracker" id="missed-tracker">
    Missed (Should have gotten correct): 0
</div>

<script>
// The 50 New Questions
const questions = [
    { q: "What is \\(\\frac{3}{5}\\) of 20?", o: ["15", "12", "9", "10"], a: 1 },
    { q: "If \\(\\frac{2}{3}\\) of 150 students play a sport, how many students do NOT play a sport?", o: ["50", "100", "75", "25"], a: 0 },
    { q: "The ratio of cats to dogs is 3 to 2. If there are 12 cats, how many dogs are there?", o: ["6", "10", "8", "4"], a: 2 },
    { q: "Find the sum: \\(\\frac{1}{4} + \\frac{5}{8}\\)", o: ["\\(\\frac{6}{12}\\)", "\\(\\frac{7}{8}\\)", "\\(\\frac{3}{4}\\)", "\\(1\\frac{1}{8}\\)"], a: 1 },
    { q: "Subtract with regrouping: \\(3\\frac{1}{2} - 1\\frac{3}{4}\\)", o: ["\\(1\\frac{1}{4}\\)", "\\(2\\frac{1}{4}\\)", "\\(1\\frac{3}{4}\\)", "\\(2\\frac{1}{2}\\)"], a: 2 },
    { q: "Multiply: \\(1\\frac{2}{3} \\times 2\\frac{1}{5}\\)", o: ["\\(2\\frac{2}{15}\\)", "\\(3\\frac{2}{3}\\)", "\\(3\\frac{1}{5}\\)", "\\(3\\frac{1}{15}\\)"], a: 1 },
    { q: "Divide: \\(2 \\div 1\\frac{1}{2}\\)", o: ["\\(1\\frac{1}{3}\\)", "\\(3\\)", "\\(1\\frac{1}{2}\\)", "\\(\\frac{3}{4}\\)"], a: 0 },
    { q: "Write 75% as a reduced fraction.", o: ["\\(\\frac{75}{100}\\)", "\\(\\frac{1}{4}\\)", "\\(\\frac{3}{4}\\)", "\\(\\frac{2}{3}\\)"], a: 2 },
    { q: "Add: \\(0.8 + 0.15\\)", o: ["0.23", "0.95", "9.5", "0.815"], a: 1 },
    { q: "Subtract: \\(10 - 3.45\\)", o: ["7.45", "6.55", "7.55", "6.45"], a: 1 },
    { q: "Multiply: \\(0.4 \\times 0.6\\)", o: ["2.4", "0.24", "0.024", "24"], a: 1 },
    { q: "Multiply: \\(8.2 \\times 100\\)", o: ["82", "0.082", "820", "8200"], a: 2 },
    { q: "Divide: \\(45.6 \\div 10\\)", o: ["4.56", "456", "0.456", "45.60"], a: 0 },
    { q: "Divide: \\(36 \\div 0.9\\)", o: ["4", "0.4", "400", "40"], a: 3 },
    { q: "Find the square root: \\(\\sqrt{64}\\)", o: ["6", "8", "32", "4"], a: 1 },
    { q: "Between which two numbers is \\(\\sqrt{40}\\)?", o: ["5 and 6", "6 and 7", "39 and 41", "7 and 8"], a: 1 },
    { q: "Between which two numbers is \\(\\sqrt{80}\\)?", o: ["8 and 9", "9 and 10", "7 and 8", "79 and 81"], a: 0 },
    { q: "Solve for y: \\(6y = 42\\)", o: ["6", "8", "7", "36"], a: 2 },
    { q: "Area of a triangle with base 6 in and height 4 in?", o: ["24 sq in", "10 sq in", "12 sq in", "20 sq in"], a: 2 },
    { q: "Find the circumference of a circle with a radius of 5cm. (Use 3.14 for \\(\\pi\\))", o: ["15.7 cm", "31.4 cm", "78.5 cm", "10 cm"], a: 1 },
    { q: "Find the area of a circle with a radius of 5cm. (Use 3.14 for \\(\\pi\\))", o: ["31.4 sq cm", "15.7 sq cm", "25 sq cm", "78.5 sq cm"], a: 3 },
    { q: "How many edges does a cube have?", o: ["6", "8", "12", "16"], a: 2 },
    { q: "Find the volume of a rectangular prism: Length=10m, Width=4m, Height=5m", o: ["19 m\\(^3\\)", "40 m\\(^3\\)", "200 m\\(^3\\)", "100 m\\(^3\\)"], a: 2 },
    { q: "Which axis is the horizontal axis?", o: ["X-Axis", "Y-Axis", "Z-Axis", "Origin"], a: 0 },
    { q: "What are the coordinates for a point 3 units to the left and 4 units up from the origin?", o: ["(3, -4)", "(4, -3)", "(-3, 4)", "(-4, 3)"], a: 2 },
    { q: "What is \\(\\frac{1}{4}\\) of 36?", o: ["6", "9", "8", "12"], a: 1 },
    { q: "Ratio of red to green apples is 4:5. If there are 20 green apples, how many red apples?", o: ["16", "25", "24", "15"], a: 0 },
    { q: "Add: \\(2\\frac{1}{3} + 1\\frac{1}{6}\\)", o: ["\\(3\\frac{2}{9}\\)", "\\(3\\frac{1}{2}\\)", "\\(4\\frac{1}{6}\\)", "\\(3\\frac{1}{3}\\)"], a: 1 },
    { q: "Subtract: \\(4 - 2\\frac{1}{5}\\)", o: ["\\(1\\frac{4}{5}\\)", "\\(2\\frac{4}{5}\\)", "\\(2\\frac{1}{5}\\)", "\\(1\\frac{1}{5}\\)"], a: 0 },
    { q: "Multiply: \\(3\\frac{1}{3} \\times 1\\frac{1}{5}\\)", o: ["3", "4", "5", "\\(3\\frac{1}{15}\\)"], a: 1 },
    { q: "Divide: \\(5 \\div \\frac{1}{2}\\)", o: ["2.5", "10", "15", "\\(5\\frac{1}{2}\\)"], a: 1 },
    { q: "Write 12% as a decimal.", o: ["1.2", "0.012", "0.12", "12.0"], a: 2 },
    { q: "Add: \\(3.4 + 1.25\\)", o: ["4.65", "4.29", "2.15", "5.65"], a: 0 },
    { q: "Subtract: \\(8.5 - 4.25\\)", o: ["4.75", "4.5", "4.25", "3.25"], a: 2 },
    { q: "Multiply: \\(0.2 \\times 0.2\\)", o: ["0.4", "0.04", "0.004", "4.0"], a: 1 },
    { q: "Divide: \\(125 \\div 100\\)", o: ["0.125", "1.25", "12.5", "12500"], a: 1 },
    { q: "Divide: \\(0.45 \\div 5\\)", o: ["0.09", "0.9", "9", "0.009"], a: 0 },
    { q: "Find the square root: \\(\\sqrt{81}\\)", o: ["8", "9", "18", "40.5"], a: 1 },
    { q: "Between which two numbers is \\(\\sqrt{15}\\)?", o: ["3 and 4", "4 and 5", "14 and 16", "7 and 8"], a: 0 },
    { q: "Solve for x: \\(3x = 27\\)", o: ["6", "8", "9", "24"], a: 2 },
    { q: "Area of a rectangle: base=12, height=5.", o: ["60", "17", "34", "30"], a: 0 },
    { q: "Perimeter of a rectangle: base=12, height=5.", o: ["60", "17", "34", "30"], a: 2 },
    { q: "Diameter is 14. What is the radius?", o: ["28", "7", "3.5", "21"], a: 1 },
    { q: "Volume of a cube with 4mm sides.", o: ["16 mm\\(^3\\)", "64 mm\\(^3\\)", "12 mm\\(^3\\)", "32 mm\\(^3\\)"], a: 1 },
    { q: "The point (0, 5) lies on which axis?", o: ["X-Axis", "Y-Axis", "Neither", "Both"], a: 1 },
    { q: "The point (4, 0) lies on which axis?", o: ["X-Axis", "Y-Axis", "Neither", "Both"], a: 0 },
    { q: "A negative x-coordinate means you move...", o: ["Right", "Up", "Left", "Down"], a: 2 },
    { q: "A positive y-coordinate means you move...", o: ["Right", "Up", "Left", "Down"], a: 1 },
    { q: "What is the rule for dividing fractions?", o: ["Find a common denominator", "Keep-Change-Flip", "Cross-multiply", "Flip both fractions"], a: 1 },
    { q: "What is the first step in adding fractions with different denominators?", o: ["Add the numerators", "Find a common denominator", "Multiply the denominators", "Simplify the fractions"], a: 1 }
];

let currentQuestion = 0;
let missedCount = 0;
let score = 0;
let selectedOption = null;
let userAnswers = []; // Store answers for the review section

const questionText = document.getElementById('question-text');
const optionsContainer = document.getElementById('options-container');
const submitBtn = document.getElementById('submit-btn');
const marker = document.getElementById('marker');
const progressText = document.getElementById('progress-text');
const missedTracker = document.getElementById('missed-tracker');
const quizArea = document.getElementById('quiz-area');
const reviewArea = document.getElementById('review-area');
const reviewList = document.getElementById('review-list');
const scoreboard = document.getElementById('scoreboard');

function loadQuestion() {
    selectedOption = null;
    submitBtn.disabled = true;
    
    const q = questions[currentQuestion];
    progressText.innerText = `Question ${currentQuestion + 1} of 50`;
    questionText.innerHTML = q.q;
    
    optionsContainer.innerHTML = '';
    q.o.forEach((opt, index) => {
        const div = document.createElement('div');
        div.className = 'option';
        div.innerHTML = opt;
        div.onclick = () => selectOption(index, div);
        optionsContainer.appendChild(div);
    });

    // Tell MathJax to re-render the newly injected math symbols
    if (window.MathJax) {
        MathJax.typesetPromise([questionText, optionsContainer]).catch((err) => console.log(err));
    }
}

function selectOption(index, element) {
    selectedOption = index;
    submitBtn.disabled = false;
    
    // Clear styling from all options
    document.querySelectorAll('.option').forEach(el => {
        el.style.backgroundColor = '#fff';
        el.style.borderColor = '#e0e0e0';
    });
    
    // Highlight selected
    element.style.backgroundColor = '#e1f5fe';
    element.style.borderColor = '#03a9f4';
}

function submitAnswer() {
    const q = questions[currentQuestion];
    const isCorrect = (selectedOption === q.a);
    
    userAnswers.push({
        question: q.q,
        userPick: q.o[selectedOption],
        correctPick: q.o[q.a],
        isCorrect: isCorrect
    });

    if (isCorrect) {
        score++;
    } else {
        missedCount++;
        missedTracker.innerText = `Missed (Should have gotten correct): ${missedCount}`;
    }

    // Update Triangle Marker ("Trying" -> "Good Job" -> "Lits")
    const percentComplete = ((currentQuestion + 1) / questions.length) * 100;
    marker.style.left = `${percentComplete}%`;

    currentQuestion++;

    if (currentQuestion < questions.length) {
        loadQuestion();
    } else {
        showReview();
    }
}

function showReview() {
    quizArea.style.display = 'none';
    scoreboard.style.display = 'none';
    reviewArea.style.display = 'block';
    
    reviewList.innerHTML = '';
    
    userAnswers.forEach((ans, i) => {
        if (!ans.isCorrect) {
            const div = document.createElement('div');
            div.className = 'review-item wrong';
            div.innerHTML = `
                <p><strong>Question ${i+1}:</strong> ${ans.question}</p>
                <p style="color:#ff4757;">Your Answer: ${ans.userPick}</p>
                <p style="color:#2ed573;"><strong>Correct Answer: ${ans.correctPick}</strong></p>
            `;
            reviewList.appendChild(div);
        }
    });

    if (missedCount === 0) {
        reviewList.innerHTML = `<div class="review-item correct"><p><strong>Perfect Score! You are LITS! 🔥</strong> No missing work to review.</p></div>`;
    }

    if (window.MathJax) {
        MathJax.typesetPromise([reviewList]).catch((err) => console.log(err));
    }
}

// Initialize first question
loadQuestion();
</script>
</body>
</html>
