<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT Reading Practice - Set 9-9-SATa</title>
<style>
    /* General Styles */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        position: relative;
    }
    h1 {
        text-align: center;
        color: #1a5276;
    }
    
    .print-blank-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        background-color: #7f8c8d;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 4px;
        color: white;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
    }
    .print-blank-btn:hover {
        background-color: #616a6b;
    }

    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #f9f9f9;
        padding: 15px;
        border-left: 4px solid #1a5276;
        margin-bottom: 20px;
        font-size: 1.05em;
    }
    .prompt {
        font-weight: bold;
        margin-bottom: 15px;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 10px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #f0f3f4;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #d5dbdb;
    }
    .options label:hover {
        background: #e5e8e8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }
    .options input {
        margin-right: 15px;
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 4px;
        display: none;
        border-left: 4px solid;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #1e8449;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #c0392b;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #eee;
        padding-top: 20px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #1a5276;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #154360; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    .check-btn { background-color: #d35400; }
    .check-btn:hover { background-color: #a04000; }
    .check-btn:disabled { background-color: #e59866; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #1e8449; }
    
    #results {
        display: none;
        text-align: center;
        padding: 20px;
        background: #eafaf1;
        border: 2px solid #2ecc71;
        border-radius: 8px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        color: #7f8c8d;
    }

    #harvard-reward {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #fff;
        border: 3px double #a51c30;
        border-radius: 8px;
        animation: pullUp 0.5s ease-out;
    }
    #harvard-reward img {
        width: 160px;
        height: auto;
        margin: 15px auto;
        display: block;
    }
    .harvard-text {
        color: #a51c30;
        font-family: Georgia, serif;
        font-size: 1.4em;
        font-weight: bold;
        letter-spacing: 1px;
    }

    #print-blank-container {
        display: none;
    }

    @keyframes pullUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* Printer Friendly Styles */
    @media print {
        body { background-color: white; padding: 0; }
        
        #quiz-container { box-shadow: none; max-width: 100%; border: none; padding: 0; }
        .question-block { 
            display: block !important; 
            page-break-inside: avoid; 
            border-bottom: 1px solid #ccc; 
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .nav-buttons, .check-btn, .progress-tracker, button, .print-blank-btn { display: none !important; }
        .options label { border: none; padding: 5px 0; background: transparent; }
        .options input { appearance: auto; } 

        #harvard-reward {
            display: block !important;
            border: 2px solid #a51c30 !important;
        }

        /* Override for Blank Print Mode */
        body.print-blank-mode #quiz-container { display: none !important; }
        body.print-blank-mode #print-blank-container { display: block !important; }
    }

    @media screen and (max-width: 600px) {
        .print-blank-btn {
            position: relative;
            top: 0;
            right: 0;
            display: block;
            margin: 0 auto 20px auto;
        }
    }
</style>
</head>
<body>

<div id="quiz-container">
    <button class="print-blank-btn" onclick="printBlankQuiz()">🖨️ Print Blank Quiz</button>
    <h1>SAT Reading Practice - Set 9-9-SATa</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>Quiz Complete</h2>
        <p id="score-display" style="font-size: 1.5em; font-weight: bold;"></p>
        <p>Review your answers and explanations below.</p>
        
        <div id="harvard-reward">
            <div class="harvard-text">★ FLAWLESS ACADEMIC EXCELLENCE ★</div>
            <img src="https://mr-chen-k12.github.io/math/IMG_0232.png" alt="Harvard University Crest">
            <p style="color: #555; font-style: italic; font-weight: bold; margin-top: 5px;">You have successfully earned the Harvard University verification crest for achieving a perfect 10/10 score.</p>
        </div>

        <button onclick="window.print()" style="margin-top: 15px;">🖨️ Print Results</button>
    </div>

    <div id="questions-wrapper">
        <!-- Questions injected here -->
    </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit for Review</button>
    </div>
</div>

<div id="print-blank-container"></div>

<script>
    const quizData = [
        {
            passage: "Although the initial press reaction to the diplomat’s treaty proposal was lukewarm, her _______ argument eventually persuaded even the most skeptical members of the international delegation, leading to unanimous ratification.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["cogent", "diffident", "superfluous", "tenuous"],
            correctAnswer: 0, // Index 0 = A
            explanation: "'Cogent' means clear, logical, and convincing. The passage notes that despite initial skepticism, her argument was effective enough to persuade delegates to achieve unanimous ratification, making 'cogent' the logical choice."
        },
        {
            passage: "Studies on avian migration patterns show that light pollution from major coastal cities alters the nocturnal orientation of migratory songbirds. Bright artificial lighting attracts birds off course, causing collisions with glass skyscrapers and exhausting their energy reserves. Researchers deployed low-intensity amber lighting across trial urban corridors and observed a 60% reduction in bird disorientation during autumn migration. This intervention suggests that adjusting municipal lighting spectra provides an effective way to protect migratory bird populations without compromising urban safety.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Avian collisions with glass skyscrapers represent the single leading cause of bird population declines worldwide.",
                "Altering urban lighting conditions, such as adopting low-intensity amber light, can effectively mitigate the hazards cities pose to migratory songbirds.",
                "Songbirds migrate primarily at night to avoid thermal updrafts caused by coastal ocean currents.",
                "Coastal cities should completely extinguish all electrical lighting during autumn migration months."
            ],
            correctAnswer: 1, // Index 1 = B
            explanation: "The passage discusses how light pollution disorients migratory birds and highlights a trial using low-intensity amber lighting that successfully reduced disorientation, concluding that adjusting lighting spectra protects bird populations. Option B accurately summarizes this main point."
        },
        {
            passage: "Entomologists studying honeybee communication observed that foragers perform a 'waggle dance' to communicate the distance and direction of floral resources to nestmates. When researchers artificially delayed returning foragers in a dark chamber for three hours before allowing them to dance, the bees adjusted their dance angle to compensate for the sun's movement across the sky during their delay. This compensatory behavior implies that honeybees rely on _______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "direct visual cues from the sun while performing the dance indoors.",
                "an internal circadian clock to estimate solar movement even when isolated from daylight.",
                "real-time magnetic field fluctuations generated by nearby hive mates.",
                "random physical movements that occasionally coincide with floral coordinates."
            ],
            correctAnswer: 1, // Index 1 = B
            explanation: "Because the bees were kept in a dark chamber with no daylight cues and still adjusted their dance angle to match the elapsed time and shifted position of the sun, they must possess an internal circadian mechanism to calculate solar progression."
        },
        {
            passage: "In his 1988 treatise, architectural historian Kenneth Frampton advocated for 'critical regionalism'—an approach that fuses modern building technology with local climate realities and cultural traditions. <b>Specifically, Frampton argued that architects should resist both the universal standardization of international modernism and the superficial nostalgia of historicist revivalism.</b> By doing so, buildings could maintain authentic cultural identity while remaining functionally contemporary.",
            prompt: "Which choice best describes the function of the highlighted sentence in the overall structure of the text?",
            options: [
                "It clarifies Frampton’s position by explaining what critical regionalism rejects in favor of its balanced approach.",
                "It provides statistical data on the energy efficiency of historicist revivalist architecture.",
                "It introduces a new architectural movement that directly opposes modern building technology.",
                "It summarizes public criticism directed at Frampton’s 1988 treatise."
            ],
            correctAnswer: 0, // Index 0 = A
            explanation: "The highlighted sentence specifies the two extremes (universal standardization vs superficial nostalgia) that Frampton rejected, clarifying how critical regionalism achieves its middle-ground approach."
        },
        {
            passage: "Text 1\nUniversal basic income (UBI) provides all citizens with regular unconditional cash transfers, simplifying social safety nets and eliminating administrative overhead associated with means-testing. Proponents emphasize that UBI guarantees baseline economic security while giving individuals total autonomy over their financial decisions.\n\nText 2\nWhile unconditional cash transfers offer administrative simplicity, targeted social assistance programs deliver greater financial relief to low-income households for every tax dollar spent. Supplying flat payouts to wealthy citizens dilutes limited fiscal resources that could otherwise fund robust healthcare, housing vouchers, and specialized job training for those in extreme poverty.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to the argument in Text 1 regarding UBI's unconditional nature?",
            options: [
                "By arguing that unconditional payouts misallocate limited public funds to individuals who do not require financial aid.",
                "By asserting that means-tested programs require higher tax rates for middle-class workers.",
                "By claiming that UBI completely eliminates the need for municipal healthcare funding.",
                "By agreeing that unconditional assistance provides the most cost-effective aid to impoverished communities."
            ],
            correctAnswer: 0, // Index 0 = A
            explanation: "Text 2 explicitly criticizes supplying flat payouts to wealthy citizens, arguing that this dilutes fiscal resources that could better serve those in extreme poverty. Thus, Text 2 views unconditional transfers as misallocating limited resources."
        },
        {
            passage: "Marine ecologist Dr. Clara Vance hypothesizes that kelp forests in northern Pacific coastal zones act as critical buffers against ocean acidification, absorbing dissolved carbon dioxide and elevating local seawater pH during peak photosynthetic months.",
            prompt: "Which quotation from a scientific report best supports Dr. Vance's hypothesis?",
            options: [
                "\"Kelp canopy density decreased by 15% following an unusually severe winter storm along the coast.\"",
                "\"Seawater samples collected inside dense kelp beds during summer demonstrated significantly higher pH levels and lower carbon dioxide concentrations than nearby open ocean waters.\"",
                "\"Commercial harvesting of giant kelp is regulated by state wildlife authorities to protect sea otter habitats.\"",
                "\"Kelp species in tropical regions exhibit lower growth rates than those in subpolar marine environments.\""
            ],
            correctAnswer: 1, // Index 1 = B
            explanation: "Dr. Vance hypothesizes that kelp absorbs carbon dioxide and elevates seawater pH during peak growth months. Option B provides empirical measurements showing higher pH and lower CO2 inside kelp beds during summer, directly supporting her hypothesis."
        },
        {
            passage: "Rather than presenting a rigid, dogmatic doctrine, the philosopher offered an intentionally _______ framework that allowed students to adapt core principles to diverse moral dilemmas.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["pliant", "intransigent", "ostentatious", "archaic"],
            correctAnswer: 0, // Index 0 = A
            explanation: "'Pliant' means flexible and adaptable. The passage contrasts a 'rigid, dogmatic doctrine' with a framework that allows students to 'adapt core principles', making 'pliant' the correct fit."
        },
        {
            passage: "Paleoclimatologists analyzing speleothems (cave mineral deposits) in Southeast Asia discovered distinct oxygen isotope ratios corresponding to historical monsoon intensity. Heavy oxygen isotopes indicate dry conditions, while light isotopes denote intense rainfall. Core samples spanning the past 4,000 years revealed that multi-decade drought intervals coincided precisely with the collapse periods of several major agrarian kingdoms in the region. Researchers infer from these physical records that historical societies in Southeast Asia ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "were entirely immune to regional hydrological shifts due to advanced irrigation networks.",
                "experienced heightened vulnerability to agricultural disruption and political instability during prolonged drought periods.",
                "shifted from agrarian farming to maritime trade during periods of heavy monsoon rainfall.",
                "caused regional rainfall patterns to change through underground mining of cave minerals."
            ],
            correctAnswer: 1, // Index 1 = B
            explanation: "The data shows that multi-decade drought intervals coincided with the collapses of major agrarian kingdoms, leading to the logical inference that prolonged droughts destabilized these societies by disrupting agriculture."
        },
        {
            passage: "In linguistics, code-switching—the practice of alternating between two or more languages in conversation—was once viewed by educators as evidence of linguistic deficiency or incomplete fluency. However, sociolinguistic research has thoroughly dismantled this view. Studies show that code-switching is a highly structured, rule-governed cognitive skill requiring advanced mastery of the grammatical systems of both languages. Speakers use code-switching to signal social identity, convey subtle emotional nuances, and navigate complex interpersonal dynamics.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Code-switching is a sign of language acquisition failure among bilingual children.",
                "Far from being a linguistic flaw, code-switching is a sophisticated, rule-based practice reflecting high fluency and social awareness.",
                "Most bilingual speakers prefer using one primary language for all formal and informal communication.",
                "Code-switching occurs exclusively in written literature rather than spoken conversation."
            ],
            correctAnswer: 1, // Index 1 = B
            explanation: "The passage refutes the old view that code-switching indicates deficiency, presenting evidence that it is a sophisticated, structured cognitive skill used by fluent speakers to navigate social dynamics. Option B captures this core message."
        },
        {
            passage: "Modern financial markets reacted with surprising _______ to the sudden regulatory change, recovering all early morning losses within minutes of the central bank's clarifying announcement.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["resilience", "lethargy", "friction", "indecision"],
            correctAnswer: 0, // Index 0 = A
            explanation: "'Resilience' means the capacity to recover quickly from difficulties. Recovering all market losses 'within minutes' after a sudden regulatory change directly demonstrates financial resilience."
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        // Build Interactive Web Quiz
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        // Build Hidden "Blank Print" Version
        let printHTML = '<h1 style="text-align: center; color: #1a5276; margin-bottom: 5px;">SAT Reading Practice - Set 9-9-SATa</h1><h3 style="text-align: center; margin-top: 0; margin-bottom: 30px; color: #555;">Blank Copy</h3><hr style="margin-bottom:30px; border: 0; border-top: 1px solid #ccc;">';
        
        quizData.forEach((q, index) => {
            let printOptionsHTML = '';
            q.options.forEach(opt => {
                printOptionsHTML += `
                    <li style="margin-bottom: 12px; display: flex; align-items: baseline;">
                        <div style="display:inline-block; width:14px; height:14px; border:2px solid #555; border-radius:50%; margin-right:12px; position:relative; top: 2px; flex-shrink: 0;"></div>
                        <span>${opt}</span>
                    </li>
                `;
            });
            
            printHTML += `
                <div style="margin-bottom: 45px; page-break-inside: avoid;">
                    <p style="font-weight: bold; font-size: 1.1em; color: #333;">Question ${index + 1}</p>
                    <div style="font-family: Georgia, serif; padding: 15px; background-color: #f9f9f9; border-left: 4px solid #ccc; margin-bottom: 15px;">${q.passage}</div>
                    <p style="font-weight: bold; margin-bottom: 15px;">${q.prompt}</p>
                    <ul style="list-style-type: none; padding: 0;">${printOptionsHTML}</ul>
                </div>
            `;
        });
        document.getElementById('print-blank-container').innerHTML = printHTML;

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please select an answer before checking.";
            feedbackDiv.className = "feedback warning";
            return;
        }

        isLocked[currentQuestion] = true;
        
        const radios = document.getElementsByName(`q${currentQuestion}`);
        radios.forEach(r => r.disabled = true);
        q.options.forEach((_, optIndex) => {
            document.getElementById(`label-${currentQuestion}-${optIndex}`).classList.add('disabled');
        });

        updateNav();

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct!</strong><br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Checked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                const radios = document.getElementsByName(`q${index}`);
                radios.forEach(r => r.disabled = true);
                feedbackDiv.innerHTML = `<strong>Unanswered / Not Checked.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        document.querySelector('.print-blank-btn').style.display = 'none'; 
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `You scored ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)`;
        
        if (score === quizData.length) {
            document.getElementById('harvard-reward').style.display = 'block';
        }
        
        window.scrollTo(0, 0);
    }

    function printBlankQuiz() {
        document.body.classList.add('print-blank-mode');
        window.print();
        document.body.classList.remove('print-blank-mode');
    }

    window.onload = initQuiz;
</script>

</body>
</html>
