<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Math Concept Review: 50 Questions (Includes Conversions)</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
    /* Clean, naked theme */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #ffffff;
        color: #333333;
        margin: 0;
        padding: 40px 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    #app {
        width: 100%;
        max-width: 700px;
        position: relative;
    }
    
    /* Scoreboard */
    .scoreboard {
        margin-bottom: 40px;
        padding: 20px;
        border: 2px solid #e0e0e0;
        border-radius: 10px;
        background-color: #fafafa;
    }
    .scoreboard h2 { margin-top: 0; text-align: center; font-size: 1.2rem; color: #555; }
    
    .progress-track {
        height: 8px;
        background: #e0e0e0;
        border-radius: 4px;
        margin: 40px 0 10px 0;
        position: relative;
    }
    
    #marker {
        position: absolute;
        top: -25px;
        left: 0%; /* Starts at 0 */
        transform: translateX(-50%);
        transition: left 0.4s ease-out;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .triangle-down {
        width: 0; 
        height: 0; 
        border-left: 12px solid transparent;
        border-right: 12px solid transparent;
        border-top: 16px solid #ff4757;
    }
    
    .status-labels {
        display: flex;
        justify-content: space-between;
        font-weight: bold;
        color: #888;
        font-size: 0.9rem;
    }

    /* Quiz Area */
    .question-box {
        font-size: 1.3rem;
        margin-bottom: 25px;
        line-height: 1.5;
    }
    .options-box {
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .option {
        padding: 15px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 1.1rem;
        background: #fff;
    }
    .option:hover { background-color: #f1f2f6; border-color: #a4b0be; }
    .option input { display: none; }
    
    .btn {
        margin-top: 30px;
        padding: 12px 24px;
        font-size: 1.1rem;
        font-weight: bold;
        color: white;
        background-color: #2ed573;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.2s;
        width: 100%;
    }
    .btn:hover { background-color: #26b360; }
    .btn:disabled { background-color: #ccc; cursor: not-allowed; }

    /* Bottom Right Tracker */
    .bottom-right-tracker {
        position: fixed;
        bottom: 20px;
        right: 20px;
        background: white;
        padding: 15px 20px;
        border: 2px solid #ff4757;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        font-weight: bold;
        font-size: 1rem;
        color: #ff4757;
    }

    /* Review Area */
    #review-area { display: none; margin-top: 40px; }
    .review-item {
        padding: 15px;
        margin-bottom: 15px;
        border-radius: 8px;
        border-left: 5px solid;
        background: #fafafa;
    }
    .review-item.wrong { border-left-color: #ff4757; }
    .review-item.correct { border-left-color: #2ed573; }
    .review-item p { margin: 5px 0; }
    
</style>
</head>
<body>

<div id="app">
    <div class="scoreboard" id="scoreboard">
        <h2>Progress Tracker</h2>
        <div class="progress-track">
            <div id="marker">
                <div class="triangle-down"></div>
            </div>
        </div>
        <div class="status-labels">
            <span>Trying</span>
            <span>Good Job</span>
            <span>Lits 🔥</span>
        </div>
    </div>

    <div id="quiz-area">
        <div id="progress-text" style="color:#888; font-weight:bold; margin-bottom:10px;">Question 1 of 50</div>
        <div class="question-box" id="question-text">Loading...</div>
        <div class="options-box" id="options-container"></div>
        <button class="btn" id="submit-btn" onclick="submitAnswer()">Submit Answer</button>
    </div>

    <div id="review-area">
        <h2>Complete Review</h2>
        <p>Here is a breakdown of your missing work and the correct solutions.</p>
        <div id="review-list"></div>
        <button class="btn" onclick="location.reload()">Try Again</button>
    </div>
</div>

<div class="bottom-right-tracker" id="missed-tracker">
    Missed (Should have gotten correct): 0
</div>

<script>
// The 50 Questions (Featuring Conversions!)
const questions = [
    // Percent / Fraction / Decimal Conversions
    { q: "Write 25% as a reduced fraction.", o: ["\\(\\frac{1}{25}\\)", "\\(\\frac{1}{4}\\)", "\\(\\frac{2}{5}\\)", "\\(\\frac{1}{5}\\)"], a: 1 },
    { q: "Convert \\(\\frac{3}{5}\\) to a decimal.", o: ["0.35", "3.5", "0.6", "0.06"], a: 2 },
    { q: "Write 0.15 as a percent.", o: ["1.5%", "150%", "0.15%", "15%"], a: 3 },
    { q: "Convert \\(\\frac{5}{8}\\) to a decimal.", o: ["0.625", "0.58", "5.8", "0.85"], a: 0 },
    { q: "Write 120% as a decimal.", o: ["12.0", "0.12", "1.2", "120.0"], a: 2 },
    { q: "Write 0.04 as a reduced fraction.", o: ["\\(\\frac{1}{4}\\)", "\\(\\frac{4}{10}\\)", "\\(\\frac{1}{25}\\)", "\\(\\frac{2}{5}\\)"], a: 2 },
    { q: "Convert \\(\\frac{7}{10}\\) to a percent.", o: ["7%", "70%", "0.7%", "700%"], a: 1 },
    { q: "Write 8.5% as a decimal.", o: ["0.85", "8.5", "85.0", "0.085"], a: 3 },
    { q: "Write \\(\\frac{3}{4}\\) as a percent.", o: ["34%", "43%", "75%", "0.75%"], a: 2 },
    { q: "Write 2.5 as a mixed number.", o: ["\\(2\\frac{1}{5}\\)", "\\(2\\frac{1}{2}\\)", "\\(5\\frac{1}{2}\\)", "\\(2\\frac{5}{100}\\)"], a: 1 },
    
    // Fractions & Mixed Numbers
    { q: "Add: \\(\\frac{1}{5} + \\frac{3}{10}\\)", o: ["\\(\\frac{4}{15}\\)", "\\(\\frac{1}{2}\\)", "\\(\\frac{4}{10}\\)", "\\(\\frac{2}{5}\\)"], a: 1 },
    { q: "Subtract: \\(\\frac{5}{6} - \\frac{1}{3}\\)", o: ["\\(\\frac{4}{3}\\)", "\\(\\frac{1}{2}\\)", "\\(\\frac{1}{6}\\)", "\\(\\frac{2}{3}\\)"], a: 1 },
    { q: "Multiply: \\(\\frac{3}{4} \\times \\frac{2}{3}\\)", o: ["\\(\\frac{5}{7}\\)", "\\(\\frac{1}{2}\\)", "\\(\\frac{6}{12}\\)", "Both 1/2 and 6/12 are correct"], a: 3 },
    { q: "Divide: \\(\\frac{7}{8} \\div \\frac{1}{4}\\)", o: ["\\(3\\frac{1}{2}\\)", "\\(\\frac{7}{32}\\)", "\\(2\\frac{1}{4}\\)", "\\(3\\frac{1}{4}\\)"], a: 0 },
    { q: "Add: \\(2\\frac{1}{4} + 1\\frac{5}{8}\\)", o: ["\\(3\\frac{7}{8}\\)", "\\(3\\frac{6}{12}\\)", "\\(4\\frac{1}{8}\\)", "\\(3\\frac{3}{4}\\)"], a: 0 },
    { q: "Subtract with regrouping: \\(4\\frac{1}{3} - 2\\frac{2}{3}\\)", o: ["\\(2\\frac{1}{3}\\)", "\\(1\\frac{2}{3}\\)", "\\(2\\frac{2}{3}\\)", "\\(1\\frac{1}{3}\\)"], a: 1 },
    { q: "Multiply: \\(1\\frac{1}{2} \\times 3\\frac{1}{3}\\)", o: ["4", "\\(4\\frac{1}{6}\\)", "5", "\\(3\\frac{1}{6}\\)"], a: 2 },
    { q: "Divide: \\(5 \\div 1\\frac{1}{4}\\)", o: ["\\(6\\frac{1}{4}\\)", "4", "3", "\\(5\\frac{1}{4}\\)"], a: 1 },
    { q: "What is \\(\\frac{2}{7}\\) of 28?", o: ["8", "14", "4", "6"], a: 0 },
    { q: "If \\(\\frac{3}{8}\\) of 40 students wear glasses, how many do NOT wear glasses?", o: ["15", "25", "20", "30"], a: 1 },
    
    // Ratios & Proportions
    { q: "The ratio of apples to oranges is 3:5. If there are 15 apples, how many oranges?", o: ["20", "25", "30", "15"], a: 1 },
    { q: "The ratio of boys to girls is 4:3. If there are 21 girls, how many boys?", o: ["28", "16", "24", "32"], a: 0 },
    { q: "Solve for x: \\(\\frac{2}{5} = \\frac{x}{20}\\)", o: ["4", "10", "8", "6"], a: 2 },
    { q: "Solve for y: \\(\\frac{3}{4} = \\frac{15}{y}\\)", o: ["16", "24", "20", "12"], a: 2 },
    
    // Decimals
    { q: "Add: \\(3.45 + 1.6\\)", o: ["5.05", "4.05", "3.61", "5.15"], a: 0 },
    { q: "Subtract: \\(15.2 - 4.85\\)", o: ["11.35", "10.35", "11.65", "10.65"], a: 1 },
    { q: "Multiply: \\(1.2 \\times 0.4\\)", o: ["4.8", "0.048", "0.48", "48"], a: 2 },
    { q: "Multiply: \\(0.05 \\times 100\\)", o: ["0.5", "50", "0.005", "5"], a: 3 },
    { q: "Divide: \\(12.6 \\div 3\\)", o: ["4.2", "42", "0.42", "4.02"], a: 0 },
    { q: "Divide: \\(4.5 \\div 0.09\\)", o: ["5", "50", "0.5", "500"], a: 1 },
    { q: "Divide: \\(35.8 \\div 1000\\)", o: ["0.358", "3.58", "0.0358", "0.00358"], a: 2 },
    { q: "Add: \\(0.004 + 0.02\\)", o: ["0.006", "0.024", "0.06", "0.204"], a: 1 },
    
    // Square Roots & Algebra
    { q: "Find the square root: \\(\\sqrt{49}\\)", o: ["6", "8", "7", "14"], a: 2 },
    { q: "Find the square root: \\(\\sqrt{121}\\)", o: ["11", "12", "13", "10"], a: 0 },
    { q: "Between which two numbers is \\(\\sqrt{27}\\)?", o: ["4 and 5", "5 and 6", "26 and 28", "6 and 7"], a: 1 },
    { q: "Between which two numbers is \\(\\sqrt{90}\\)?", o: ["8 and 9", "9 and 10", "89 and 91", "10 and 11"], a: 1 },
    { q: "Solve for m: \\(7m = 42\\)", o: ["6", "7", "8", "5"], a: 0 },
    { q: "Solve for k: \\(\\frac{k}{4} = 9\\)", o: ["13", "5", "36", "32"], a: 2 },
    { q: "Solve for x: \\(2x + 5 = 15\\)", o: ["10", "5", "4", "20"], a: 1 },
    { q: "Solve for y: \\(3y - 2 = 10\\)", o: ["4", "3", "12", "6"], a: 0 },
    
    // Geometry
    { q: "Find the area of a triangle with a base of 9 in and height of 4 in.", o: ["36 sq in", "18 sq in", "13 sq in", "26 sq in"], a: 1 },
    { q: "Find the perimeter of a rectangle with length 10 cm and width 4 cm.", o: ["40 cm", "14 cm", "28 cm", "24 cm"], a: 2 },
    { q: "Find the circumference of a circle with a diameter of 10 mm. (Use 3.14 for \\(\\pi\\))", o: ["31.4 mm", "15.7 mm", "314 mm", "62.8 mm"], a: 0 },
    { q: "Find the area of a circle with a radius of 3 m. (Use 3.14 for \\(\\pi\\))", o: ["18.84 sq m", "28.26 sq m", "9.42 sq m", "88.74 sq m"], a: 1 },
    { q: "Find the volume of a rectangular prism: Length=3, Width=4, Height=5", o: ["12", "60", "20", "120"], a: 1 },
    { q: "How many faces does a rectangular prism have?", o: ["4", "6", "8", "12"], a: 1 },
    { q: "If the radius is 8, what is the diameter?", o: ["4", "16", "64", "24"], a: 1 },
    
    // Coordinate Plane
    { q: "In the ordered pair (-4, 7), which is the y-coordinate?", o: ["-4", "7", "Both", "Neither"], a: 1 },
    { q: "Which quadrant is the point (2, -5) located in?", o: ["Quadrant I", "Quadrant II", "Quadrant III", "Quadrant IV"], a: 3 },
    { q: "Starting at the origin, moving 3 units left and 2 units up puts you at...", o: ["(3, 2)", "(-3, 2)", "(3, -2)", "(-3, -2)"], a: 1 }
];

let currentQuestion = 0;
let missedCount = 0;
let score = 0;
let selectedOption = null;
let userAnswers = []; // Store answers for the review section

const questionText = document.getElementById('question-text');
const optionsContainer = document.getElementById('options-container');
const submitBtn = document.getElementById('submit-btn');
const marker = document.getElementById('marker');
const progressText = document.getElementById('progress-text');
const missedTracker = document.getElementById('missed-tracker');
const quizArea = document.getElementById('quiz-area');
const reviewArea = document.getElementById('review-area');
const reviewList = document.getElementById('review-list');
const scoreboard = document.getElementById('scoreboard');

function loadQuestion() {
    selectedOption = null;
    submitBtn.disabled = true;
    
    const q = questions[currentQuestion];
    progressText.innerText = `Question ${currentQuestion + 1} of 50`;
    questionText.innerHTML = q.q;
    
    optionsContainer.innerHTML = '';
    q.o.forEach((opt, index) => {
        const div = document.createElement('div');
        div.className = 'option';
        div.innerHTML = opt;
        div.onclick = () => selectOption(index, div);
        optionsContainer.appendChild(div);
    });

    // Tell MathJax to re-render the newly injected math symbols
    if (window.MathJax) {
        MathJax.typesetPromise([questionText, optionsContainer]).catch((err) => console.log(err));
    }
}

function selectOption(index, element) {
    selectedOption = index;
    submitBtn.disabled = false;
    
    // Clear styling from all options
    document.querySelectorAll('.option').forEach(el => {
        el.style.backgroundColor = '#fff';
        el.style.borderColor = '#e0e0e0';
    });
    
    // Highlight selected
    element.style.backgroundColor = '#e1f5fe';
    element.style.borderColor = '#03a9f4';
}

function submitAnswer() {
    const q = questions[currentQuestion];
    const isCorrect = (selectedOption === q.a);
    
    userAnswers.push({
        question: q.q,
        userPick: q.o[selectedOption],
        correctPick: q.o[q.a],
        isCorrect: isCorrect
    });

    if (isCorrect) {
        score++;
    } else {
        missedCount++;
        missedTracker.innerText = `Missed (Should have gotten correct): ${missedCount}`;
    }

    // Update Triangle Marker ("Trying" -> "Good Job" -> "Lits")
    const percentComplete = ((currentQuestion + 1) / questions.length) * 100;
    marker.style.left = `${percentComplete}%`;

    currentQuestion++;

    if (currentQuestion < questions.length) {
        loadQuestion();
    } else {
        showReview();
    }
}

function showReview() {
    quizArea.style.display = 'none';
    scoreboard.style.display = 'none';
    reviewArea.style.display = 'block';
    
    reviewList.innerHTML = '';
    
    userAnswers.forEach((ans, i) => {
        if (!ans.isCorrect) {
            const div = document.createElement('div');
            div.className = 'review-item wrong';
            div.innerHTML = `
                <p><strong>Question ${i+1}:</strong> ${ans.question}</p>
                <p style="color:#ff4757;">Your Answer: ${ans.userPick}</p>
                <p style="color:#2ed573;"><strong>Correct Answer: ${ans.correctPick}</strong></p>
            `;
            reviewList.appendChild(div);
        }
    });

    if (missedCount === 0) {
        reviewList.innerHTML = `<div class="review-item correct"><p><strong>Perfect Score! You are LITS! 🔥</strong> No missing work to review.</p></div>`;
    }

    if (window.MathJax) {
        MathJax.typesetPromise([reviewList]).catch((err) => console.log(err));
    }
}

// Initialize first question
loadQuestion();
</script>
</body>
</html>
