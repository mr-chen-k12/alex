<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT Reading Practice - Set 9-14b</title>
<style>
    /* General Styles */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        position: relative;
    }
    h1 {
        text-align: center;
        color: #1a5276;
    }
    
    .print-blank-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        background-color: #7f8c8d;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 4px;
        color: white;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
    }
    .print-blank-btn:hover {
        background-color: #616a6b;
    }

    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #f9f9f9;
        padding: 15px;
        border-left: 4px solid #1a5276;
        margin-bottom: 20px;
        font-size: 1.05em;
    }
    .prompt {
        font-weight: bold;
        margin-bottom: 15px;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 10px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #f0f3f4;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #d5dbdb;
    }
    .options label:hover {
        background: #e5e8e8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }
    .options input {
        margin-right: 15px;
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 4px;
        display: none;
        border-left: 4px solid;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #1e8449;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #c0392b;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #eee;
        padding-top: 20px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #1a5276;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #154360; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    .check-btn { background-color: #d35400; }
    .check-btn:hover { background-color: #a04000; }
    .check-btn:disabled { background-color: #e59866; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #1e8449; }
    
    #results {
        display: none;
        text-align: center;
        padding: 20px;
        background: #eafaf1;
        border: 2px solid #2ecc71;
        border-radius: 8px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        color: #7f8c8d;
    }

    #univ-reward {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #fff;
        border: 3px double #a51c30;
        border-radius: 8px;
        animation: pullUp 0.5s ease-out;
    }
    #univ-reward img {
        width: 160px;
        height: auto;
        margin: 15px auto;
        display: block;
    }
    .univ-text {
        font-family: Georgia, serif;
        font-size: 1.4em;
        font-weight: bold;
        letter-spacing: 1px;
    }

    #print-blank-container {
        display: none;
    }

    @keyframes pullUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* Printer Friendly Styles */
    @media print {
        body { background-color: white; padding: 0; }
        
        #quiz-container { box-shadow: none; max-width: 100%; border: none; padding: 0; }
        .question-block { 
            display: block !important; 
            page-break-inside: avoid; 
            border-bottom: 1px solid #ccc; 
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .nav-buttons, .check-btn, .progress-tracker, button, .print-blank-btn { display: none !important; }
        .options label { border: none; padding: 5px 0; background: transparent; }
        .options input { appearance: auto; } 

        #univ-reward {
            display: block !important;
            border-style: solid !important;
            border-width: 2px !important;
        }

        /* Override for Blank Print Mode */
        body.print-blank-mode #quiz-container { display: none !important; }
        body.print-blank-mode #print-blank-container { display: block !important; }
    }

    @media screen and (max-width: 600px) {
        .print-blank-btn {
            position: relative;
            top: 0;
            right: 0;
            display: block;
            margin: 0 auto 20px auto;
        }
    }
</style>
</head>
<body>

<div id="quiz-container">
    <button class="print-blank-btn" onclick="printBlankQuiz()">🖨️ Print Blank Quiz</button>
    <h1>SAT Reading Practice - Set 9-14b</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>Quiz Complete</h2>
        <p id="score-display" style="font-size: 1.5em; font-weight: bold;"></p>
        <p>Review your answers and explanations below.</p>
        
        <div id="univ-reward">
            <div class="univ-text" id="univ-reward-title">★ FLAWLESS ACADEMIC EXCELLENCE ★</div>
            <img id="univ-reward-img" src="" alt="University Crest">
            <p id="univ-reward-text" style="color: #555; font-style: italic; font-weight: bold; margin-top: 5px;"></p>
        </div>

        <button onclick="window.print()" style="margin-top: 15px;">🖨️ Print Results</button>
    </div>

    <div id="questions-wrapper">
        <!-- Questions injected here -->
    </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit for Review</button>
    </div>
</div>

<div id="print-blank-container"></div>

<script>
    const universityRewards = [
        {
            name: "Harvard University",
            img: "https://mr-chen-k12.github.io/math/IMG_0232.png",
            color: "#a51c30"
        },
        {
            name: "Boston University",
            img: "https://mr-chen-k12.github.io/books/IMG_0121.png",
            color: "#CC0000"
        },
        {
            name: "Yale University",
            img: "https://mr-chen-k12.github.io/books/IMG_0122.png",
            color: "#00356B"
        }
    ];

    const quizData = [
        {
            passage: "While earlier biographers portrayed the industrialist as an unyielding autocrat, recent archivist discoveries paint a far more _______ portrait, revealing his behind-the-scenes philanthropy and personal doubts.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["nuanced", "dogmatic", "ostentatious", "uniform"],
            correctAnswer: 0, // A
            explanation: "'Nuanced' means characterized by subtle shades of meaning or expression. The passage contrasts the earlier one-dimensional view ('unyielding autocrat') with a new portrait that reveals complex, varied facets of his life."
        },
        {
            passage: "Glaciologists monitoring Antarctic ice shelves used satellite radar interferometry to trace sub-glacial water flow beneath the Thwaites Glacier. The data revealed that warm deep-ocean currents are carving cavernous channels under the ice shelf's grounding line, accelerating melt rates from below. As these sub-glacial cavities expand, the ice shelf loses structural integrity, hastening its collapse into the Amundsen Sea. Understanding these hidden marine-ice interactions is critical for improving global sea-level rise projections.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Satellite radar interferometry has rendered physical expeditions to Antarctic glaciers unnecessary.",
                "Warm ocean currents carving sub-glacial channels threaten the stability of the Thwaites Glacier, highlighting the importance of marine-ice studies for predicting sea-level rise.",
                "The Thwaites Glacier is expanding at a record pace due to reduced sea-surface temperatures in the Amundsen Sea.",
                "Sub-glacial water flow is entirely controlled by surface atmospheric temperatures rather than deep-ocean currents."
            ],
            correctAnswer: 1, // B
            explanation: "The passage outlines how warm currents carve channels beneath the Thwaites Glacier, accelerating melting and structural weakening, and concludes that understanding this interaction is critical for sea-level projections."
        },
        {
            passage: "Entomologists studying honeybee foraging behavior observed that bees exposed to trace amounts of neonicotinoid pesticides exhibited significant impairment in spatial memory and navigation. When placed in unfamiliar flight arenas, exposed bees took nearly three times longer to locate their hives than untreated control bees. Furthermore, waggle dances performed by affected bees conveyed erratic directional coordinates to hive mates. These findings suggest that pesticide exposure _______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "impairs bees' ability to navigate and communicate food sources effectively within their colonies.",
                "permanently prevents young bees from developing wings capable of flight.",
                "enhances bees' resistance to parasitic varroa mites in agricultural zones.",
                "causes bees to abandon flower foraging in favor of predatory behavior."
            ],
            correctAnswer: 0, // A
            explanation: "Because exposed bees took longer to navigate back to hives and performed erratic waggle dances (which convey directions to hive mates), pesticide exposure logically impairs both navigation and colony communication."
        },
        {
            passage: "In her 2019 treatise, urban theorist Dr. Elena Rostova evaluated the socio-economic impacts of public transit expansion in mid-sized metropolitan areas. <b>Specifically, Rostova analyzed farebox revenue logs and demographic census data across twelve cities to demonstrate that light-rail additions yielded higher property values without displacing low-income residents when paired with inclusionary zoning.</b> This empirical finding challenged the prevailing belief that light-rail projects inevitably trigger disruptive gentrification.",
            prompt: "Which choice best describes the function of the highlighted sentence in the overall structure of the text?",
            options: [
                "It details the specific empirical evidence Rostova used to counter the assumption that light-rail expansion always causes gentrification.",
                "It presents a list of municipal transit projects that failed due to low farebox revenues.",
                "It compares property taxes in European cities with those in North American metropolitan centers.",
                "It advocates for replacing inclusionary zoning with private real estate development subsidies."
            ],
            correctAnswer: 0, // A
            explanation: "The highlighted sentence specifies the empirical data (farebox revenue logs and census data across twelve cities) Rostova used to show light-rail doesn't always displace low-income residents, challenging the gentrification assumption."
        },
        {
            passage: "Text 1\nThe introduction of algorithmic recommendation systems in digital news platforms represents a major democratic advancement. By tailoring content to individual reader preferences, algorithms maximize user engagement and ensure readers receive news that directly aligns with their interests.\n\nText 2\nWhile personalized news algorithms boost user engagement metrics, they foster ideological \"filter bubbles\" that shield readers from opposing viewpoints. By continuously reinforcing existing biases, these platforms diminish public discourse and deepen political polarization.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to Text 1's view on algorithmic news delivery?",
            options: [
                "By arguing that catering to individual preferences isolates readers into echo chambers and harms democratic discourse.",
                "By asserting that news platforms should eliminate digital subscription fees for all users.",
                "By agreeing that personalized content completely eliminates political bias in online journalism.",
                "By suggesting that readers prefer print newspapers over digital platforms."
            ],
            correctAnswer: 0, // A
            explanation: "Text 2 explicitly contends that tailoring content creates filter bubbles and reinforces bias, directly countering Text 1's claim that personalized content is a positive democratic advancement."
        },
        {
            passage: "Archaeologist Dr. Marcus Thorne hypothesizes that ancient trade networks along the Maritime Silk Road prospered primarily due to specialized vessel designs engineered for open-ocean navigation rather than reliance on coastal cabotage routes.",
            prompt: "Which quotation from an archaeological journal best supports Dr. Thorne's hypothesis?",
            options: [
                "\"Submerged shipwrecks excavated along open-water ocean routes revealed advanced keel constructions and multi-masted rigging specifically engineered to survive deep-sea squalls.\"",
                "\"Desert oasis settlements contained extensive stone caravanserais built to shelter hundreds of pack camels during overland crossings.\"",
                "\"Clay tablets recovered from mountain fortresses recorded agricultural taxation policies along inland river valleys.\"",
                "\"Ancient poetry frequently celebrated the bravery of river pilots navigating shallow coastal deltas.\""
            ],
            correctAnswer: 0, // A
            explanation: "Option A provides direct evidence of advanced ship engineering (keel constructions and multi-masted rigging) found along open-water routes, supporting Dr. Thorne's hypothesis about open-ocean navigation."
        },
        {
            passage: "The committee chairperson appreciated the consultant's _______ report, which presented a clear, straightforward breakdown of the fiscal deficit without resorting to convoluted jargon or ambiguous figures.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["lucid", "convoluted", "esoteric", "evasive"],
            correctAnswer: 0, // A
            explanation: "'Lucid' means expressed clearly and easy to understand. A report described as 'clear' and 'straightforward' without jargon is best described as lucid."
        },
        {
            passage: "Plant physiologists investigating drought tolerance in sorghum discovered that certain cultivars express high levels of the <i>DHN1</i> gene during water scarcity. This gene encodes dehydrin proteins that protect cellular membranes from structural collapse during extreme desiccation. Sorghum lines genetically modified to overexpress <i>DHN1</i> maintained photosynthetic activity 40% longer under drought conditions than non-modified control lines. Consequently, targeted selection or expression of dehydrin genes could _______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "lead to crop varieties better equipped to withstand prolonged periods of drought.",
                "render sorghum plants incapable of absorbing groundwater through their roots.",
                "cause agricultural crops to require double the rainfall during harvesting seasons.",
                "eliminate the need for photosynthetic activity in crop plants."
            ],
            correctAnswer: 0, // A
            explanation: "Because overexpressing *DHN1* helps sorghum maintain photosynthesis 40% longer during drought by protecting cellular membranes, utilizing these genes logically leads to crops with better drought tolerance."
        },
        {
            passage: "Renaissance artists utilized atmospheric perspective—a technique where distant objects are painted with paler, bluer tones and softer edges—to simulate how Earth's atmosphere scatters light over long distances. By applying this optical principle, painters like Leonardo da Vinci created convincing depths of field on flat wooden panels and canvases. Modern vision scientists studying spatial perception confirmed that human depth perception relies heavily on these exact contrast and color shifts. Thus, Renaissance artistic techniques anticipated fundamental principles of human visual cognition.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Atmospheric perspective relied on synthetic pigments that were unavailable until the nineteenth century.",
                "Renaissance artists used atmospheric perspective to create spatial depth in ways that aligned with principles of human visual perception.",
                "Leonardo da Vinci rejected traditional depth perception techniques in favor of abstract geometric shapes.",
                "Human depth perception relies exclusively on stereoscopic vision rather than contrast and color cues."
            ],
            correctAnswer: 1, // B
            explanation: "The text explains how Renaissance artists used atmospheric perspective to convey depth and notes that modern vision science confirms human perception operates on those same principles."
        },
        {
            passage: "Despite encountering fierce opposition from established corporate lobbies, the young legislator remained _______, continuing to campaign tirelessly until the environmental protection bill passed into law.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["resolute", "vacillating", "indifferent", "diffident"],
            correctAnswer: 0, // A
            explanation: "'Resolute' means admirably purposeful, determined, and unwavering. Campaigning tirelessly despite fierce opposition shows a resolute attitude."
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        // Build Interactive Web Quiz
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        // Build Hidden "Blank Print" Version
        let printHTML = '<h1 style="text-align: center; color: #1a5276; margin-bottom: 5px;">SAT Reading Practice - Set 9-14b</h1><h3 style="text-align: center; margin-top: 0; margin-bottom: 30px; color: #555;">Blank Copy</h3><hr style="margin-bottom:30px; border: 0; border-top: 1px solid #ccc;">';
        
        quizData.forEach((q, index) => {
            let printOptionsHTML = '';
            q.options.forEach(opt => {
                printOptionsHTML += `
                    <li style="margin-bottom: 12px; display: flex; align-items: baseline;">
                        <div style="display:inline-block; width:14px; height:14px; border:2px solid #555; border-radius:50%; margin-right:12px; position:relative; top: 2px; flex-shrink: 0;"></div>
                        <span>${opt}</span>
                    </li>
                `;
            });
            
            printHTML += `
                <div style="margin-bottom: 45px; page-break-inside: avoid;">
                    <p style="font-weight: bold; font-size: 1.1em; color: #333;">Question ${index + 1}</p>
                    <div style="font-family: Georgia, serif; padding: 15px; background-color: #f9f9f9; border-left: 4px solid #ccc; margin-bottom: 15px;">${q.passage}</div>
                    <p style="font-weight: bold; margin-bottom: 15px;">${q.prompt}</p>
                    <ul style="list-style-type: none; padding: 0;">${printOptionsHTML}</ul>
                </div>
            `;
        });
        document.getElementById('print-blank-container').innerHTML = printHTML;

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please select an answer before checking.";
            feedbackDiv.className = "feedback warning";
            return;
        }

        isLocked[currentQuestion] = true;
        
        const radios = document.getElementsByName(`q${currentQuestion}`);
        radios.forEach(r => r.disabled = true);
        q.options.forEach((_, optIndex) => {
            document.getElementById(`label-${currentQuestion}-${optIndex}`).classList.add('disabled');
        });

        updateNav();

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct!</strong><br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Checked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                const radios = document.getElementsByName(`q${index}`);
                radios.forEach(r => r.disabled = true);
                feedbackDiv.innerHTML = `<strong>Unanswered / Not Checked.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        document.querySelector('.print-blank-btn').style.display = 'none'; 
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `You scored ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)`;
        
        // Pick a random university crest reward on a perfect score (10/10)
        if (score === quizData.length) {
            const reward = universityRewards[Math.floor(Math.random() * universityRewards.length)];
            const rewardDiv = document.getElementById('univ-reward');
            const rewardTitle = document.getElementById('univ-reward-title');
            const rewardImg = document.getElementById('univ-reward-img');
            const rewardText = document.getElementById('univ-reward-text');
            
            rewardDiv.style.borderColor = reward.color;
            rewardTitle.style.color = reward.color;
            rewardImg.src = reward.img;
            rewardImg.alt = reward.name + " Crest";
            rewardText.textContent = `You have successfully earned the ${reward.name} verification crest for achieving a perfect 10/10 score.`;
            
            rewardDiv.style.display = 'block';
        }
        
        window.scrollTo(0, 0);
    }

    function printBlankQuiz() {
        document.body.classList.add('print-blank-mode');
        window.print();
        document.body.classList.remove('print-blank-mode');
    }

    window.onload = initQuiz;
</script>

</body>
</html>
