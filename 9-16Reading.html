let currentSetKey = 'A';
let currentQuestionIndex = 0;
let userAnswers = {}; // Map: `${setKey}-${qIndex}` -> selected option
let isQuestionLocked = {}; // Map: `${setKey}-${qIndex}` -> boolean

function initSet(setKey) {
    currentSetKey = setKey;
    currentQuestionIndex = 0;
    
    // Ensure state arrays/maps exist
    if (!userAnswers[setKey]) {
        userAnswers[setKey] = new Array(quizSets[setKey].length).fill(null);
    }
    if (!isQuestionLocked[setKey]) {
        isQuestionLocked[setKey] = new Array(quizSets[setKey].length).fill(false);
    }

    renderInteractiveQuestions();
    renderPrintBlankVersion();
    
    document.getElementById('results').style.display = 'none';
    document.getElementById('nav-buttons').style.display = 'flex';
    document.getElementById('progress-tracker').style.display = 'inline-block';
    
    showQuestion(0);
}

function switchSet(newSetKey) {
    initSet(newSetKey);
}

function renderInteractiveQuestions() {
    const wrapper = document.getElementById('questions-wrapper');
    wrapper.innerHTML = '';
    const questions = quizSets[currentSetKey];

    questions.forEach((q, qIndex) => {
        const qBlock = document.createElement('div');
        qBlock.className = `question-block ${qIndex === 0 ? 'active' : ''}`;
        qBlock.id = `q-block-${qIndex}`;

        let optionsHTML = '';
        q.options.forEach((opt, optIndex) => {
            optionsHTML += `
                <li>
                    <label id="lbl-${qIndex}-${optIndex}">
                        <input type="radio" name="q-${currentSetKey}-${qIndex}" value="${optIndex}" onchange="selectOption(${qIndex}, ${optIndex})">
                        <span>${opt}</span>
                    </label>
                </li>
            `;
        });

        qBlock.innerHTML = `
            <div class="passage">${q.passage}</div>
            <div class="prompt">${q.prompt}</div>
            <ul class="options">${optionsHTML}</ul>
            <div class="feedback" id="feedback-${qIndex}"></div>
        `;

        wrapper.appendChild(qBlock);
    });
}

function renderPrintBlankVersion() {
    const container = document.getElementById('print-blank-container');
    const questions = quizSets[currentSetKey];
    
    let printHTML = `
        <div style="text-align: center; margin-bottom: 25px;">
            <h1 style="color: #1a5276; margin-bottom: 5px;">SAT Reading Practice Exam</h1>
            <h2 style="color: #555; margin-top: 0; font-size: 1.2em;">Set ${currentSetKey} - Blank Question Sheet</h2>
            <div style="font-size: 0.9em; color: #777;">Name: _______________________ &nbsp;&nbsp;&nbsp;&nbsp; Date: _______________ &nbsp;&nbsp;&nbsp;&nbsp; Score: ______ / 10</div>
        </div>
        <hr style="border: 0; border-top: 1px solid #ccc; margin-bottom: 30px;">
    `;

    questions.forEach((q, qIndex) => {
        let printOptionsHTML = '';
        q.options.forEach((opt, optIndex) => {
            const letter = String.fromCharCode(65 + optIndex);
            printOptionsHTML += `
                <li style="margin-bottom: 10px; display: flex; align-items: baseline;">
                    <span style="font-weight: bold; width: 25px;">${letter})</span>
                    <span>${opt}</span>
                </li>
            `;
        });

        printHTML += `
            <div style="margin-bottom: 35px; page-break-inside: avoid;">
                <p style="font-weight: bold; font-size: 1.05em; color: #1a5276; margin-bottom: 8px;">Question ${qIndex + 1}</p>
                <div style="font-family: Georgia, serif; padding: 14px; background-color: #f9f9f9; border-left: 4px solid #1a5276; margin-bottom: 12px; line-height: 1.5;">${q.passage}</div>
                <p style="font-weight: 600; margin-bottom: 12px;">${q.prompt}</p>
                <ul style="list-style-type: none; padding-left: 5px;">${printOptionsHTML}</ul>
            </div>
        `;
    });

    container.innerHTML = printHTML;
}

function selectOption(qIndex, optIndex) {
    if (isQuestionLocked[currentSetKey][qIndex]) return;

    userAnswers[currentSetKey][qIndex] = optIndex;
    
    const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
    if (feedbackDiv.classList.contains('warning')) {
        feedbackDiv.style.display = 'none';
    }
}

function checkAnswer() {
    const qIndex = currentQuestionIndex;
    const selected = userAnswers[currentSetKey][qIndex];
    const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
    const q = quizSets[currentSetKey][qIndex];

    if (selected === null || selected === undefined) {
        feedbackDiv.innerHTML = "⚠️ Please select an option before checking your answer.";
        feedbackDiv.className = "feedback warning";
        return;
    }

    if (isQuestionLocked[currentSetKey][qIndex]) return;

    isQuestionLocked[currentSetKey][qIndex] = true;

    // Disable inputs for this question
    const radios = document.getElementsByName(`q-${currentSetKey}-${qIndex}`);
    radios.forEach(r => r.disabled = true);
    q.options.forEach((_, optIdx) => {
        const lbl = document.getElementById(`lbl-${qIndex}-${optIdx}`);
        if (lbl) lbl.classList.add('disabled');
    });

    updateNavState();

    if (selected === q.correctAnswer) {
        feedbackDiv.innerHTML = `<strong>✓ Correct!</strong><br><br><strong>Explanation:</strong> ${q.explanation}`;
        feedbackDiv.className = "feedback correct";
    } else {
        const correctLetter = String.fromCharCode(65 + q.correctAnswer);
        feedbackDiv.innerHTML = `<strong>✕ Incorrect.</strong> The correct answer is <strong>${correctLetter}) ${q.options[q.correctAnswer]}</strong>.<br><br><strong>Explanation:</strong> ${q.explanation}`;
        feedbackDiv.className = "feedback incorrect";
    }
}

function showQuestion(index) {
    const questions = quizSets[currentSetKey];
    if (index < 0 || index >= questions.length) return;

    document.querySelectorAll('.question-block').forEach(el => el.classList.remove('active'));
    
    const targetBlock = document.getElementById(`q-block-${index}`);
    if (targetBlock) targetBlock.classList.add('active');

    currentQuestionIndex = index;

    // Restore radio button selection if already answered
    const savedAns = userAnswers[currentSetKey][index];
    if (savedAns !== null && savedAns !== undefined) {
        const radios = document.getElementsByName(`q-${currentSetKey}-${index}`);
        if (radios[savedAns]) radios[savedAns].checked = true;
    }

    document.getElementById('progress-tracker').textContent = `Set ${currentSetKey} | Question ${index + 1} of ${questions.length}`;
    
    updateNavState();
}

function navigate(direction) {
    showQuestion(currentQuestionIndex + direction);
}

function updateNavState() {
    const totalQ = quizSets[currentSetKey].length;
    document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;

    if (currentQuestionIndex === totalQ - 1) {
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('submit-btn').style.display = 'inline-block';
    } else {
        document.getElementById('next-btn').style.display = 'inline-block';
        document.getElementById('submit-btn').style.display = 'none';
    }

    const checkBtn = document.getElementById('check-btn');
    if (isQuestionLocked[currentSetKey][currentQuestionIndex]) {
        checkBtn.disabled = true;
        checkBtn.textContent = "Answer Checked";
    } else {
        checkBtn.disabled = false;
        checkBtn.textContent = "Check Answer";
    }
}

function submitQuiz() {
    const questions = quizSets[currentSetKey];
    let score = 0;

    questions.forEach((q, qIndex) => {
        const qBlock = document.getElementById(`q-block-${qIndex}`);
        const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
        
        qBlock.classList.add('active'); // Reveal all for full review

        const selected = userAnswers[currentSetKey][qIndex];

        // Disable input
        const radios = document.getElementsByName(`q-${currentSetKey}-${qIndex}`);
        radios.forEach(r => r.disabled = true);

        isQuestionLocked[currentSetKey][qIndex] = true;

        if (selected === q.correctAnswer) {
            score++;
            if (!feedbackDiv.classList.contains('correct')) {
                feedbackDiv.innerHTML = `<strong>✓ Correct!</strong><br><br><strong>Explanation:</strong> ${q.explanation}`;
                feedbackDiv.className = "feedback correct";
            }
        } else {
            const correctLetter = String.fromCharCode(65 + q.correctAnswer);
            feedbackDiv.innerHTML = `<strong>✕ ${selected === null || selected === undefined ? 'Unanswered' : 'Incorrect'}.</strong> The correct answer is <strong>${correctLetter}) ${q.options[q.correctAnswer]}</strong>.<br><br><strong>Explanation:</strong> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    });

    document.getElementById('nav-buttons').style.display = 'none';
    document.getElementById('progress-tracker').style.display = 'none';
    
    const resultsDiv = document.getElementById('results');
    resultsDiv.style.display = 'block';

    const percentage = Math.round((score / questions.length) * 100);
    document.getElementById('score-display').textContent = `Score: ${score} / ${questions.length} (${percentage}%)`;

    // Trigger Reward Banner if 10/10 (100%)
    const rewardDiv = document.getElementById('univ-reward');
    if (score === questions.length) {
        const reward = universityRewards[Math.floor(Math.random() * universityRewards.length)];
        
        document.getElementById('univ-reward-title').style.color = reward.color;
        rewardDiv.style.borderColor = reward.color;
        
        const rewardImg = document.getElementById('univ-reward-img');
        rewardImg.src = reward.img;
        rewardImg.alt = `${reward.name} Crest`;

        document.getElementById('univ-reward-text').textContent = 
            `Congratulations on your flawless 100% performance on Set ${currentSetKey}! You have officially earned the ${reward.name} Verification Certificate of Academic Mastery.`;

        rewardDiv.style.display = 'block';
    } else {
        rewardDiv.style.display = 'none';
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function printBlankQuiz() {
    document.body.classList.add('print-blank-mode');
    window.print();
    document.body.classList.remove('print-blank-mode');
}

// Initialize default set on page load
window.onload = function() {
    initSet('A');
};
</script>
