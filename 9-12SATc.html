<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT Reading Practice - Set 9-12c</title>
<style>
    /* General Styles */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        position: relative;
    }
    h1 {
        text-align: center;
        color: #1a5276;
    }
    
    .print-blank-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        background-color: #7f8c8d;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 4px;
        color: white;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
    }
    .print-blank-btn:hover {
        background-color: #616a6b;
    }

    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #f9f9f9;
        padding: 15px;
        border-left: 4px solid #1a5276;
        margin-bottom: 20px;
        font-size: 1.05em;
    }
    .prompt {
        font-weight: bold;
        margin-bottom: 15px;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 10px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #f0f3f4;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #d5dbdb;
    }
    .options label:hover {
        background: #e5e8e8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }
    .options input {
        margin-right: 15px;
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 4px;
        display: none;
        border-left: 4px solid;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #1e8449;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #c0392b;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #eee;
        padding-top: 20px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #1a5276;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #154360; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    .check-btn { background-color: #d35400; }
    .check-btn:hover { background-color: #a04000; }
    .check-btn:disabled { background-color: #e59866; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #1e8449; }
    
    #results {
        display: none;
        text-align: center;
        padding: 20px;
        background: #eafaf1;
        border: 2px solid #2ecc71;
        border-radius: 8px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        color: #7f8c8d;
    }

    #univ-reward {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #fff;
        border: 3px double #a51c30;
        border-radius: 8px;
        animation: pullUp 0.5s ease-out;
    }
    #univ-reward img {
        width: 160px;
        height: auto;
        margin: 15px auto;
        display: block;
    }
    .univ-text {
        font-family: Georgia, serif;
        font-size: 1.4em;
        font-weight: bold;
        letter-spacing: 1px;
    }

    #print-blank-container {
        display: none;
    }

    @keyframes pullUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* Printer Friendly Styles */
    @media print {
        body { background-color: white; padding: 0; }
        
        #quiz-container { box-shadow: none; max-width: 100%; border: none; padding: 0; }
        .question-block { 
            display: block !important; 
            page-break-inside: avoid; 
            border-bottom: 1px solid #ccc; 
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .nav-buttons, .check-btn, .progress-tracker, button, .print-blank-btn { display: none !important; }
        .options label { border: none; padding: 5px 0; background: transparent; }
        .options input { appearance: auto; } 

        #univ-reward {
            display: block !important;
            border-style: solid !important;
            border-width: 2px !important;
        }

        /* Override for Blank Print Mode */
        body.print-blank-mode #quiz-container { display: none !important; }
        body.print-blank-mode #print-blank-container { display: block !important; }
    }

    @media screen and (max-width: 600px) {
        .print-blank-btn {
            position: relative;
            top: 0;
            right: 0;
            display: block;
            margin: 0 auto 20px auto;
        }
    }
</style>
</head>
<body>

<div id="quiz-container">
    <button class="print-blank-btn" onclick="printBlankQuiz()">🖨️ Print Blank Quiz</button>
    <h1>SAT Reading Practice - Set 9-12c</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>Quiz Complete</h2>
        <p id="score-display" style="font-size: 1.5em; font-weight: bold;"></p>
        <p>Review your answers and explanations below.</p>
        
        <div id="univ-reward">
            <div class="univ-text" id="univ-reward-title">★ FLAWLESS ACADEMIC EXCELLENCE ★</div>
            <img id="univ-reward-img" src="" alt="University Crest">
            <p id="univ-reward-text" style="color: #555; font-style: italic; font-weight: bold; margin-top: 5px;"></p>
        </div>

        <button onclick="window.print()" style="margin-top: 15px;">🖨️ Print Results</button>
    </div>

    <div id="questions-wrapper">
        <!-- Questions injected here -->
    </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit for Review</button>
    </div>
</div>

<div id="print-blank-container"></div>

<script>
    const universityRewards = [
        {
            name: "Harvard University",
            img: "https://mr-chen-k12.github.io/math/IMG_0232.png",
            color: "#a51c30"
        },
        {
            name: "Boston University",
            img: "https://mr-chen-k12.github.io/books/IMG_0121.png",
            color: "#CC0000"
        },
        {
            name: "Yale University",
            img: "https://mr-chen-k12.github.io/books/IMG_0122.png",
            color: "#00356B"
        }
    ];

    const quizData = [
        {
            passage: "While many early critics dismissed the composer's late symphonies as erratic and disorganized, modern musicologists view these works as remarkably _______, possessing an intricate thematic unity that becomes clear only upon repeated listening.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["coherent", "derivative", "superfluous", "ephemeral"],
            correctAnswer: 0, // A
            explanation: "'Coherent' means logical, consistent, and forming a unified whole. The text contrasts early views of the works as 'erratic and disorganized' with the modern understanding of their 'intricate thematic unity'."
        },
        {
            passage: "Deep-sea hydrothermal vents release superheated mineral-rich fluids into the ocean floor, creating extreme environments once thought incompatible with life. However, microbiologists discovered extremophilic archaea that thrive near these vents by utilizing chemosynthesis, converting toxic sulfur compounds into chemical energy. These organisms form the foundation of unique food webs independent of solar energy. Furthermore, studying these extremophiles provides valuable insights into how life might evolve on icy ocean moons like Europa or Enceladus. Consequently, deep-sea chemosynthetic organisms expand our understanding of both terrestrial biology and astrobiology.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Solar energy is necessary for deep-sea hydrothermal organisms to synthesize toxic compounds into nutrients.",
                "Deep-sea extremophiles demonstrate that life can thrive without sunlight, broadening insights into biology and extraterrestrial life.",
                "Hydrothermal vents pose an unprecedented threat to ocean biodiversity due to their superheated fluid emissions.",
                "Europa and Enceladus are the primary sources of extremophilic archaea found in Earth's ocean trenches."
            ],
            correctAnswer: 1, // B
            explanation: "The passage explains how extremophiles thrive via chemosynthesis without sunlight and notes their relevance to terrestrial biology and astrobiology. Option B accurately summarizes this main point."
        },
        {
            passage: "Ornithologists studying migratory bird routes noted that nocturnal migrants rely on Earth's geomagnetic field for orientation. When researchers exposed captive songbirds to artificial electromagnetic noise mimicking urban environments, the birds' magnetic orientation abilities were severely disrupted, causing them to disorient and attempt flight in random directions. In contrast, when the artificial noise was shielded, the songbirds immediately oriented along their natural migratory axis. This experimental outcome suggests that urban electromagnetic pollution _______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "permanently destroys songbirds' visual navigation skills even in daylight conditions.",
                "can interfere with migratory songbirds' geomagnetic navigation mechanisms.",
                "encourages songbirds to establish permanent breeding colonies within city centers.",
                "affects songbirds only when ambient outdoor temperatures fall below freezing."
            ],
            correctAnswer: 1, // B
            explanation: "Because artificial electromagnetic noise disrupted magnetic orientation while shielding restored natural orientation, urban electromagnetic pollution can interfere with songbirds' geomagnetic navigation mechanisms."
        },
        {
            passage: "In her 2020 monograph, historian Dr. Camille Laurent reexamined the impact of the printing press on literacy in early modern Europe. <b>Specifically, Laurent analyzed parish registry signatures from rural French villages between 1550 and 1650 to demonstrate that literacy rates remained under 15% for over a century after Gutenberg's invention.</b> This empirical finding challenged traditional narratives that attributed an immediate, widespread rise in public literacy directly to the advent of movable type.",
            prompt: "Which choice best describes the function of the highlighted sentence in the overall structure of the text?",
            options: [
                "It provides specific historical data from Laurent's study that supports her challenge to traditional assumptions about early literacy.",
                "It outlines a proposal for modern educational reforms in rural primary schools.",
                "It compares the cost of printing books in France with that in neighboring European countries.",
                "It details Gutenberg's personal biography and mechanical engineering background."
            ],
            correctAnswer: 0, // A
            explanation: "The highlighted sentence provides specific empirical evidence (parish registry signatures showing literacy under 15%) to support Laurent's challenge against the traditional narrative of immediate widespread literacy."
        },
        {
            passage: "Text 1\nDirect air capture (DAC) technologies represent a transformative tool in combating climate change. By mechanically extracting carbon dioxide directly from ambient air, DAC facilities can offset emissions from hard-to-abate sectors like aviation and heavy industry, offering a scalable path toward net-zero targets.\n\nText 2\nWhile direct air capture is technologically feasible, its current energy demands are immense. Powering large-scale DAC plants requires vast quantities of clean energy that could otherwise directly replace fossil fuels on the electrical grid. Without massive expansions in renewable energy capacity, scaling DAC risks consuming scarce clean power without achieving net carbon reductions.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to Text 1's claims about DAC scalability?",
            options: [
                "By arguing that DAC scalability is limited by immense energy requirements that could divert clean power from existing grid needs.",
                "By asserting that mechanical carbon extraction is chemically impossible regardless of energy supply.",
                "By agreeing that DAC facilities are already fully operational and cost-effective across all major industrial sectors.",
                "By suggesting that aviation emissions have no measurable impact on global carbon levels."
            ],
            correctAnswer: 0, // A
            explanation: "Text 2 highlights that scaling DAC requires immense clean energy that might divert power from grid decarbonization, serving as a direct counterpoint to Text 1's optimism about scalability."
        },
        {
            passage: "Linguist Dr. Ethan Miller argues that digital archiving projects preserving endangered languages are most successful when indigenous community members are actively involved as co-designers rather than merely passive informants.",
            prompt: "Which quotation from a socio-linguistic journal best supports Dr. Miller's argument?",
            options: [
                "\"Language revitalization programs co-created with native speakers achieved an 80% higher community adoption rate than archives created solely by outside researchers.\"",
                "\"Over 3,000 languages currently spoken worldwide are classified by linguists as endangered or vulnerable.\"",
                "\"Digital audio recorders allow linguists to store thousands of hours of high-fidelity acoustic data in cloud repositories.\"",
                "\"Grammatical structures vary significantly between language families across different continental regions.\""
            ],
            correctAnswer: 0, // A
            explanation: "Option A directly measures the success (80% higher adoption rate) of programs co-created with native speakers versus those created solely by outside researchers, supporting Dr. Miller's thesis."
        },
        {
            passage: "The archivist approached the delicate 17th-century manuscript with _______ care, wearing lint-free cotton gloves and using specialized humidity controls to ensure the fragile parchment sustained no damage during examination.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["meticulous", "haphazard", "cursory", "perfunctory"],
            correctAnswer: 0, // A
            explanation: "'Meticulous' means showing great attention to detail; very careful and precise. Wearing gloves and controlling humidity to protect fragile parchment exemplifies meticulous care."
        },
        {
            passage: "Astrophysicists analyzing light curves from transiting exoplanet HD 209458b observed subtle absorption lines corresponding to atomic sodium and hydrogen in the planet's upper atmosphere. As stellar light passes through the exoplanet's atmospheric fringe during a transit, specific wavelengths are absorbed by gaseous elements, creating a chemical fingerprint. Because hydrogen absorption extended far beyond the planet's predicted gravitational boundary, researchers deduced that atmospheric gases are continuously escaping into space. This phenomenon indicates that HD 209458b is _______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "slowly losing its upper atmosphere due to extreme thermal expansion and stellar radiation.",
                "increasing in mass and atmospheric density over time.",
                "composed entirely of solid iron and silicate rock with no surrounding gaseous envelope.",
                "shielded from stellar radiation by a dense, permanent ice layer."
            ],
            correctAnswer: 0, // A
            explanation: "Because hydrogen gas was detected escaping beyond the planet's gravitational boundary into space, the exoplanet must be gradually losing its upper atmosphere."
        },
        {
            passage: "Neuroscientists investigating memory consolidation found that slow-wave sleep plays a pivotal role in transferring short-term memories from the hippocampus to long-term storage in the neocortex. In experimental trials, participants who were permitted a full night of sleep following a spatial navigation task demonstrated a 35% improvement in recall speed compared to participants who were sleep-deprived. Brain imaging confirmed synchronized neural firing between the hippocampus and neocortex specifically during slow-wave sleep cycles. Consequently, adequate sleep is essential for optimizing long-term memory retention and learning efficiency.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Spatial navigation skills are determined primarily by genetic factors rather than sleep quality.",
                "Slow-wave sleep facilitates memory consolidation, making adequate sleep critical for learning and long-term retention.",
                "Short-term memories remain permanently stored in the hippocampus without ever transferring to other brain regions.",
                "Sleep deprivation enhances prefrontal cortex activity during complex spatial memory tests."
            ],
            correctAnswer: 1, // B
            explanation: "The passage explains how slow-wave sleep transfers short-term memories from the hippocampus to the neocortex and concludes that sleep is essential for memory retention and learning efficiency."
        },
        {
            passage: "Despite being faced with an unexpectedly complex dataset and numerous software glitches, the lead analyst remained _______, systematically debugging each algorithm until the financial forecast was completely validated.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["tenacious", "vacillating", "complacent", "apathetic"],
            correctAnswer: 0, // A
            explanation: "'Tenacious' means persistent, determined, and adhering firmly to a purpose. Systematically working through complex data glitches until validation shows a tenacious attitude."
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        // Build Interactive Web Quiz
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        // Build Hidden "Blank Print" Version
        let printHTML = '<h1 style="text-align: center; color: #1a5276; margin-bottom: 5px;">SAT Reading Practice - Set 9-12c</h1><h3 style="text-align: center; margin-top: 0; margin-bottom: 30px; color: #555;">Blank Copy</h3><hr style="margin-bottom:30px; border: 0; border-top: 1px solid #ccc;">';
        
        quizData.forEach((q, index) => {
            let printOptionsHTML = '';
            q.options.forEach(opt => {
                printOptionsHTML += `
                    <li style="margin-bottom: 12px; display: flex; align-items: baseline;">
                        <div style="display:inline-block; width:14px; height:14px; border:2px solid #555; border-radius:50%; margin-right:12px; position:relative; top: 2px; flex-shrink: 0;"></div>
                        <span>${opt}</span>
                    </li>
                `;
            });
            
            printHTML += `
                <div style="margin-bottom: 45px; page-break-inside: avoid;">
                    <p style="font-weight: bold; font-size: 1.1em; color: #333;">Question ${index + 1}</p>
                    <div style="font-family: Georgia, serif; padding: 15px; background-color: #f9f9f9; border-left: 4px solid #ccc; margin-bottom: 15px;">${q.passage}</div>
                    <p style="font-weight: bold; margin-bottom: 15px;">${q.prompt}</p>
                    <ul style="list-style-type: none; padding: 0;">${printOptionsHTML}</ul>
                </div>
            `;
        });
        document.getElementById('print-blank-container').innerHTML = printHTML;

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please select an answer before checking.";
            feedbackDiv.className = "feedback warning";
            return;
        }

        isLocked[currentQuestion] = true;
        
        const radios = document.getElementsByName(`q${currentQuestion}`);
        radios.forEach(r => r.disabled = true);
        q.options.forEach((_, optIndex) => {
            document.getElementById(`label-${currentQuestion}-${optIndex}`).classList.add('disabled');
        });

        updateNav();

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct!</strong><br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Checked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                const radios = document.getElementsByName(`q${index}`);
                radios.forEach(r => r.disabled = true);
                feedbackDiv.innerHTML = `<strong>Unanswered / Not Checked.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        document.querySelector('.print-blank-btn').style.display = 'none'; 
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `You scored ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)`;
        
        // Pick a random university crest reward on a perfect score (10/10)
        if (score === quizData.length) {
            const reward = universityRewards[Math.floor(Math.random() * universityRewards.length)];
            const rewardDiv = document.getElementById('univ-reward');
            const rewardTitle = document.getElementById('univ-reward-title');
            const rewardImg = document.getElementById('univ-reward-img');
            const rewardText = document.getElementById('univ-reward-text');
            
            rewardDiv.style.borderColor = reward.color;
            rewardTitle.style.color = reward.color;
            rewardImg.src = reward.img;
            rewardImg.alt = reward.name + " Crest";
            rewardText.textContent = `You have successfully earned the ${reward.name} verification crest for achieving a perfect 10/10 score.`;
            
            rewardDiv.style.display = 'block';
        }
        
        window.scrollTo(0, 0);
    }

    function printBlankQuiz() {
        document.body.classList.add('print-blank-mode');
        window.print();
        document.body.classList.remove('print-blank-mode');
    }

    window.onload = initQuiz;
</script>

</body>
</html>
