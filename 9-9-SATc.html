<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT Reading Practice - Set 9-9-SATc</title>
<style>
    /* General Styles */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        position: relative;
    }
    h1 {
        text-align: center;
        color: #1a5276;
    }
    
    .print-blank-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        background-color: #7f8c8d;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 4px;
        color: white;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
    }
    .print-blank-btn:hover {
        background-color: #616a6b;
    }

    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #f9f9f9;
        padding: 15px;
        border-left: 4px solid #1a5276;
        margin-bottom: 20px;
        font-size: 1.05em;
    }
    .prompt {
        font-weight: bold;
        margin-bottom: 15px;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 10px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #f0f3f4;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #d5dbdb;
    }
    .options label:hover {
        background: #e5e8e8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }
    .options input {
        margin-right: 15px;
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 4px;
        display: none;
        border-left: 4px solid;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #1e8449;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #c0392b;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #eee;
        padding-top: 20px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #1a5276;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #154360; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    .check-btn { background-color: #d35400; }
    .check-btn:hover { background-color: #a04000; }
    .check-btn:disabled { background-color: #e59866; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #1e8449; }
    
    #results {
        display: none;
        text-align: center;
        padding: 20px;
        background: #eafaf1;
        border: 2px solid #2ecc71;
        border-radius: 8px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        color: #7f8c8d;
    }

    #harvard-reward {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #fff;
        border: 3px double #a51c30;
        border-radius: 8px;
        animation: pullUp 0.5s ease-out;
    }
    #harvard-reward img {
        width: 160px;
        height: auto;
        margin: 15px auto;
        display: block;
    }
    .harvard-text {
        color: #a51c30;
        font-family: Georgia, serif;
        font-size: 1.4em;
        font-weight: bold;
        letter-spacing: 1px;
    }

    #print-blank-container {
        display: none;
    }

    @keyframes pullUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* Printer Friendly Styles */
    @media print {
        body { background-color: white; padding: 0; }
        
        #quiz-container { box-shadow: none; max-width: 100%; border: none; padding: 0; }
        .question-block { 
            display: block !important; 
            page-break-inside: avoid; 
            border-bottom: 1px solid #ccc; 
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .nav-buttons, .check-btn, .progress-tracker, button, .print-blank-btn { display: none !important; }
        .options label { border: none; padding: 5px 0; background: transparent; }
        .options input { appearance: auto; } 

        #harvard-reward {
            display: block !important;
            border: 2px solid #a51c30 !important;
        }

        /* Override for Blank Print Mode */
        body.print-blank-mode #quiz-container { display: none !important; }
        body.print-blank-mode #print-blank-container { display: block !important; }
    }

    @media screen and (max-width: 600px) {
        .print-blank-btn {
            position: relative;
            top: 0;
            right: 0;
            display: block;
            margin: 0 auto 20px auto;
        }
    }
</style>
</head>
<body>

<div id="quiz-container">
    <button class="print-blank-btn" onclick="printBlankQuiz()">🖨️ Print Blank Quiz</button>
    <h1>SAT Reading Practice - Set 9-9-SATc</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>Quiz Complete</h2>
        <p id="score-display" style="font-size: 1.5em; font-weight: bold;"></p>
        <p>Review your answers and explanations below.</p>
        
        <div id="harvard-reward">
            <div class="harvard-text">★ FLAWLESS ACADEMIC EXCELLENCE ★</div>
            <img src="https://mr-chen-k12.github.io/math/IMG_0232.png" alt="Harvard University Crest">
            <p style="color: #555; font-style: italic; font-weight: bold; margin-top: 5px;">You have successfully earned the Harvard University verification crest for achieving a perfect 10/10 score.</p>
        </div>

        <button onclick="window.print()" style="margin-top: 15px;">🖨️ Print Results</button>
    </div>

    <div id="questions-wrapper">
        <!-- Questions injected here -->
    </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit for Review</button>
    </div>
</div>

<div id="print-blank-container"></div>

<script>
    const quizData = [
        {
            passage: "While many literary critics anticipated that the author's new novel would be a dramatic departure from her previous work, it in fact represented a _______ continuation of her signature themes of social alienation and urban decay.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["seamless", "precarious", "superfluous", "sporadic"],
            correctAnswer: 0, // Index 0 = A
            explanation: "'Seamless' means smooth and continuous without awkward transitions. The sentence contrasts expectations of a 'dramatic departure' with what was actually a smooth continuation of previous themes."
        },
        {
            passage: "Urban heat islands occur when dense metropolitan areas replace natural land cover with pavement, buildings, and other heat-absorbing surfaces. Recent microclimate studies in Atlanta showed that planting urban canopy trees along high-density residential corridors reduced localized surface temperatures by up to 5°C. Furthermore, these tree corridors decreased summer cooling energy demands for adjacent homes by 18%. Consequently, expanding urban tree canopies serves as a highly practical mitigation strategy for urban heat islands.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Atlanta is the only major American city experiencing severe urban heat island effects.",
                "Expanding urban tree canopies is an effective strategy for lowering city temperatures and reducing household cooling demands.",
                "Pavement and building materials can be engineered to reflect 100% of incoming solar radiation.",
                "Residential air conditioning usage is the primary driver of global atmospheric temperature increases."
            ],
            correctAnswer: 1, // Index 1 = B
            explanation: "The passage defines urban heat islands, provides data on how tree canopies lower local temperatures and cooling energy demands in Atlanta, and concludes that expanding tree canopies is a practical mitigation strategy. Option B captures this main idea accurately."
        },
        {
            passage: "Marine biologists tracking whale shark populations noted that these filter-feeding giants migrate thousands of miles along predictable ocean currents to reach nutrient-rich upwelling zones. However, satellite tracking data revealed that when localized sea surface temperatures exceeded historical averages by more than 2°C, whale sharks altered their traditional migration paths, swimming toward deeper, cooler waters where plankton density was considerably lower. This behavioral shift suggests that for whale sharks, _______",
            prompt: "Which choice most logically completes the text?",
            options: [
                "thermoregulation needs may take precedence over foraging efficiency during heat anomalies.",
                "plankton availability increases exponentially as water depth and hydrostatic pressure increase.",
                "long-distance ocean navigation is controlled entirely by magnetic field fluctuations rather than temperature.",
                "deep-water habitats offer significantly higher overall nutrient concentrations than surface upwellings."
            ],
            correctAnswer: 0, // Index 0 = A
            explanation: "Because whale sharks moved away from high-plankton areas to cooler waters when temperatures rose, they prioritized regulating their temperature (thermoregulation) over maximizing their food intake (foraging efficiency)."
        },
        {
            passage: "In her landmark 1977 monograph, art historian Linda Nochlin analyzed the institutional barriers that historically restricted women's access to formal artistic training. <b>Specifically, Nochlin pointed to 19th-century academy rules that barred female students from attending life-drawing classes featuring nude models, a core requirement for mastering historical portraiture.</b> By exposing these structural impediments, Nochlin demonstrated that the scarcity of recognized female Old Masters was caused by social restrictions rather than a lack of innate talent.",
            prompt: "Which choice best describes the function of the highlighted sentence in the overall structure of the text?",
            options: [
                "It provides a concrete example of an institutional barrier that restricted women's formal art education.",
                "It argues that 19th-century academy rules were established primarily to protect student privacy.",
                "It compares the artistic techniques of historical portraiture to those of modern abstract painting.",
                "It summarizes Nochlin’s critics who claimed female artists lacked technical skill."
            ],
            correctAnswer: 0, // Index 0 = A
            explanation: "The highlighted sentence specifies a concrete example (academy rules banning female students from life-drawing classes) of the general 'institutional barriers' introduced in the preceding sentence."
        },
        {
            passage: "Text 1\nRestoring apex predators to degraded ecosystems triggers 'trophic cascades' that restore natural ecological balance. When wolves were reintroduced to Yellowstone National Park, they controlled elk populations, allowing overgrazed riverbanks to regenerate. This vegetation recovery stabilized soil erosion and provided habitats for songbirds, beavers, and fish species.\n\nText 2\nWhile reintroducing top predators can produce positive ecological effects in controlled reserves, applying trophic cascade theory to managed agricultural landscapes is fraught with conflict. Predators often prey on livestock rather than target species, causing significant economic hardship for local farming communities. Without robust compensation frameworks and community support, top-predator reintroduction programs frequently fail due to social backlash.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to the optimism expressed in Text 1 regarding predator reintroduction?",
            options: [
                "By agreeing that predator reintroduction produces identical ecological and economic benefits in all geographic settings.",
                "By pointing out that predator reintroduction in human-managed landscapes creates economic challenges and social conflict not addressed in Text 1.",
                "By asserting that apex predators prefer preying on livestock even when wild prey populations are abundant in national parks.",
                "By arguing that trophic cascade theory has been completely disproved by modern ecological studies."
            ],
            correctAnswer: 1, // Index 1 = B
            explanation: "Text 2 emphasizes that outside of controlled reserves, reintroducing top predators causes livestock predation, economic hardship, and social backlash in human-managed landscapes—aspects that Text 1 does not consider."
        },
        {
            passage: "Cognitive psychologist Dr. Aris Thorne hypothesizes that engaging in regular physical exercise enhances executive function in older adults by increasing cerebral blood flow and stimulating neurogenesis in the hippocampus.",
            prompt: "Which quotation from a clinical study best supports Dr. Thorne's hypothesis?",
            options: [
                "\"Participants who completed a six-month aerobic walking program showed significant increases in hippocampal volume and marked improvements on working memory tests compared to the sedentary control group.\"",
                "\"Survey data indicates that 45% of adults over age 65 prefer outdoor walking to indoor resistance training.\"",
                "\"Cognitive decline remains a widespread concern among aging populations across all socioeconomic demographics.\"",
                "\"High-intensity weightlifting requires specialized equipment and trained personnel to prevent joint injuries.\""
            ],
            correctAnswer: 0, // Index 0 = A
            explanation: "Option A provides direct empirical evidence showing that aerobic exercise led to increased hippocampal volume (indicating neurogenesis) and improved working memory (an executive function skill), directly supporting Dr. Thorne's hypothesis."
        },
        {
            passage: "Far from being an unpredictable or _______ event, the river's seasonal flooding followed a precise astronomical cycle that ancient Egyptian farmers relied upon to deposit nutrient-rich silt onto their agricultural fields.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["erratic", "inevitable", "ubiquitous", "meticulous"],
            correctAnswer: 0, // Index 0 = A
            explanation: "'Erratic' means unpredictable, irregular, or inconsistent. The sentence contrasts 'unpredictable or erratic' with an event that 'followed a precise astronomical cycle'."
        },
        {
            passage: "Material scientists studying spider silk have long sought to replicate its remarkable combination of high tensile strength and elasticity. Synthetic polymers usually sacrifice elasticity when engineered for high strength, or vice versa. By analyzing the molecular hierarchy of orb-weaver silk, researchers discovered that beta-sheet nanocrystals give the fiber strength, while unordered protein coils provide flexibility. When synthetic chemists synthesized a hybrid polymer incorporating both crystalline regions and flexible protein chains, the resulting fiber exhibited mechanical properties matching natural silk. This success indicates that synthetic material design ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "should abandon synthetic polymers entirely in favor of harvesting wild spider webs.",
                "can overcome traditional trade-offs between strength and flexibility by mimicking natural protein microstructures.",
                "relies exclusively on increasing manufacturing temperatures to maximize fiber density.",
                "produces materials that are inherently less durable than standard petroleum-based plastics."
            ],
            correctAnswer: 1, // Index 1 = B
            explanation: "The passage describes how scientists overcame the traditional trade-off between strength and elasticity by mimicking spider silk's molecular architecture (combining crystalline regions and flexible protein chains)."
        },
        {
            passage: "For centuries, cartographers relied on hand-drawn surveys and traveler accounts, resulting in maps that frequently exaggerated landmasses or omitted entire geographic features. The advent of satellite remote sensing in the late twentieth century transformed cartography from an interpretive art into an exact quantitative science. Modern satellite constellations continuously capture high-resolution multispectral imagery of Earth's surface, allowing geographers to track deforestation, monitor urban expansion, and map remote topography with millimeter accuracy.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Satellite technology has revolutionized cartography by enabling precise, real-time geographic mapping and environmental monitoring.",
                "Historical maps drawn before the twentieth century are completely lacking in artistic or historical value.",
                "Satellite remote sensing is primarily used to measure ocean depth near continental shelves.",
                "Modern cartographers still rely heavily on hand-drawn traveler accounts to verify satellite data."
            ],
            correctAnswer: 0, // Index 0 = A
            explanation: "The passage contrasts imprecise, historical hand-drawn mapping with satellite remote sensing, highlighting how satellite technology transformed cartography into a precise, quantitative science. Option A best summarizes this point."
        },
        {
            passage: "Despite facing relentless criticism from traditionalists in the physics department, the young researcher remained _______ in his commitment to quantum field research, ultimately publishing groundbreaking evidence that validated his controversial theory.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["steadfast", "capricious", "reticent", "tentative"],
            correctAnswer: 0, // Index 0 = A
            explanation: "'Steadfast' means resolutely firm and unwavering. Staying committed to research despite relentless criticism demonstrates a steadfast attitude."
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        // Build Interactive Web Quiz
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        // Build Hidden "Blank Print" Version
        let printHTML = '<h1 style="text-align: center; color: #1a5276; margin-bottom: 5px;">SAT Reading Practice - Set 9-9-SATc</h1><h3 style="text-align: center; margin-top: 0; margin-bottom: 30px; color: #555;">Blank Copy</h3><hr style="margin-bottom:30px; border: 0; border-top: 1px solid #ccc;">';
        
        quizData.forEach((q, index) => {
            let printOptionsHTML = '';
            q.options.forEach(opt => {
                printOptionsHTML += `
                    <li style="margin-bottom: 12px; display: flex; align-items: baseline;">
                        <div style="display:inline-block; width:14px; height:14px; border:2px solid #555; border-radius:50%; margin-right:12px; position:relative; top: 2px; flex-shrink: 0;"></div>
                        <span>${opt}</span>
                    </li>
                `;
            });
            
            printHTML += `
                <div style="margin-bottom: 45px; page-break-inside: avoid;">
                    <p style="font-weight: bold; font-size: 1.1em; color: #333;">Question ${index + 1}</p>
                    <div style="font-family: Georgia, serif; padding: 15px; background-color: #f9f9f9; border-left: 4px solid #ccc; margin-bottom: 15px;">${q.passage}</div>
                    <p style="font-weight: bold; margin-bottom: 15px;">${q.prompt}</p>
                    <ul style="list-style-type: none; padding: 0;">${printOptionsHTML}</ul>
                </div>
            `;
        });
        document.getElementById('print-blank-container').innerHTML = printHTML;

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please select an answer before checking.";
            feedbackDiv.className = "feedback warning";
            return;
        }

        isLocked[currentQuestion] = true;
        
        const radios = document.getElementsByName(`q${currentQuestion}`);
        radios.forEach(r => r.disabled = true);
        q.options.forEach((_, optIndex) => {
            document.getElementById(`label-${currentQuestion}-${optIndex}`).classList.add('disabled');
        });

        updateNav();

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct!</strong><br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Checked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                const radios = document.getElementsByName(`q${index}`);
                radios.forEach(r => r.disabled = true);
                feedbackDiv.innerHTML = `<strong>Unanswered / Not Checked.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        document.querySelector('.print-blank-btn').style.display = 'none'; 
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `You scored ${score} out of ${quizData.length} (${Math.round((score/quizData.length)*100)}%)`;
        
        if (score === quizData.length) {
            document.getElementById('harvard-reward').style.display = 'block';
        }
        
        window.scrollTo(0, 0);
    }

    function printBlankQuiz() {
        document.body.classList.add('print-blank-mode');
        window.print();
        document.body.classList.remove('print-blank-mode');
    }

    window.onload = initQuiz;
</script>

</body>
</html>
