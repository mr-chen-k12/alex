<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Practice Quiz</title>
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f7f6;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        #scoreboard {
            position: sticky;
            top: 0;
            background-color: #2c3e50;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            border-radius: 8px;
            margin-bottom: 30px;
            z-index: 100;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .section-title {
            background-color: #e2e8f0;
            padding: 10px;
            border-left: 5px solid #3182ce;
            margin-top: 40px;
            font-size: 20px;
        }
        .question-container {
            background-color: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .question-text {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 15px;
        }
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .option-btn {
            background-color: #edf2f7;
            border: 2px solid #cbd5e0;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
            text-align: left;
        }
        .option-btn:hover:not(.disabled) {
            background-color: #e2e8f0;
            border-color: #a0aec0;
        }
        .option-btn.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }
        .option-btn.correct {
            background-color: #c6f6d5;
            border-color: #48bb78;
            color: #22543d;
            font-weight: bold;
        }
        .option-btn.wrong {
            background-color: #fed7d7;
            border-color: #f56565;
            color: #742a2a;
        }
        .explanation {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background-color: #ebf8ff;
            border-left: 4px solid #4299e1;
            border-radius: 4px;
        }
        .result-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .badge-correct { background-color: #48bb78; color: white; }
        .badge-wrong { background-color: #f56565; color: white; }
        
        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <h1>Targeted Math Practice</h1>
    <div id="scoreboard">Score: <span id="score">0</span> / 21</div>

    <div id="quiz-container"></div>

    <script>
        const quizData = [
            // --- Based on Problem 2 (Averages) ---
            {
                section: "Skill 1: Averages and Sums (Similar to Problem 2)",
                text: "The average weight of four dogs is 30 pounds. If three of the dogs weigh 25, 32, and 28 pounds, what is the weight of the fourth dog?",
                options: [
                    { text: "35 pounds", correct: true },
                    { text: "30 pounds", correct: false },
                    { text: "40 pounds", correct: false },
                    { text: "25 pounds", correct: false }
                ],
                explanation: "First, find the total sum of their weights: 4 dogs &times; 30 lbs = 120 lbs. Next, sum the weights of the three known dogs: 25 + 32 + 28 = 85 lbs. Finally, subtract the known sum from the total: 120 - 85 = 35 lbs."
            },
            {
                text: "The average score of five students on a math test is 82. What is the sum of all their scores?",
                options: [
                    { text: "420", correct: false },
                    { text: "410", correct: true },
                    { text: "390", correct: false },
                    { text: "400", correct: false }
                ],
                explanation: "To find the sum of all the scores, multiply the average score by the number of students: 82 &times; 5 = 410."
            },
            {
                text: "The average height of three trees is 15 feet. If two of the trees are 12 feet and 14 feet tall, how tall is the third tree?",
                options: [
                    { text: "16 feet", correct: false },
                    { text: "17 feet", correct: false },
                    { text: "19 feet", correct: true },
                    { text: "20 feet", correct: false }
                ],
                explanation: "Total height of all three trees = 3 &times; 15 = 45 feet. Height of the two known trees = 12 + 14 = 26 feet. The third tree's height is 45 - 26 = 19 feet."
            },

            // --- Based on Problem 3 (Perimeter/Area & Unit Conversion) ---
            {
                section: "Skill 2: Shapes and Unit Conversion (Similar to Problem 3)",
                text: "A piece of wire 2 feet long is bent into the shape of a square. What is the area of the square in square inches?",
                options: [
                    { text: "24 square inches", correct: false },
                    { text: "36 square inches", correct: true },
                    { text: "144 square inches", correct: false },
                    { text: "48 square inches", correct: false }
                ],
                explanation: "First, convert feet to inches: 2 feet = 24 inches. This is the perimeter. Since a square has 4 equal sides, each side is 24 &divide; 4 = 6 inches. The area is side &times; side: 6 &times; 6 = 36 square inches."
            },
            {
                text: "A ribbon 1 meter (100 cm) long is formed into the shape of a square. How long is each side of the square in centimeters?",
                options: [
                    { text: "20 cm", correct: false },
                    { text: "25 cm", correct: true },
                    { text: "50 cm", correct: false },
                    { text: "10 cm", correct: false }
                ],
                explanation: "The total length of the ribbon is the perimeter of the square (100 cm). Divide the perimeter by 4 to find the length of one side: 100 &divide; 4 = 25 cm."
            },
            {
                text: "A string 2 yards long is shaped into an equilateral triangle. How many inches long is each side of the triangle?",
                options: [
                    { text: "36 inches", correct: false },
                    { text: "12 inches", correct: false },
                    { text: "24 inches", correct: true },
                    { text: "48 inches", correct: false }
                ],
                explanation: "Convert yards to inches: 1 yard = 36 inches, so 2 yards = 72 inches. An equilateral triangle has 3 equal sides. Divide the total length by 3: 72 &divide; 3 = 24 inches."
            },

            // --- Based on Problem 4 (Proportions) ---
            {
                section: "Skill 3: Proportions (Similar to Problem 4)",
                text: "Complete this proportion: Seven is to two as twenty-one is to what number?",
                options: [
                    { text: "6", correct: true },
                    { text: "8", correct: false },
                    { text: "14", correct: false },
                    { text: "12", correct: false }
                ],
                explanation: "Set up the proportion: \\(\\frac{7}{2} = \\frac{21}{x}\\). Since 7 &times; 3 = 21, multiply the denominator by 3 as well: 2 &times; 3 = 6. So, x = 6."
            },
            {
                text: "Complete this proportion: Four is to nine as what number is to forty-five?",
                options: [
                    { text: "16", correct: false },
                    { text: "25", correct: false },
                    { text: "20", correct: true },
                    { text: "36", correct: false }
                ],
                explanation: "Set up the proportion: \\(\\frac{4}{9} = \\frac{x}{45}\\). The denominator was multiplied by 5 (9 &times; 5 = 45). Multiply the numerator by 5 as well: 4 &times; 5 = 20."
            },
            {
                text: "Complete this proportion: Eight is to five as forty is to what number?",
                options: [
                    { text: "20", correct: false },
                    { text: "25", correct: true },
                    { text: "30", correct: false },
                    { text: "35", correct: false }
                ],
                explanation: "Set up the proportion: \\(\\frac{8}{5} = \\frac{40}{x}\\). The numerator was multiplied by 5 (8 &times; 5 = 40). Multiply the denominator by 5 as well: 5 &times; 5 = 25."
            },

            // --- Based on Problem 7 (Order of Operations) ---
            {
                section: "Skill 4: Order of Operations (Similar to Problem 7)",
                text: "Evaluate: \\(144 \\div 12^2 + 4 \\times (3^2 - \\sqrt{25})\\)",
                options: [
                    { text: "17", correct: true },
                    { text: "20", correct: false },
                    { text: "12", correct: false },
                    { text: "25", correct: false }
                ],
                explanation: "Follow PEMDAS. Inside parentheses: \\(3^2 = 9\\) and \\(\\sqrt{25} = 5\\), so \\(9 - 5 = 4\\). Exponents: \\(12^2 = 144\\). The equation becomes \\(144 \\div 144 + 4 \\times 4\\). Multiply/Divide: \\(1 + 16\\). Add: 17."
            },
            {
                text: "Evaluate: \\(50 \\div 5^2 + 2 \\times (4^2 - \\sqrt{64})\\)",
                options: [
                    { text: "16", correct: false },
                    { text: "20", correct: false },
                    { text: "18", correct: true },
                    { text: "24", correct: false }
                ],
                explanation: "PEMDAS. Parentheses first: \\(4^2 = 16\\) and \\(\\sqrt{64} = 8\\), so \\(16 - 8 = 8\\). Exponents: \\(5^2 = 25\\). Equation: \\(50 \\div 25 + 2 \\times 8\\). Multiply/Divide: \\(2 + 16\\). Add: 18."
            },
            {
                text: "Evaluate: \\(81 \\div 3^2 + 5 \\times (2^4 - \\sqrt{100})\\)",
                options: [
                    { text: "45", correct: false },
                    { text: "39", correct: true },
                    { text: "34", correct: false },
                    { text: "29", correct: false }
                ],
                explanation: "Parentheses: \\(2^4 = 16\\) and \\(\\sqrt{100} = 10\\), so \\(16 - 10 = 6\\). Exponents: \\(3^2 = 9\\). Equation: \\(81 \\div 9 + 5 \\times 6\\). Multiply/Divide: \\(9 + 30\\). Add: 39."
            },

            // --- Based on Problem 15 (Solving equations with mixed numbers) ---
            {
                section: "Skill 5: Solving Equations with Fractions (Similar to Problem 15)",
                text: "Find the unknown number: \\(x - 2\\frac{1}{2} = 5\\frac{3}{4}\\)",
                options: [
                    { text: "\\(8\\frac{1}{4}\\)", correct: true },
                    { text: "\\(7\\frac{1}{4}\\)", correct: false },
                    { text: "\\(8\\frac{1}{2}\\)", correct: false },
                    { text: "\\(3\\frac{1}{4}\\)", correct: false }
                ],
                explanation: "Add \\(2\\frac{1}{2}\\) to both sides: \\(x = 5\\frac{3}{4} + 2\\frac{1}{2}\\). Find a common denominator (4). \\(2\\frac{1}{2} = 2\\frac{2}{4}\\). Add: \\(5\\frac{3}{4} + 2\\frac{2}{4} = 7\\frac{5}{4}\\). Simplify: \\(7 + 1\\frac{1}{4} = 8\\frac{1}{4}\\)."
            },
            {
                text: "Find the unknown number: \\(y - 3\\frac{1}{3} = 4\\frac{1}{6}\\)",
                options: [
                    { text: "\\(7\\frac{2}{3}\\)", correct: false },
                    { text: "\\(7\\frac{1}{6}\\)", correct: false },
                    { text: "\\(7\\frac{1}{2}\\)", correct: true },
                    { text: "\\(8\\frac{1}{6}\\)", correct: false }
                ],
                explanation: "Add \\(3\\frac{1}{3}\\) to both sides: \\(y = 4\\frac{1}{6} + 3\\frac{1}{3}\\). Common denominator is 6. \\(3\\frac{1}{3} = 3\\frac{2}{6}\\). Add: \\(4\\frac{1}{6} + 3\\frac{2}{6} = 7\\frac{3}{6}\\). Simplify: \\(7\\frac{1}{2}\\)."
            },
            {
                text: "Find the unknown number: \\(m - 1\\frac{2}{5} = 6\\frac{7}{10}\\)",
                options: [
                    { text: "\\(7\\frac{9}{10}\\)", correct: false },
                    { text: "\\(8\\frac{1}{10}\\)", correct: true },
                    { text: "\\(8\\frac{1}{5}\\)", correct: false },
                    { text: "\\(5\\frac{3}{10}\\)", correct: false }
                ],
                explanation: "Add \\(1\\frac{2}{5}\\) to both sides. Common denominator is 10. \\(1\\frac{2}{5} = 1\\frac{4}{10}\\). Add: \\(6\\frac{7}{10} + 1\\frac{4}{10} = 7\\frac{11}{10}\\). Simplify: \\(7 + 1\\frac{1}{10} = 8\\frac{1}{10}\\)."
            },

            // --- Based on Problem 16 (Equivalent division by scaling) ---
            {
                section: "Skill 6: Equivalent Division Problems (Similar to Problem 16)",
                text: "Instead of dividing \\(7\\frac{1}{2}\\) by \\(2\\frac{1}{2}\\), Marcus doubled both numbers before dividing. What was his new division problem and quotient?",
                options: [
                    { text: "\\(14 \\div 4 = 3\\frac{1}{2}\\)", correct: false },
                    { text: "\\(15 \\div 5 = 3\\)", correct: true },
                    { text: "\\(15 \\div 4 = 3\\frac{3}{4}\\)", correct: false },
                    { text: "\\(14 \\div 5 = 2\\frac{4}{5}\\)", correct: false }
                ],
                explanation: "Double \\(7\\frac{1}{2}\\) (which is 7.5 &times; 2) to get 15. Double \\(2\\frac{1}{2}\\) (which is 2.5 &times; 2) to get 5. The new problem is 15 &divide; 5, and the quotient is 3."
            },
            {
                text: "Instead of dividing \\(12\\frac{1}{2}\\) by \\(2\\frac{1}{2}\\), Sarah doubled both numbers. What is the quotient of the new problem?",
                options: [
                    { text: "6", correct: false },
                    { text: "4", correct: false },
                    { text: "5", correct: true },
                    { text: "5.5", correct: false }
                ],
                explanation: "Double \\(12\\frac{1}{2}\\) to get 25. Double \\(2\\frac{1}{2}\\) to get 5. The new problem is 25 &divide; 5. The quotient is 5."
            },
            {
                text: "Instead of dividing \\(5\\frac{1}{4}\\) by \\(1\\frac{3}{4}\\), Leo multiplied both numbers by 4 before dividing. What was his new division problem and quotient?",
                options: [
                    { text: "\\(21 \\div 7 = 3\\)", correct: true },
                    { text: "\\(20 \\div 4 = 5\\)", correct: false },
                    { text: "\\(21 \\div 6 = 3.5\\)", correct: false },
                    { text: "\\(22 \\div 7 = 3.14\\)", correct: false }
                ],
                explanation: "Multiply \\(5\\frac{1}{4}\\) (which is 21/4) by 4 to get 21. Multiply \\(1\\frac{3}{4}\\) (which is 7/4) by 4 to get 7. The new problem is 21 &divide; 7, which equals 3."
            },

            // --- Based on Problem 17 (Circumference to Diameter Ratio) ---
            {
                section: "Skill 7: Circumference and Diameter (Similar to Problem 17)",
                text: "A circular rug has a circumference of about 44 feet and a diameter of about 14 feet. Find the approximate number of diameters in the circumference. Round to the nearest tenth.",
                options: [
                    { text: "3.2", correct: false },
                    { text: "3.0", correct: false },
                    { text: "3.1", correct: true },
                    { text: "2.9", correct: false }
                ],
                explanation: "Divide the circumference by the diameter: 44 &divide; 14 &approx; 3.1428... Rounding to the nearest tenth gives 3.1. (This is an approximation of Pi)."
            },
            {
                text: "A steering wheel has a circumference of about 47 inches and a diameter of about 15 inches. Find the approximate number of diameters in the circumference. Round to the nearest tenth.",
                options: [
                    { text: "3.1", correct: true },
                    { text: "3.2", correct: false },
                    { text: "3.3", correct: false },
                    { text: "3.0", correct: false }
                ],
                explanation: "Divide the circumference by the diameter: 47 &divide; 15 = 3.1333... The digit in the hundredths place is 3, so round down to 3.1."
            },
            {
                text: "A drum has a circumference of about 69 inches and a diameter of about 22 inches. Find the approximate number of diameters in the circumference. Round to the nearest tenth.",
                options: [
                    { text: "3.0", correct: false },
                    { text: "3.1", correct: true },
                    { text: "3.2", correct: false },
                    { text: "3.14", correct: false }
                ],
                explanation: "Divide the circumference by the diameter: 69 &divide; 22 &approx; 3.136... The hundredths digit is 3, so it rounds down to 3.1. (Note: The option 3.14 is rounded to the hundredths, not tenths)."
            }
        ];

        let currentScore = 0;
        const container = document.getElementById('quiz-container');
        const scoreDisplay = document.getElementById('score');

        // Function to render the quiz
        function buildQuiz() {
            let htmlContent = '';
            
            quizData.forEach((q, index) => {
                // Add section title if it exists
                if (q.section) {
                    htmlContent += `<h2 class="section-title">${q.section}</h2>`;
                }

                htmlContent += `
                    <div class="question-container" id="q-container-${index}">
                        <div class="question-text">${index + 1}. ${q.text}</div>
                        <div class="options-grid">
                `;

                // Shuffle options for randomness (optional, but good for practice)
                let shuffledOptions = [...q.options].sort(() => Math.random() - 0.5);

                shuffledOptions.forEach((opt, optIndex) => {
                    htmlContent += `
                        <button class="option-btn" 
                                onclick="checkAnswer(${index}, ${opt.correct}, this)" 
                                id="btn-${index}-${optIndex}">
                            ${opt.text}
                        </button>
                    `;
                });

                htmlContent += `
                        </div>
                        <div class="explanation" id="exp-${index}">
                            <div id="badge-${index}" class="result-badge"></div>
                            <p><strong>Explanation:</strong> ${q.explanation}</p>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = htmlContent;
        }

        // Function to handle answer checking
        function checkAnswer(questionIndex, isCorrect, clickedBtn) {
            const containerDiv = document.getElementById(`q-container-${questionIndex}`);
            const buttons = containerDiv.querySelectorAll('.option-btn');
            const explanationDiv = document.getElementById(`exp-${index}`);
            const badge = document.getElementById(`badge-${index}`);

            // Disable all buttons in this question
            buttons.forEach(btn => {
                btn.classList.add('disabled');
                btn.onclick = null; // Remove click event
            });

            // Mark the clicked button
            if (isCorrect) {
                clickedBtn.classList.add('correct');
                badge.textContent = "Correct!";
                badge.className = "result-badge badge-correct";
                currentScore++;
                scoreDisplay.textContent = currentScore;
            } else {
                clickedBtn.classList.add('wrong');
                badge.textContent = "Incorrect";
                badge.className = "result-badge badge-wrong";
                
                // Highlight the correct one so they know
                buttons.forEach(btn => {
                    // We need to find the correct button based on text since we shuffled
                    const originalOpt = quizData[questionIndex].options.find(o => o.text === btn.textContent.trim());
                    if (originalOpt && originalOpt.correct) {
                        btn.style.border = "2px solid #48bb78";
                        btn.style.backgroundColor = "#e6fffa";
                    }
                });
            }

            // Show explanation
            explanationDiv.style.display = "block";
            
            // Tell MathJax to process any new math in the explanation just in case
            MathJax.typesetPromise();
        }

        // Initialize Quiz
        buildQuiz();
    </script>
</body>
</html>
