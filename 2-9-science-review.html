<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Systems Study Cards</title>
    <style>
        :root {
            --primary: #4a90e2;
            --secondary: #50c878;
            --accent: #ff9f43;
            --bg: #f0f7ff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }

        h1 { color: var(--primary); margin-bottom: 10px; }

        .game-header {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
            background: white;
            padding: 15px 30px;
            border-radius: 50px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .score-box { font-weight: bold; font-size: 1.2rem; }
        #score { color: var(--secondary); }
        #wrong { color: #e74c3c; }

        .set-selector {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        button.set-btn {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background: white;
            border: 2px solid var(--primary);
            transition: 0.3s;
        }

        button.set-btn.active {
            background: var(--primary);
            color: white;
        }

        .card-container {
            perspective: 1000px;
            width: 350px;
            height: 250px;
            cursor: pointer;
        }

        .card {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border-radius: 15px;
        }

        .card.flipped { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 15px;
            font-size: 1.3rem;
            background: white;
            border: 4px solid var(--primary);
        }

        .card-back {
            background: #fffdf0;
            transform: rotateY(180deg);
            color: #2c3e50;
        }

        .controls {
            margin-top: 30px;
            display: flex;
            gap: 15px;
        }

        .btn-action {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-correct { background-color: var(--secondary); }
        .btn-wrong { background-color: #e74c3c; }
        .btn-next { background-color: var(--accent); }

        #review-list {
            margin-top: 40px;
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 20px;
            border-radius: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <h1>🌍 Earth Explorers Study Cards</h1>

    <div class="game-header">
        <div class="score-box">✅ Correct: <span id="score">0</span></div>
        <div class="score-box">❌ To Review: <span id="wrong">0</span></div>
    </div>

    <div class="set-selector">
        <button class="set-btn active" onclick="changeSet(0)">The 4 Spheres</button>
        <button class="set-btn" onclick="changeSet(1)">Processes & Rocks</button>
        <button class="set-btn" onclick="changeSet(2)">Water Wonders</button>
    </div>

    <div class="card-container" onclick="flipCard()">
        <div class="card" id="mainCard">
            <div class="card-front" id="frontText">Select a set to begin!</div>
            <div class="card-back" id="backText">The answer is here.</div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-action btn-wrong" onclick="markWrong()">I'm not sure / Wrong</button>
        <button class="btn-action btn-correct" onclick="markCorrect()">I got it right!</button>
        <button class="btn-action btn-next" onclick="nextCard()">Skip/Next</button>
    </div>

    <div id="review-list">
        <h3>📝 Cards to Study Again:</h3>
        <ul id="wrong-items"></ul>
    </div>

    <script>
        const cardSets = [
            [ // Set 1: The 4 Spheres
                { q: "What is the Geosphere?", a: "The sphere made of rocks, mountains, and the Earth's crust." },
                { q: "What is the Hydrosphere?", a: "All the water on Earth, found in oceans, lakes, and the air." },
                { q: "What is the Biosphere?", a: "The sphere made up of all living things on Earth." },
                { q: "What is the Atmosphere?", a: "The layer of air and gases surrounding the Earth." },
                { q: "Where is the Geosphere located relative to others?", a: "It is the solid foundation beneath the other spheres." }
            ],
            [ // Set 2: Processes & Rocks
                { q: "What is Weathering?", a: "The breaking down of rock into smaller pieces." },
                { q: "What is Erosion?", a: "The movement of sediment from its original location." },
                { q: "What is Deposition?", a: "When sediment is dropped in a new location." },
                { q: "What cycle does the Geosphere belong to?", a: "The Rock Cycle." },
                { q: "What is an Air Mass?", a: "A large volume of air with specific temperature and moisture." }
            ],
            [ // Set 3: Water Wonders
                { q: "Why is the ocean salty?", a: "Minerals and salts are washed from the land into the ocean over time." },
                { q: "What are Condensation and Evaporation?", a: "Opposites: Evaporation turns liquid to gas; Condensation turns gas to liquid." },
                { q: "What is a Reservoir?", a: "A large lake or area used to store water for human supply." },
                { q: "What is the Water Table?", a: "The upper level of underground water." },
                { q: "What interacts to shape the Grand Canyon?", a: "The Hydrosphere (River) and the Geosphere (Rock) through weathering/erosion." }
            ]
        ];

        let currentSetIndex = 0;
        let currentCardIndex = 0;
        let score = 0;
        let wrongCount = 0;
        let reviewItems = new Set();

        function changeSet(index) {
            currentSetIndex = index;
            currentCardIndex = 0;
            document.querySelectorAll('.set-btn').forEach((btn, i) => {
                btn.classList.toggle('active', i === index);
            });
            updateCard();
            resetCardFlip();
        }

        function flipCard() {
            document.getElementById('mainCard').classList.toggle('flipped');
        }

        function resetCardFlip() {
            document.getElementById('mainCard').classList.remove('flipped');
        }

        function updateCard() {
            const set = cardSets[currentSetIndex];
            document.getElementById('frontText').innerText = set[currentCardIndex].q;
            document.getElementById('backText').innerText = set[currentCardIndex].a;
        }

        function nextCard() {
            currentCardIndex = (currentCardIndex + 1) % cardSets[currentSetIndex].length;
            resetCardFlip();
            setTimeout(updateCard, 200);
        }

        function markCorrect() {
            score++;
            document.getElementById('score').innerText = score;
            nextCard();
        }

        function markWrong() {
            const card = cardSets[currentSetIndex][currentCardIndex];
            if (!reviewItems.has(card.q)) {
                reviewItems.add(card.q);
                wrongCount++;
                document.getElementById('wrong').innerText = wrongCount;
                
                const li = document.createElement('li');
                li.innerText = card.q;
                document.getElementById('wrong-items').appendChild(li);
                document.getElementById('review-list').style.display = 'block';
            }
            nextCard();
        }

        // Initialize first card
        updateCard();
    </script>
</body>
</html>
