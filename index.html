<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework Zone</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* --- FUN STYLING STARTS HERE --- */
        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Title Area */
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: 2px;
            text-transform: capitalize;
        }

        p.subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-top: 10px;
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
        }

        /* Update Button Styling */
        .update-btn {
            background-color: #ffd700;
            color: #333;
            border: none;
            padding: 12px 24px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .update-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            background-color: #ffea4a;
        }
        .update-btn:active {
            transform: scale(0.95);
        }

        /* The Grid of Cards */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin-top: 20px;
        }

        /* Individual Card Design */
        .card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            text-decoration: none;
            color: #444;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border: 4px solid transparent;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        /* Fun Hover Effects */
        .card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 20px 30px rgba(0,0,0,0.2);
            border-color: #ffd700;
        }

        /* The Big Icon inside the card */
        .card-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            word-break: break-word;
        }

        /* Loading & Status States */
        #loading {
            color: white;
            font-size: 1.4rem;
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
        }

        /* Color rotations (Assigned by JS) */
        .style-1 { border-bottom: 8px solid #FF6B6B; }
        .style-2 { border-bottom: 8px solid #4ECDC4; }
        .style-3 { border-bottom: 8px solid #FFE66D; }
        .style-4 { border-bottom: 8px solid #1A535C; }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <header>
        <h1 id="repo-name">Loading...</h1>
        <p class="subtitle">Select a mission to begin!</p>
        <br>
        <button class="update-btn" onclick="fetchLatestFiles()">🔄 Update Homework Grid</button>
    </header>

    <div id="loading" style="display: none;">🚀 Syncing files...</div>
    
    <div class="card-grid" id="file-list">
        </div>

    <script>
        const USERNAME = "mr-chen-k12";
        
        // 1. Get the folder name dynamically from the URL path (e.g. "alex" or "miriam")
        const folderName = window.location.pathname.split('/').filter(Boolean).pop() || "alex";
        document.getElementById('repo-name').innerText = folderName;

        // 2. Main function that hits GitHub directly to update your icons dynamically
        async function fetchLatestFiles() {
            const list = document.getElementById('file-list');
            const loading = document.getElementById('loading');
            
            loading.style.display = 'block';
            loading.innerText = "⏳ Scanning your GitHub directory...";
            
            try {
                // Fetch the real-time file tree straight from GitHub's API
                const response = await fetch(`https://api.github.com/repos/${USERNAME}/${folderName}/contents/`);
                if (!response.ok) throw new Error("Could not load files from GitHub API.");
                
                const data = await response.json();
                
                // Filter: HTML files only, exclude layout configurations or administrative tools
                const files = data
                    .filter(f => f.name.endsWith('.html') && !f.name.startsWith('index') && !f.name.startsWith('_') && f.name !== 'generator.html')
                    .map(f => f.name)
                    .sort();
                
                loading.style.display = 'none';
                list.innerHTML = ''; // Clear out the old static layout cards
                
                if (files.length === 0) {
                    list.innerHTML = '<div style="color:white; font-size:1.5rem; grid-column: 1/-1; text-align:center;">All clear! No homework files found. 🎉</div>';
                    return;
                }
                
                // 3. Rebuild and propagate every layout card dynamically on click
                files.forEach((filename, index) => {
                    const a = document.createElement('a');
                    a.href = filename; // Relative directory link matches beautifully
                    
                    // Assign a repeating sequential color pattern style (1-4)
                    const styleNum = (index % 4) + 1;
                    a.className = `card style-${styleNum}`;
                    
                    // Guess and match the rule-based icon assignment
                    let icon = "📄"; // Default
                    const lowerName = filename.toLowerCase();
                    if (lowerName.includes("math")) icon = "📐";
                    else if (lowerName.includes("quiz")) icon = "🏆";
                    else if (lowerName.includes("extra")) icon = "🌟";
                    else if (lowerName.includes("study")) icon = "🧠";
                    else if (lowerName.includes("game")) icon = "🎮";
                    else if (lowerName.includes("reading")) icon = "📚";
                    else if (lowerName.includes("test")) icon = "📝";
                    
                    a.innerHTML = `
                        <div class="card-icon">${icon}</div>
                        <div class="card-title">${cleanName(filename)}</div>
                    `;
                    
                    list.appendChild(a);
                });
                
            } catch (error) {
                loading.innerHTML = `⚠️ Error connecting to GitHub: <br><span style="font-size:1.1rem; color:#ffdddd;">${error.message}</span>`;
            }
        }

        // Helper: Format string structure cleanly for UI layout card titles
        function cleanName(name) {
            return name.replace('.html', '').replace(/-/g, ' ');
        }
    </script>

</body>
</html>
