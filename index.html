<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homework Zone</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* --- FUN STYLING --- */
        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: 2px;
            text-transform: capitalize;
        }

        p.subtitle {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-top: 10px;
            background: rgba(255,255,255,0.2);
            padding: 5px 15px;
            border-radius: 20px;
            display: inline-block;
        }

        /* Update Button Area */
        .controls {
            text-align: center;
            margin-bottom: 10px;
        }

        .update-btn {
            background-color: #ffd700;
            color: #333;
            border: none;
            padding: 12px 24px;
            font-family: 'Fredoka', sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.2s, box-shadow 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .update-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            background-color: #ffea4a;
        }
        .update-btn:active {
            transform: scale(0.95);
        }

        #status-msg {
            color: #ffd700;
            font-size: 0.95rem;
            margin-top: 8px;
            font-style: italic;
            height: 20px;
        }

        /* The Grid of Cards */
        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1000px;
            margin-top: 10px;
        }

        /* Individual Card Design */
        .card {
            background: white;
            border-radius: 20px;
            padding: 20px;
            text-decoration: none;
            color: #444;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            border: 4px solid transparent;
            position: relative;
            overflow: hidden;
            box-sizing: border-box;
        }

        .card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 20px 30px rgba(0,0,0,0.2);
            border-color: #ffd700;
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            word-break: break-word;
        }

        /* Color rotations */
        .style-1 { border-bottom: 8px solid #FF6B6B; }
        .style-2 { border-bottom: 8px solid #4ECDC4; }
        .style-3 { border-bottom: 8px solid #FFE66D; }
        .style-4 { border-bottom: 8px solid #1A535C; }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
    </style>
</head>
<body>

    <header>
        <h1 id="repo-name">Loading...</h1>
        <p class="subtitle">Select a mission to begin!</p>
    </header>

    <div class="controls">
        <button class="update-btn" onclick="fetchLatestFiles()">🔄 Check for New Updates</button>
        <div id="status-msg"></div>
    </div>
    
    <div class="card-grid" id="file-list">
        </div>

    <script>
        const USERNAME = "mr-chen-k12";
        
        // 1. Get folder name dynamically from URL (e.g. "alex" or "miriam")
        const folderName = window.location.pathname.split('/').filter(Boolean).pop() || "alex";
        document.getElementById('repo-name').innerText = folderName;

        // Form unique storage key based on current folder context
        const STORAGE_KEY = `homework_files_${folderName}`;

        // 2. RUN IMMEDIATELY ON LOAD: Look for saved files in Local Storage
        window.addEventListener('DOMContentLoaded', () => {
            const cachedData = localStorage.getItem(STORAGE_KEY);
            const statusMsg = document.getElementById('status-msg');

            if (cachedData) {
                const files = JSON.parse(cachedData);
                renderCards(files);
                statusMsg.innerText = "Loaded cached assignments instantly! ✨";
            } else {
                // If the app runs for the very first time with no cache, run a fallback sync automatically
                statusMsg.innerText = "First-time setup: Fetching initial homework files...";
                fetchLatestFiles();
            }
        });

        // 3. CORE RENDERING ENGINE: Builds layout cards dynamically
        function renderCards(files) {
            const list = document.getElementById('file-list');
            list.innerHTML = ''; // Wipe current elements

            if (files.length === 0) {
                list.innerHTML = '<div style="color:white; font-size:1.5rem; grid-column: 1/-1; text-align:center;">All clear! No homework files found. 🎉</div>';
                return;
            }

            files.forEach((filename, index) => {
                const a = document.createElement('a');
                a.href = filename; // Points cleanly to homework file
                
                // Color iteration calculation (loops 1 to 4)
                const styleNum = (index % 4) + 1;
                a.className = `card style-${styleNum}`;
                
                // Icon picker assignments
                let icon = "📄"; 
                const lowerName = filename.toLowerCase();
                if (lowerName.includes("math")) icon = "📐";
                else if (lowerName.includes("quiz")) icon = "🏆";
                else if (lowerName.includes("extra")) icon = "🌟";
                else if (lowerName.includes("study")) icon = "🧠";
                else if (lowerName.includes("game")) icon = "🎮";
                else if (lowerName.includes("reading")) icon = "📚";
                else if (lowerName.includes("test")) icon = "📝";
                
                a.innerHTML = `
                    <div class="card-icon">${icon}</div>
                    <div class="card-title">${cleanName(filename)}</div>
                `;
                
                list.appendChild(a);
            });
        }

        // 4. MANUAL FORCE SYNC BUTTON FUNCTION
        async function fetchLatestFiles() {
            const statusMsg = document.getElementById('status-msg');
            statusMsg.innerText = "⏳ Checking GitHub for new changes...";
            
            try {
                const response = await fetch(`https://api.github.com/repos/${USERNAME}/${folderName}/contents/`);
                if (!response.ok) throw new Error("Could not load repository folder structure.");
                
                const data = await response.json();
                
                // Filter down to active homework documents
                const files = data
                    .filter(f => f.name.endsWith('.html') && !f.name.startsWith('index') && !f.name.startsWith('_') && f.name !== 'generator.html')
                    .map(f => f.name)
                    .sort();
                
                // Save updated array to user's browser local storage
                localStorage.setItem(STORAGE_KEY, JSON.stringify(files));
                
                // Build fresh structural nodes onto grid
                renderCards(files);
                statusMsg.innerText = "🚀 UI Grid Updated & Saved successfully!";
                
                // Clear success toast indicator after a short delay
                setTimeout(() => { statusMsg.innerText = ""; }, 4000);
                
            } catch (error) {
                statusMsg.innerHTML = `⚠️ Sync Failed: <span style="color:#ffaeae;">${error.message}</span>`;
            }
        }

        // Helper string utility
        function cleanName(name) {
            return name.replace('.html', '').replace(/-/g, ' ');
        }
    </script>

</body>
</html>
