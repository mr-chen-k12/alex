<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT Reading Practice Suite (9-21 Edition)</title>
<style>
    :root {
        --primary-navy: #1e3a8a;
        --primary-hover: #1e40af;
        --accent-orange: #ea580c;
        --accent-orange-hover: #c2410c;
        --success-green: #15803d;
        --success-green-hover: #166534;
        --bg-light: #f8fafc;
        --card-bg: #ffffff;
        --border-color: #e2e8f0;
        --text-dark: #0f172a;
        --text-muted: #64748b;
    }

    * {
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
        background-color: var(--bg-light);
        color: var(--text-dark);
        line-height: 1.65;
        margin: 0;
        padding: 24px 16px;
    }

    #quiz-container {
        max-width: 880px;
        margin: 0 auto;
        background: var(--card-bg);
        padding: 36px 32px;
        border-radius: 16px;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        border: 1px solid var(--border-color);
        position: relative;
    }

    .header-bar {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        margin-bottom: 28px;
        border-bottom: 2px solid #f1f5f9;
        padding-bottom: 18px;
    }

    h1 {
        margin: 0;
        color: var(--primary-navy);
        font-size: 1.85em;
        font-weight: 800;
        letter-spacing: -0.02em;
    }

    .subtitle {
        font-size: 0.9em;
        color: var(--text-muted);
        font-weight: 500;
        margin-top: 2px;
    }

    .set-selector-wrapper {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .set-selector-wrapper label {
        font-weight: 600;
        color: var(--text-dark);
        font-size: 0.95em;
    }

    select.set-dropdown {
        padding: 9px 16px;
        font-size: 15px;
        font-weight: 600;
        border: 2px solid var(--primary-navy);
        border-radius: 8px;
        background-color: #f8fafc;
        color: var(--primary-navy);
        cursor: pointer;
        outline: none;
        transition: all 0.2s ease;
    }

    select.set-dropdown:hover {
        background-color: #eff6ff;
    }

    .print-blank-btn {
        background-color: #475569;
        padding: 9px 16px;
        font-size: 14px;
        border-radius: 8px;
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 600;
        transition: background 0.2s ease;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }

    .print-blank-btn:hover {
        background-color: #334155;
    }

    .progress-tracker {
        text-align: center;
        margin-bottom: 24px;
        font-weight: 700;
        color: var(--primary-navy);
        font-size: 1.05em;
        background: #eff6ff;
        padding: 8px 20px;
        border-radius: 9999px;
        display: inline-block;
        border: 1px solid #bfdbfe;
    }

    .progress-wrapper {
        text-align: center;
    }

    .question-block {
        display: none; 
        margin-bottom: 24px;
    }

    .question-block.active {
        display: block;
    }

    .passage {
        font-family: Georgia, 'Times New Roman', Times, serif;
        background-color: #f8fafc;
        padding: 22px;
        border-left: 5px solid var(--primary-navy);
        border-radius: 6px;
        margin-bottom: 22px;
        font-size: 1.08em;
        color: #1e293b;
        box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
        line-height: 1.7;
    }

    .prompt {
        font-weight: 700;
        font-size: 1.05em;
        margin-bottom: 20px;
        color: var(--text-dark);
    }

    .options {
        list-style-type: none;
        padding: 0;
        margin: 0;
    }

    .options li {
        margin-bottom: 12px;
    }

    .options label {
        display: flex;
        align-items: flex-start;
        background: #ffffff;
        padding: 14px 18px;
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s ease;
        border: 1.5px solid var(--border-color);
        font-size: 1em;
    }

    .options label:hover {
        background: #f1f5f9;
        border-color: #93c5fd;
    }

    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.8;
    }

    .options input[type="radio"] {
        margin-right: 14px;
        margin-top: 3px;
        flex-shrink: 0;
        accent-color: var(--primary-navy);
        transform: scale(1.2);
    }

    .feedback {
        margin-top: 22px;
        padding: 18px 22px;
        border-radius: 10px;
        display: none;
        border-left: 5px solid;
        font-size: 0.98em;
        line-height: 1.6;
    }

    .feedback.correct {
        background-color: #f0fdf4;
        color: #14532d;
        border-color: var(--success-green);
        display: block;
    }

    .feedback.incorrect {
        background-color: #fef2f2;
        color: #7f1d1d;
        border-color: #dc2626;
        display: block;
    }

    .feedback.warning {
        background-color: #fefce8;
        color: #713f12;
        border-color: #eab308;
        display: block;
        font-weight: 600;
    }

    .nav-buttons {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 32px;
        border-top: 2px solid #f1f5f9;
        padding-top: 22px;
        gap: 12px;
    }

    button.btn {
        padding: 11px 24px;
        font-size: 15px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        background-color: var(--primary-navy);
        color: white;
        transition: background 0.2s ease, transform 0.1s ease;
    }

    button.btn:hover { background-color: var(--primary-hover); }
    button.btn:active { transform: scale(0.98); }
    button.btn:disabled { background-color: #cbd5e1; cursor: not-allowed; transform: none; }
    
    .check-btn { background-color: var(--accent-orange); }
    .check-btn:hover { background-color: var(--accent-orange-hover); }
    .check-btn:disabled { background-color: #fdba74; }
    
    .submit-btn { background-color: var(--success-green); }
    .submit-btn:hover { background-color: var(--success-green-hover); }

    #results {
        display: none;
        padding: 28px;
        background: #f8fafc;
        border: 2px solid var(--border-color);
        border-radius: 12px;
        margin-bottom: 30px;
        text-align: center;
    }

    #score-display {
        font-size: 1.75em;
        font-weight: 800;
        color: var(--primary-navy);
        margin: 12px 0;
    }

    #univ-reward {
        display: none;
        margin-top: 25px;
        padding: 28px;
        background: #ffffff;
        border: 3px double #a51c30;
        border-radius: 12px;
        box-shadow: 0 10px 20px rgba(0,0,0,0.06);
        animation: pullUp 0.5s ease-out;
    }

    #univ-reward img {
        width: 150px;
        height: auto;
        margin: 16px auto;
        display: block;
    }

    .univ-text {
        font-family: Georgia, 'Times New Roman', serif;
        font-size: 1.35em;
        font-weight: bold;
        letter-spacing: 1px;
    }

    .certificate-title {
        text-transform: uppercase;
        font-size: 0.85em;
        color: #64748b;
        letter-spacing: 2px;
        margin-top: 4px;
        font-weight: 700;
    }

    #print-blank-container {
        display: none;
    }

    @keyframes pullUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    @media print {
        body { background-color: white; padding: 0; }
        
        #quiz-container { box-shadow: none; max-width: 100%; border: none; padding: 0; }
        
        .question-block { 
            display: block !important; 
            page-break-inside: avoid; 
            border-bottom: 1px solid #cbd5e1; 
            padding-bottom: 25px;
            margin-bottom: 25px;
        }

        .header-bar, .nav-buttons, .progress-wrapper, .print-blank-btn, select { 
            display: none !important; 
        }

        .options label { border: none; padding: 4px 0; background: transparent; }
        .options input { appearance: auto; } 

        #univ-reward {
            display: block !important;
            border-style: solid !important;
            border-width: 2px !important;
        }

        body.print-blank-mode #quiz-container { display: none !important; }
        body.print-blank-mode #print-blank-container { display: block !important; }
    }

    @media screen and (max-width: 650px) {
        .header-bar {
            flex-direction: column;
            align-items: stretch;
        }
        .set-selector-wrapper {
            justify-content: space-between;
        }
        .nav-buttons {
            flex-wrap: wrap;
        }
        button.btn {
            flex: 1 1 45%;
        }
    }
</style>
</head>
<body>

<div id="quiz-container">
    <div class="header-bar">
        <div>
            <h1>SAT Reading Practice Exam</h1>
            <div class="subtitle">Official Digital Practice Suite • Edition 9-21</div>
        </div>
        <div class="set-selector-wrapper">
            <label for="set-select">Select Set:</label>
            <select id="set-select" class="set-dropdown" onchange="switchSet(this.value)">
                <option value="A">Set A - Core Analysis (Inc. Violin)</option>
                <option value="B">Set B - Intermediate Inference</option>
                <option value="C">Set C - Advanced Synthesis</option>
            </select>
            <button class="print-blank-btn" onclick="printBlankQuiz()">🖨️ Print Blank</button>
        </div>
    </div>

    <div class="progress-wrapper">
        <div class="progress-tracker" id="progress-tracker">Set A | Question 1 of 10</div>
    </div>
    
    <div id="results">
        <h2>Set Completed!</h2>
        <div id="score-display"></div>
        <p style="color: #64748b;">Review all question explanations below or select another set from the menu above.</p>
        
        <div id="univ-reward">
            <div class="certificate-title">Official Distinction of Academic Excellence</div>
            <div class="univ-text" id="univ-reward-title">★ FLAWLESS ACADEMIC EXCELLENCE ★</div>
            <img id="univ-reward-img" src="" alt="University Crest">
            <p id="univ-reward-text" style="color: #334155; font-style: italic; font-weight: 600; margin-top: 12px;"></p>
        </div>

        <button class="btn" onclick="window.print()" style="margin-top: 20px; background-color: var(--primary-navy);">🖨️ Print Results Summary</button>
    </div>

    <div id="questions-wrapper">
        <!-- Questions dynamically injected via JavaScript -->
    </div>

    <div class="nav-buttons" id="nav-buttons">
        <button class="btn" id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="btn check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button class="btn" id="next-btn" onclick="navigate(1)">Next</button>
        <button class="btn submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit Set for Review</button>
    </div>
</div>

<div id="print-blank-container"></div>

let currentSetKey = 'A';
let currentQuestionIndex = 0;
let userAnswers = {}; // Map: `${setKey}-${qIndex}` -> selected option
let isQuestionLocked = {}; // Map: `${setKey}-${qIndex}` -> boolean

function initSet(setKey) {
    currentSetKey = setKey;
    currentQuestionIndex = 0;
    
    if (!userAnswers[setKey]) {
        userAnswers[setKey] = new Array(quizSets[setKey].length).fill(null);
    }
    if (!isQuestionLocked[setKey]) {
        isQuestionLocked[setKey] = new Array(quizSets[setKey].length).fill(false);
    }

    renderInteractiveQuestions();
    renderPrintBlankVersion();
    
    document.getElementById('results').style.display = 'none';
    document.getElementById('nav-buttons').style.display = 'flex';
    document.getElementById('progress-tracker').style.display = 'inline-block';
    
    showQuestion(0);
}

function switchSet(newSetKey) {
    initSet(newSetKey);
}

function renderInteractiveQuestions() {
    const wrapper = document.getElementById('questions-wrapper');
    wrapper.innerHTML = '';
    const questions = quizSets[currentSetKey];

    questions.forEach((q, qIndex) => {
        const qBlock = document.createElement('div');
        qBlock.className = `question-block ${qIndex === 0 ? 'active' : ''}`;
        qBlock.id = `q-block-${qIndex}`;

        let optionsHTML = '';
        q.options.forEach((opt, optIndex) => {
            optionsHTML += `
                <li>
                    <label id="lbl-${qIndex}-${optIndex}">
                        <input type="radio" name="q-${currentSetKey}-${qIndex}" value="${optIndex}" onchange="selectOption(${qIndex}, ${optIndex})">
                        <span><strong>${String.fromCharCode(65 + optIndex)})</strong> ${opt}</span>
                    </label>
                </li>
            `;
        });

        qBlock.innerHTML = `
            <div class="passage">${q.passage}</div>
            <div class="prompt">${q.prompt}</div>
            <ul class="options">${optionsHTML}</ul>
            <div class="feedback" id="feedback-${qIndex}"></div>
        `;

        wrapper.appendChild(qBlock);
    });
}

function renderPrintBlankVersion() {
    const container = document.getElementById('print-blank-container');
    const questions = quizSets[currentSetKey];
    
    let printHTML = `
        <div style="text-align: center; margin-bottom: 25px;">
            <h1 style="color: #1e3a8a; margin-bottom: 5px;">SAT Reading Practice Exam (Edition 9-21)</h1>
            <h2 style="color: #475569; margin-top: 0; font-size: 1.2em;">Set ${currentSetKey} - Blank Practice Sheet</h2>
            <div style="font-size: 0.9em; color: #64748b;">Name: _______________________ &nbsp;&nbsp;&nbsp;&nbsp; Date: _______________ &nbsp;&nbsp;&nbsp;&nbsp; Score: ______ / 10</div>
        </div>
        <hr style="border: 0; border-top: 1px solid #cbd5e1; margin-bottom: 30px;">
    `;

    questions.forEach((q, qIndex) => {
        let printOptionsHTML = '';
        q.options.forEach((opt, optIndex) => {
            const letter = String.fromCharCode(65 + optIndex);
            printOptionsHTML += `
                <li style="margin-bottom: 10px; display: flex; align-items: baseline;">
                    <span style="font-weight: bold; width: 28px;">${letter})</span>
                    <span>${opt}</span>
                </li>
            `;
        });

        printHTML += `
            <div style="margin-bottom: 35px; page-break-inside: avoid;">
                <p style="font-weight: bold; font-size: 1.05em; color: #1e3a8a; margin-bottom: 8px;">Question ${qIndex + 1}</p>
                <div style="font-family: Georgia, serif; padding: 14px; background-color: #f8fafc; border-left: 4px solid #1e3a8a; margin-bottom: 12px; line-height: 1.5;">${q.passage}</div>
                <p style="font-weight: 600; margin-bottom: 12px;">${q.prompt}</p>
                <ul style="list-style-type: none; padding-left: 5px;">${printOptionsHTML}</ul>
            </div>
        `;
    });

    container.innerHTML = printHTML;
}

function selectOption(qIndex, optIndex) {
    if (isQuestionLocked[currentSetKey][qIndex]) return;

    userAnswers[currentSetKey][qIndex] = optIndex;
    
    const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
    if (feedbackDiv.classList.contains('warning')) {
        feedbackDiv.style.display = 'none';
    }
}

function checkAnswer() {
    const qIndex = currentQuestionIndex;
    const selected = userAnswers[currentSetKey][qIndex];
    const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
    const q = quizSets[currentSetKey][qIndex];

    if (selected === null || selected === undefined) {
        feedbackDiv.innerHTML = "⚠️ Please select an answer option before checking.";
        feedbackDiv.className = "feedback warning";
        return;
    }

    if (isQuestionLocked[currentSetKey][qIndex]) return;

    isQuestionLocked[currentSetKey][qIndex] = true;

    // Disable radio choices
    const radios = document.getElementsByName(`q-${currentSetKey}-${qIndex}`);
    radios.forEach(r => r.disabled = true);
    q.options.forEach((_, optIdx) => {
        const lbl = document.getElementById(`lbl-${qIndex}-${optIdx}`);
        if (lbl) lbl.classList.add('disabled');
    });

    updateNavState();

    if (selected === q.correctAnswer) {
        feedbackDiv.innerHTML = `<strong>✓ Correct!</strong><br><br><strong>Explanation:</strong> ${q.explanation}`;
        feedbackDiv.className = "feedback correct";
    } else {
        const correctLetter = String.fromCharCode(65 + q.correctAnswer);
        feedbackDiv.innerHTML = `<strong>✕ Incorrect.</strong> The correct answer is <strong>${correctLetter}) ${q.options[q.correctAnswer]}</strong>.<br><br><strong>Explanation:</strong> ${q.explanation}`;
        feedbackDiv.className = "feedback incorrect";
    }
}

function showQuestion(index) {
    const questions = quizSets[currentSetKey];
    if (index < 0 || index >= questions.length) return;

    document.querySelectorAll('.question-block').forEach(el => el.classList.remove('active'));
    
    const targetBlock = document.getElementById(`q-block-${index}`);
    if (targetBlock) targetBlock.classList.add('active');

    currentQuestionIndex = index;

    // Restore radio button selection if previously selected
    const savedAns = userAnswers[currentSetKey][index];
    if (savedAns !== null && savedAns !== undefined) {
        const radios = document.getElementsByName(`q-${currentSetKey}-${index}`);
        if (radios[savedAns]) radios[savedAns].checked = true;
    }

    document.getElementById('progress-tracker').textContent = `Set ${currentSetKey} | Question ${index + 1} of ${questions.length}`;
    
    updateNavState();
}

function navigate(direction) {
    showQuestion(currentQuestionIndex + direction);
}

function updateNavState() {
    const totalQ = quizSets[currentSetKey].length;
    document.getElementById('prev-btn').disabled = currentQuestionIndex === 0;

    if (currentQuestionIndex === totalQ - 1) {
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('submit-btn').style.display = 'inline-block';
    } else {
        document.getElementById('next-btn').style.display = 'inline-block';
        document.getElementById('submit-btn').style.display = 'none';
    }

    const checkBtn = document.getElementById('check-btn');
    if (isQuestionLocked[currentSetKey][currentQuestionIndex]) {
        checkBtn.disabled = true;
        checkBtn.textContent = "Answer Checked";
    } else {
        checkBtn.disabled = false;
        checkBtn.textContent = "Check Answer";
    }
}

function submitQuiz() {
    const questions = quizSets[currentSetKey];
    let score = 0;

    questions.forEach((q, qIndex) => {
        const qBlock = document.getElementById(`q-block-${qIndex}`);
        const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
        
        qBlock.classList.add('active'); // Show all questions for review

        const selected = userAnswers[currentSetKey][qIndex];

        const radios = document.getElementsByName(`q-${currentSetKey}-${qIndex}`);
        radios.forEach(r => r.disabled = true);

        isQuestionLocked[currentSetKey][qIndex] = true;

        if (selected === q.correctAnswer) {
            score++;
            if (!feedbackDiv.classList.contains('correct')) {
                feedbackDiv.innerHTML = `<strong>✓ Correct!</strong><br><br><strong>Explanation:</strong> ${q.explanation}`;
                feedbackDiv.className = "feedback correct";
            }
        } else {
            const correctLetter = String.fromCharCode(65 + q.correctAnswer);
            feedbackDiv.innerHTML = `<strong>✕ ${selected === null || selected === undefined ? 'Unanswered' : 'Incorrect'}.</strong> The correct answer is <strong>${correctLetter}) ${q.options[q.correctAnswer]}</strong>.<br><br><strong>Explanation:</strong> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    });

    document.getElementById('nav-buttons').style.display = 'none';
    document.getElementById('progress-tracker').style.display = 'none';
    
    const resultsDiv = document.getElementById('results');
    resultsDiv.style.display = 'block';

    const percentage = Math.round((score / questions.length) * 100);
    document.getElementById('score-display').textContent = `Score: ${score} / ${questions.length} (${percentage}%)`;

    // Trigger Reward Certificate if 10/10 (100%)
    const rewardDiv = document.getElementById('univ-reward');
    if (score === questions.length) {
        const reward = universityRewards[Math.floor(Math.random() * universityRewards.length)];
        
        document.getElementById('univ-reward-title').style.color = reward.color;
        rewardDiv.style.borderColor = reward.color;
        
        const rewardImg = document.getElementById('univ-reward-img');
        rewardImg.src = reward.img;
        rewardImg.alt = `${reward.name} Crest`;

        document.getElementById('univ-reward-text').textContent = 
            `Congratulations on your flawless 100% score on Set ${currentSetKey}! You have officially earned the ${reward.name} Distinction Certificate of Academic Mastery.`;

        rewardDiv.style.display = 'block';
    } else {
        rewardDiv.style.display = 'none';
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function printBlankQuiz() {
    document.body.classList.add('print-blank-mode');
    window.print();
    document.body.classList.remove('print-blank-mode');
}

window.onload = function() {
    initSet('A');
};
</script>
