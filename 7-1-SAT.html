<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAT Reading Practice - Set 18</title>
<style>
    /* General Styles */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        line-height: 1.6;
        margin: 0;
        padding: 20px;
    }
    #quiz-container {
        max-width: 800px;
        margin: 0 auto;
        background: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        position: relative;
    }
    h1 {
        text-align: center;
        color: #1a5276;
    }
    
    .print-blank-btn {
        position: absolute;
        top: 30px;
        right: 30px;
        background-color: #7f8c8d;
        padding: 8px 12px;
        font-size: 14px;
        border-radius: 4px;
        color: white;
        border: none;
        cursor: pointer;
        transition: background 0.3s;
    }
    .print-blank-btn:hover {
        background-color: #616a6b;
    }

    .question-block {
        display: none; 
        margin-bottom: 20px;
    }
    .question-block.active {
        display: block;
    }
    .passage {
        font-family: Georgia, serif;
        background-color: #f9f9f9;
        padding: 15px;
        border-left: 4px solid #1a5276;
        margin-bottom: 20px;
        font-size: 1.05em;
    }
    .prompt {
        font-weight: bold;
        margin-bottom: 15px;
    }
    .options {
        list-style-type: none;
        padding: 0;
    }
    .options li {
        margin-bottom: 10px;
    }
    .options label {
        display: flex;
        align-items: baseline;
        background: #f0f3f4;
        padding: 10px 15px;
        border-radius: 5px;
        cursor: pointer;
        transition: background 0.2s;
        border: 1px solid #d5dbdb;
    }
    .options label:hover {
        background: #e5e8e8;
    }
    .options label.disabled {
        cursor: not-allowed;
        opacity: 0.7;
    }
    .options input {
        margin-right: 15px;
    }
    .feedback {
        margin-top: 15px;
        padding: 15px;
        border-radius: 4px;
        display: none;
        border-left: 4px solid;
    }
    .feedback.correct {
        background-color: #d4efdf;
        color: #145a32;
        border-color: #1e8449;
        display: block;
    }
    .feedback.incorrect {
        background-color: #fadbd8;
        color: #7b241c;
        border-color: #c0392b;
        display: block;
    }
    .feedback.warning {
        background-color: #fcf3cf;
        color: #7d6608;
        border-color: #f1c40f;
        display: block;
        font-weight: bold;
    }
    .nav-buttons {
        display: flex;
        justify-content: space-between;
        margin-top: 30px;
        border-top: 2px solid #eee;
        padding-top: 20px;
    }
    button {
        padding: 10px 20px;
        font-size: 16px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        background-color: #1a5276;
        color: white;
        transition: background 0.3s;
    }
    button:hover { background-color: #154360; }
    button:disabled { background-color: #bdc3c7; cursor: not-allowed; }
    
    .check-btn { background-color: #d35400; }
    .check-btn:hover { background-color: #a04000; }
    .check-btn:disabled { background-color: #e59866; }
    
    .submit-btn { background-color: #27ae60; }
    .submit-btn:hover { background-color: #1e8449; }
    
    #results {
        display: none;
        text-align: center;
        padding: 20px;
        background: #eafaf1;
        border: 2px solid #2ecc71;
        border-radius: 8px;
        margin-bottom: 30px;
    }
    .progress-tracker {
        text-align: center;
        margin-bottom: 20px;
        font-weight: bold;
        color: #7f8c8d;
    }

    #harvard-reward {
        display: none;
        margin-top: 20px;
        padding: 20px;
        background: #fff;
        border: 3px double #a51c30;
        border-radius: 8px;
        animation: pullUp 0.5s ease-out;
    }
    #harvard-reward img {
        width: 160px;
        height: auto;
        margin: 15px auto;
        display: block;
    }
    .harvard-text {
        color: #a51c30;
        font-family: Georgia, serif;
        font-size: 1.4em;
        font-weight: bold;
        letter-spacing: 1px;
    }

    #print-blank-container {
        display: none;
    }

    @keyframes pullUp {
        from { transform: translateY(20px); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
    }

    /* Printer Friendly Styles */
    @media print {
        body { background-color: white; padding: 0; }
        
        #quiz-container { box-shadow: none; max-width: 100%; border: none; padding: 0; }
        .question-block { 
            display: block !important; 
            page-break-inside: avoid; 
            border-bottom: 1px solid #ccc; 
            padding-bottom: 20px;
            margin-bottom: 20px;
        }
        .nav-buttons, .check-btn, .progress-tracker, button, .print-blank-btn { display: none !important; }
        .options label { border: none; padding: 5px 0; background: transparent; }
        .options input { appearance: auto; } 

        #harvard-reward {
            display: block !important;
            border: 2px solid #a51c30 !important;
        }

        /* Override for Blank Print Mode */
        body.print-blank-mode #quiz-container { display: none !important; }
        body.print-blank-mode #print-blank-container { display: block !important; }
    }

    @media screen and (max-width: 600px) {
        .print-blank-btn {
            position: relative;
            top: 0;
            right: 0;
            display: block;
            margin: 0 auto 20px auto;
        }
    }
</style>
</head>
<body>

<div id="quiz-container">
    <button class="print-blank-btn" onclick="printBlankQuiz()">🖨️ Print Blank Quiz</button>
    <h1>SAT Reading Practice - Set 18</h1>
    <div class="progress-tracker" id="progress-tracker">Question 1 of 10</div>
    
    <div id="results">
        <h2>Quiz Complete</h2>
        <p id="score-display" style="font-size: 1.5em; font-weight: bold;"></p>
        <p>Review your answers and explanations below.</p>
        
        <div id="harvard-reward">
            <div class="harvard-text">★ FLAWLESS ACADEMIC EXCELLENCE ★</div>
            <img src="https://mr-chen-k12.github.io/math/IMG_0232.png" alt="Harvard University Crest">
            <p style="color: #555; font-style: italic; font-weight: bold; margin-top: 5px;">You have successfully earned the Harvard University verification crest for achieving a perfect 10/10 score.</p>
        </div>

        <button onclick="window.print()" style="margin-top: 15px;">🖨️ Print Results</button>
    </div>

    <div id="questions-wrapper">
        </div>

    <div class="nav-buttons" id="nav-buttons">
        <button id="prev-btn" onclick="navigate(-1)" disabled>Previous</button>
        <button class="check-btn" id="check-btn" onclick="checkAnswer()">Check Answer</button>
        <button id="next-btn" onclick="navigate(1)">Next</button>
        <button class="submit-btn" id="submit-btn" onclick="submitQuiz()" style="display:none;">Submit for Review</button>
    </div>
</div>

<div id="print-blank-container"></div>

<script>
    const quizData = [
        {
            passage: "While many economic historians describe the transition from agricultural to industrial labor markets as a chaotic and unpredictable upheaval, Dr. Elena Rostova argues that the shift was remarkably _______; her thorough analysis of nineteenth-century parish records reveals a highly ordered, structured migration pattern guided by regional wage equilibrium.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["tumultuous", "orderly", "circuitous", "arbitrary"],
            correctAnswer: 1,
            explanation: "'Orderly' means neatly and methodically arranged. The passage uses the contrast word 'While' to shift from the traditional view of the industrial transition as 'chaotic and unpredictable' to Dr. Rostova's new perspective, which describes the process as 'highly ordered' and 'structured'—making orderly the correct choice."
        },
        {
            passage: "Historically, deep-sea coral reefs were considered isolated habitats, dependent entirely on organic matter sinking from the ocean surface. However, a recent expedition led by marine biologist Dr. Julian Silva discovered that these ecosystems are dynamically sustained by deep lateral currents that sweep nutrients along continental slopes. Silva's team observed that these currents provide a constant, predictable supply of micro-plankton, enabling coral colonies to thrive even in areas with low surface productivity. This finding reframes our understanding of deep-sea ecological connectivity.",
            prompt: "Which choice best states the main idea of the text?",
            options: [
                "Deep-sea coral reefs are facing an unprecedented collapse due to changes in surface ocean temperatures.",
                "New evidence shows that deep-sea coral ecosystems are sustained by lateral nutrient currents rather than relying solely on sinking surface material.",
                "Micro-plankton are incapable of surviving in ecosystems that lack access to direct solar radiation.",
                "Marine biologists have determined that continental slopes are completely devoid of organic material."
            ],
            correctAnswer: 1,
            explanation: "The passage sets up a contrast between an old assumption (deep-sea corals depend entirely on material sinking from the surface) and a new discovery by Dr. Silva (they are sustained dynamically by deep lateral currents bringing micro-plankton). Option B accurately restates this main point."
        },
        {
            passage: "Literary scholar Dr. Naomi Brooks argues that in his mid-twentieth-century plays, Arthur Miller uses specific lighting shifts—rather than character dialogue—to signal a character's descent into psychological delusion, altering the color palette from warm amber to a sterile, harsh blue whenever a protagonist loses touch with reality.",
            prompt: "Which quotation from a theatrical analysis of Miller's plays best supports Dr. Brooks's argument?",
            options: [
                "\"Miller's dialogue is heavily imbued with the colloquial speech patterns of post-war Brooklyn working-class families.\"",
                "\"The stage directions explicitly state that as Willy Loman recalls his fictionalized past, the soft amber glow of the kitchen window instantly dissolves into a cold, blinding cobalt light, visually trapping him within his own delusion before he speaks a single word.\"",
                "\"The background music in the first act establishes a somber, melancholic atmosphere that foreshadows the tragic conclusion of the play.\"",
                "\"Characters frequently step into the spotlight to deliver lengthy soliloquies directly to the audience, breaking the traditional fourth wall.\""
            ],
            correctAnswer: 1,
            explanation: "Dr. Brooks asserts that Miller relies on specific lighting shifts (shifting from warm amber to harsh blue) instead of dialogue to visually show a character's descent into psychological delusion. Option B directly provides matching evidence by detailing the stage directions that replace dialogue with an instant shift from amber to blinding cobalt light during a character's delusion."
        },
        {
            passage: "In cognitive science, the \"bilingual advantage\" hypothesis suggests that managing two or more languages structurally enhances executive function, particularly the ability to inhibit irrelevant stimuli. To test this, researchers monitored neural efficiency in monolinguals and bilinguals during an attention-switching task. They discovered that bilingual individuals showed significantly less activation in the prefrontal cortex while maintaining the exact same accuracy levels as monolinguals. Because less neural activation to achieve an identical behavioral output indicates a higher degree of processing efficiency, it follows that long-term bilingualism likely ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "optimizes cognitive resource allocation during complex attentional tasks.",
                "causes a severe decline in a person's working memory over extended durations.",
                "prevents individuals from accurately learning mechanical or mathematical tasks.",
                "requires an unsustainable expenditure of metabolic energy within the brain."
            ],
            correctAnswer: 0,
            explanation: "The passage notes that bilinguals use less brain activation to achieve the exact same performance accuracy, which the researchers explicitly define as 'higher processing efficiency.' Therefore, it logically follows that bilingualism helps optimize cognitive resource allocation when handling attention tasks."
        },
        {
            passage: "Although the senator publicly dismissed the investigative report’s findings as completely _______, privately her advisors scrambled to address the specific instances of structural corruption it exposed, acknowledging that the evidence was too robust to ignore.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["unsubstantiated", "meticulous", "auspicious", "irreversible"],
            correctAnswer: 0,
            explanation: "'Unsubstantiated' means not supported or proven by evidence. The contrast word 'Although' and the phrase 'privately her advisors... acknowledged that the evidence was too robust' demonstrate that while the report was valid, the senator publicly claimed it lacked evidence."
        },
        {
            passage: "Biomimetic material science—a field that copies natural structures to solve engineering problems—has recently focused on the unique architecture of the mantis shrimp’s dactyl club. This predatory appendage can strike prey with the force of a bullet without shattering. Traditional impact armor materials rely on uniform thickness, which makes them heavy and brittle. The mantis shrimp's club, conversely, utilizes a helicoidal arrangement of chitin fibers that dampens impact waves and prevents cracks from propagating. By mimicking this multi-layered, rotating structural layout, engineers have developed ultra-lightweight composites for aerospace vehicles. Consequently, this natural blueprint offers a breakthrough for impact-resistant design.",
            prompt: "Which choice best describes the overall structure of the text?",
            options: [
                "It introduces an engineering framework, contrasts its natural inspiration with a traditional model to demonstrate its efficiency, and outlines its modern manufacturing applications.",
                "It lists several environmental hazards, blames a specific industrial sector for causing them, and demands federal intervention.",
                "It profiles a historic dispute between two material scientists and proposes a compromise.",
                "It traces the chronological evolution of manufacturing armor across multiple centuries."
            ],
            correctAnswer: 0,
            explanation: "The text introduces biomimetic material science and the mantis shrimp dactyl club, contrasts its mechanism against traditional heavy and brittle uniform-thickness armor to show why it is better, and concludes with its practical engineering applications in aerospace composites."
        },
        {
            passage: "Text 1\nThe implementation of automated algorithms in judicial sentencing represents an objective step forward for legal equity. By evaluating historical recidivism data free from human bias, fatigue, or personal prejudice, these computational models provide highly consistent, data-driven recommendations that ensure identical offenses receive standardized treatment across all courtrooms.\n\nText 2\nProponents of algorithmic sentencing operate under a flawed model that treats mathematical equations as inherently neutral, completely overlooking the structural biases embedded within the training data. Because historical arrest records reflect deep-seated systemic discrimination, an algorithm trained on these data points simply automates and legitimizes past prejudices under the guise of technological objectivity. Consequently, these tools perpetuate an unfair feedback loop that disproportionately penalizes vulnerable communities.",
            prompt: "Based on the texts, how would the author of Text 2 most likely respond to the assertion in Text 1 that algorithms are 'free from human bias'?",
            options: [
                "By arguing that algorithms are too computationally slow for modern court systems to utilize.",
                "By suggesting that judicial sentencing should be outsourced entirely to international shipping corporations.",
                "By pointing out that the historical data used to train the algorithms contains systemic human biases, meaning the software simply replicates and entrenches those prejudices.",
                "By asserting that computational models have completely eliminated racial disparities in modern prisons."
            ],
            correctAnswer: 2,
            explanation: "Text 1 states that algorithms ensure sentencing is free from human bias. Text 2 counters this explicitly by stating that because the training data relies on historical arrest records that reflect past systemic discrimination, the algorithm simply automates and perpetuates those human biases under a false veneer of neutrality. Option C matches this perfectly."
        },
        {
            passage: "Geophysicists using ground-penetrating radar (GPR) surveyed the archaeological site of an ancient Roman villa buried beneath thick layers of soil. Unlike traditional excavation, which requires physically removing earth and risks damaging fragile artifacts, GPR emits high-frequency electromagnetic waves into the subsurface and measures the reflected signals to map underlying anomalies. The survey successfully revealed the precise layout of a massive, intact mosaic floor and several subterranean chambers without moving a single stone. Because this non-invasive methodology leaves the covering matrix entirely intact, it follows that future archaeological surveys of highly sensitive historic heritage sites will likely ________",
            prompt: "Which choice most logically completes the text?",
            options: [
                "revert to heavy mechanical bulldozing to speed up exploration schedules.",
                "rely increasingly on remote sensing technologies to preserve structural integrity while gathering spatial data.",
                "abandon mapping entirely in favor of writing speculative historical fiction.",
                "conclude that ancient Romans lacked any structural engineering or architectural capabilities."
            ],
            correctAnswer: 1,
            explanation: "The text explains that ground-penetrating radar is a non-invasive tool that maps fragile subterranean historical sites perfectly without damaging them or moving soil. For highly sensitive sites, it follows logically that archaeologists will rely on these remote sensing technologies to extract data while keeping the structural integrity preserved."
        },
        {
            passage: "For decades, behavioral ecologists believed that foraging decisions in social insects like leafcutter ants (*Atta cephalotes*) were governed entirely by simple chemical gradients, assuming that individuals merely followed the strongest pheromone trail to a food source. **However, recent micro-tracking experiments revealed that ants actively adjust their trajectory based on localized traffic density, intentionally bypassing shorter, highly congested routes in favor of longer, clearer pathways.** This discovery demonstrates that insect navigation involves complex, decentralized spatial optimization rather than automatic adherence to a single chemical cue.",
            prompt: "Which choice best describes the function of the highlighted sentence in the overall structure of the text?",
            options: [
                "It introduces a statistical error found in modern satellite navigation software.",
                "It outlines a historical timeline of when leafcutter ants first migrated across the Americas.",
                "It presents empirical evidence that challenges a traditional ecological view by demonstrating a sophisticated behavioral strategy.",
                "It details a chemical synthesis method used to create artificial insect pheromones."
            ],
            correctAnswer: 2,
            explanation: "The text begins with a traditional view (ants automatically follow the strongest pheromone trail). The highlighted sentence uses the contrast word 'However' to present a new experimental finding showing ants dynamically navigate around traffic congestion, which directly challenges the old view by revealing a more sophisticated strategy. This is accurately described in option C."
        },
        {
            passage: "While the lead researcher’s presentations at international conferences were notoriously _______ and filled with dramatic, sweeping generalizations designed to attract media attention, his written grant proposals were exceptionally precise, offering highly granular data and rigorous experimental controls.",
            prompt: "Which choice completes the text with the most logical and precise word or phrase?",
            options: ["hyperbolic", "concise", "methodical", "dogmatic"],
            correctAnswer: 0,
            explanation: "'Hyperbolic' means exaggerated or over-the-top. The sentence sets up a contrast using 'While' between his written grants (which are precise and rigorous) and his conference presentations, which are described as being filled with 'dramatic, sweeping generalizations'—making hyperbolic the perfect fit."
        }
    ];

    let currentQuestion = 0;
    let userAnswers = new Array(quizData.length).fill(null);
    let isLocked = new Array(quizData.length).fill(false);

    function initQuiz() {
        const wrapper = document.getElementById('questions-wrapper');
        
        // Build Interactive Web Quiz
        quizData.forEach((q, index) => {
            const qBlock = document.createElement('div');
            qBlock.className = `question-block ${index === 0 ? 'active' : ''}`;
            qBlock.id = `question-${index}`;
            
            let optionsHTML = '';
            q.options.forEach((opt, optIndex) => {
                optionsHTML += `
                    <li>
                        <label id="label-${index}-${optIndex}">
                            <input type="radio" name="q${index}" value="${optIndex}" onchange="saveAnswer(${index}, ${optIndex})">
                            ${opt}
                        </label>
                    </li>
                `;
            });

            qBlock.innerHTML = `
                <div class="passage">${q.passage.replace(/\n/g, '<br>')}</div>
                <div class="prompt">${q.prompt}</div>
                <ul class="options">${optionsHTML}</ul>
                <div class="feedback" id="feedback-${index}"></div>
            `;
            wrapper.appendChild(qBlock);
        });

        // Build Hidden "Blank Print" Version
        let printHTML = '<h1 style="text-align: center; color: #1a5276; margin-bottom: 5px;">SAT Reading Practice - Set 18</h1><h3 style="text-align: center; margin-top: 0; margin-bottom: 30px; color: #555;">Blank Copy</h3><hr style="margin-bottom:30px; border: 0; border-top: 1px solid #ccc;">';
        
        quizData.forEach((q, index) => {
            let printOptionsHTML = '';
            q.options.forEach(opt => {
                printOptionsHTML += `
                    <li style="margin-bottom: 12px; display: flex; align-items: baseline;">
                        <div style="display:inline-block; width:14px; height:14px; border:2px solid #555; border-radius:50%; margin-right:12px; position:relative; top: 2px; flex-shrink: 0;"></div>
                        <span>${opt}</span>
                    </li>
                `;
            });
            
            printHTML += `
                <div style="margin-bottom: 45px; page-break-inside: avoid;">
                    <p style="font-weight: bold; font-size: 1.1em; color: #333;">Question ${index + 1}</p>
                    <div style="font-family: Georgia, serif; padding: 15px; background-color: #f9f9f9; border-left: 4px solid #ccc; margin-bottom: 15px;">${q.passage.replace(/\n/g, '<br>')}</div>
                    <p style="font-weight: bold; margin-bottom: 15px;">${q.prompt}</p>
                    <ul style="list-style-type: none; padding: 0;">${printOptionsHTML}</ul>
                </div>
            `;
        });
        document.getElementById('print-blank-container').innerHTML = printHTML;

        updateNav();
    }

    function saveAnswer(qIndex, optIndex) {
        if (!isLocked[qIndex]) {
            userAnswers[qIndex] = optIndex;
            const feedbackDiv = document.getElementById(`feedback-${qIndex}`);
            if (feedbackDiv.classList.contains('warning')) {
                feedbackDiv.style.display = 'none';
            }
        }
    }

    function checkAnswer() {
        if (isLocked[currentQuestion]) return; 

        const selected = userAnswers[currentQuestion];
        const feedbackDiv = document.getElementById(`feedback-${currentQuestion}`);
        const q = quizData[currentQuestion];
        
        if (selected === null) {
            feedbackDiv.innerHTML = "Please select an answer before checking.";
            feedbackDiv.className = "feedback warning";
            return;
        }

        isLocked[currentQuestion] = true;
        
        const radios = document.getElementsByName(`q${currentQuestion}`);
        radios.forEach(r => r.disabled = true);
        q.options.forEach((_, optIndex) => {
            document.getElementById(`label-${currentQuestion}-${optIndex}`).classList.add('disabled');
        });

        updateNav();

        if (selected === q.correctAnswer) {
            feedbackDiv.innerHTML = `<strong>Correct!</strong><br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback correct";
        } else {
            feedbackDiv.innerHTML = `<strong>Incorrect.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
            feedbackDiv.className = "feedback incorrect";
        }
    }

    function navigate(direction) {
        document.getElementById(`question-${currentQuestion}`).classList.remove('active');
        currentQuestion += direction;
        document.getElementById(`question-${currentQuestion}`).classList.add('active');
        
        document.getElementById('progress-tracker').textContent = `Question ${currentQuestion + 1} of ${quizData.length}`;
        updateNav();
    }

    function updateNav() {
        document.getElementById('prev-btn').disabled = currentQuestion === 0;
        
        if (currentQuestion === quizData.length - 1) {
            document.getElementById('next-btn').style.display = 'none';
            document.getElementById('submit-btn').style.display = 'block';
        } else {
            document.getElementById('next-btn').style.display = 'block';
            document.getElementById('submit-btn').style.display = 'none';
        }

        const checkBtn = document.getElementById('check-btn');
        if (isLocked[currentQuestion]) {
            checkBtn.disabled = true;
            checkBtn.textContent = "Answer Checked";
        } else {
            checkBtn.disabled = false;
            checkBtn.textContent = "Check Answer";
        }
    }

    function submitQuiz() {
        let score = 0;
        
        quizData.forEach((q, index) => {
            const qBlock = document.getElementById(`question-${index}`);
            const feedbackDiv = document.getElementById(`feedback-${index}`);
            
            qBlock.classList.add('active');
            
            if (!isLocked[index]) {
                const radios = document.getElementsByName(`q${index}`);
                radios.forEach(r => r.disabled = true);
                feedbackDiv.innerHTML = `<strong>Unanswered / Not Checked.</strong> The correct answer was: <strong>${q.options[q.correctAnswer]}</strong>.<br><br><em>Explanation:</em> ${q.explanation}`;
                feedbackDiv.className = "feedback incorrect";
            } else {
                if (userAnswers[index] === q.correctAnswer) {
                    score++;
                }
            }
        });

        document.getElementById('nav-buttons').style.display = 'none';
        document.getElementById('progress-tracker').style.display = 'none';
        document.querySelector('.print-blank-btn').style.display = 'none'; 
        
        const resultsDiv = document.getElementById('results');
        resultsDiv.style.display = 'block';
        document.getElementById('score-display').textContent = `You scored ${score} out of ${quizData.length} (${(score/quizData.length)*100}%)`;
        
        if (score === quizData.length) {
            document.getElementById('harvard-reward').style.display = 'block';
        }
        
        window.scrollTo(0, 0);
    }

    function printBlankQuiz() {
        document.body.classList.add('print-blank-mode');
        window.print();
        document.body.classList.remove('print-blank-mode');
    }

    window.onload = initQuiz;
</script>

</body>
</html>
