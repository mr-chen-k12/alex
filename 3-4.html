<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Problem Set Solutions</title>
    
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            }
        };
    </script>

    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .problem-card {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            padding: 20px;
            border-left: 5px solid #3498db;
        }
        .problem-number {
            font-weight: bold;
            font-size: 1.2em;
            color: #2980b9;
            margin-bottom: 10px;
        }
        .question {
            font-size: 1.1em;
            margin-bottom: 15px;
        }
        .toggle-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 1em;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .toggle-btn:hover {
            background-color: #2980b9;
        }
        .solution {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background-color: #e8f6f3;
            border-left: 4px solid #1abc9c;
            border-radius: 4px;
        }
        .math-block {
            margin: 10px 0;
            font-size: 1.1em;
        }
        canvas {
            display: block;
            margin: 10px 0;
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .note {
            font-size: 0.9em;
            color: #7f8c8d;
            font-style: italic;
        }
    </style>
</head>
